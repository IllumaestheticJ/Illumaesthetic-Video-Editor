# 240SX (S13 hatch) scan reel v4 - FINAL. Earlier versions: project_v1..v3.yaml.
# v4 feedback: cuts follow the music (varied holds on the strong accents); the real bumper pull plays
# out before the 1:1 cut; logo under the domain on the last page; x-ray reassembly, translate only.
project: 240sx-scan
format: reel-9x16
output: {path: /home/user/media/work/out/240sx_scan_v4.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music_extended.wav   # approved track + 8 repeated beats (see v3 log)
  start: 0
  fade_out: 0.8

# Strong accents fall every other beat from the drop at 3.07 s (flux analysis in editlog).
beats: [3.07, 8.12, 11.91, 15.70, 16.96, 22.00, 27.80]

timeline:
  - id: irl_match_rear   # pan to the rear; ends on the solved frame (3.800 s); cut ON THE DROP
    dur: 3.07
    src: /home/user/media/240sx/dropbox/v_1838_02.mov
    in: 0.7634
    out: 3.8334
  - transition: {type: cut, note: "1:1 IRL -> scan (rear, cam_B) on the drop"}
  - id: scan_rear   # skin drops below, crash beam rises above, both spin left/right
    dur: 5.05
    src: /home/user/media/work/renders/shots_v3/s1_rear
    src_fps: 15
    interpolate: true
  - id: irl_bumper_pull   # crew pulls the front bumper - plays through the whole pull
    dur: 3.79
    src: /home/user/media/240sx/dropbox/v_1954_41.mov
    in: 2.4434
    out: 6.2334
  - transition: {type: cut, note: "1:1 IRL -> scan (front, cam_D: LM-refined on the 6.2 s frame) - scan bumper starts where the crew holds the real one"}
  - id: scan_front   # bumper starts on top of the real one in the crew's hands, glides up, spins; gentle push-in
    dur: 3.79
    src: /home/user/media/work/renders/shots_v4/s2_front
    src_fps: 15
    interpolate: true
  - id: irl_scanner   # quick 2-beat scanner shot
    dur: 1.26
    src: /home/user/media/240sx/dropbox/v_1838_14.mov
    in: 0.60
    out: 1.86
  - id: scan_xray   # x-ray: parts translate back on; orbit ends on the listing render's angle
    dur: 5.04
    src: /home/user/media/work/renders/shots_v4/s3_xray
    src_fps: 15
    interpolate: true
  - transition: {type: dissolve, duration: 0.5, note: "x-ray scan -> same-angle listing render"}
  - id: website   # S13 240SX scan listing; zoom-out lands on the 24.53 s accent; title, URL, logo
    dur: 6.30
    src: /home/user/media/work/out/webzoom_240sx_v4.mp4

overlays:
  - src: /home/user/media/work/out/hud_240sx_v4.mov
    start: 0
