# 240SX (S13 hatch) scan reel v2 - opens on the 1:1 IRL->scan cut, which continues
# straight into the rear-bumper teardown. v1 kept in project_v1.yaml.
# Feedback addressed: open on the 1:1 cut; tighter scan framing; rear bumper removal continues
# from the match; bumpers explode out and flip to show inside + outside were scanned.
project: 240sx-scan
format: reel-9x16
output: {path: /home/user/media/work/out/240sx_scan_v2.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  # Track from the approved Oct 31 IRL edit; 95.7 BPM, beat = 0.627 s, first downbeat 3.07 s.
  path: /home/user/media/240sx/dropbox/edited_oct31_1330_46.mp4
  start: 0
  fade_out: 0.6

beats: [1.82, 8.10, 10.63, 15.70, 18.23, 20.11, 22.75]   # 1.82 = 3.07 - 2 beats (intro phase)

timeline:
  - id: irl_match_A   # pan to the rear bumper, ends EXACTLY on the matched frame (3.800 s)
    dur: 1.82
    src: /home/user/media/240sx/dropbox/v_1838_02.mov
    in: 2.0134
    out: 3.8334
    note: "last frame == match/points_B.json frame; trim from the head only"
  - transition: {type: cut, note: "1:1 perspective cut IRL -> scan at 1.82 s (the hook)"}
  - id: scan_match_rear   # cam_B: rear skin explodes out, crash beam out, both flip to show the inside
    dur: 6.28
    src: /home/user/media/work/renders/shots_v2/s1_match_rear
    src_fps: 15
    interpolate: true
  - id: irl_bumper_off   # crew pulls the front bumper
    dur: 2.53
    src: /home/user/media/240sx/dropbox/v_1954_41.mov
    in: 3.69
    out: 6.22
  - id: scan_front   # front bumper explodes off the chassis scan, then flips to show the inside
    dur: 5.07
    src: /home/user/media/work/renders/shots_v2/s3_front
    src_fps: 15
    interpolate: true
  - id: irl_scanner   # handheld scanner screen against the powdered flank
    dur: 2.53
    src: /home/user/media/240sx/dropbox/v_1838_14.mov
    in: 0.60
    out: 3.13
  - id: scan_hero   # tight 3/4 orbit, 3 mm mesh
    dur: 1.88
    src: /home/user/media/work/renders/shots_v2/s4_hero
    src_fps: 15
    interpolate: true
  - id: end_card   # house logo card from the approved edit
    dur: 2.64
    src: /home/user/media/240sx/dropbox/edited_oct31_1330_46.mp4
    in: 20.11
    out: 22.75

overlays:
  - src: /home/user/media/work/out/hud_240sx_v2.mov   # `ive hud projects/240sx-scan/overlay.json ...`
    start: 0
