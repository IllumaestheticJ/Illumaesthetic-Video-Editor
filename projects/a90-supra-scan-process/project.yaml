# Toyota A90 Supra - scan-process reel v2 (240SX format, option b; all-reels v2 brief + user addendum A-D).
# Plan: direction.md (scene-director). Real car pulls up -> 1:1 cut (cam_B, match 39.200 s, car ~67 % of the width)
# -> rear styling, bumper ON (no scan under the rear bumper) -> real pan along the right side -> FRONT BUMPER HERO
# (off toward camera, inside turned, push in on the Under Front Bumper scan: crash beam, radiator, ducts) -> right-front
# fender off (Under Fender) -> same-pose x-ray switch, parts home, arc to the listing camera -> listing (WebZoom).
# Cuts = 1-frame fades (type cut clones a duplicate frame - Suzuki lesson); each outgoing clip carries +1 real frame.
# Frames @30: cuts 95 208 245 433 508 | dissolve 688-703 | end 845 (28.18 s bar). Kicks: 0.682 + 0.625k.
project: a90-supra-scan-process
format: reel-9x16
output: {path: /home/user/media/work/out/a90_scan_process_v2.0.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/a90-supra-scan-process/music/supra_phonk.mp3   # original Supra track (cloudfront)
  start: 0
  fade_out: 0.6

beats: [3.182, 6.932, 8.182, 9.432, 10.682, 14.432, 15.682, 16.932, 18.182, 23.182, 25.682, 28.182]

timeline:
  - id: irl_open        # the Supra pulls up behind the camera car; ends on the solved frame 39.200 s
    src: /home/user/media/a90-supra-scan-process/dropbox/v_0713_1944_44.mov
    in: 36.05
    out: 39.2167
    dur: 3.1667
  - transition: {type: dissolve, duration: 0.0333, note: "hard 1:1 cut IRL -> scan (cam_B) on the 3.182 s bar; 1-frame fade = cut without the cloned frame"}
  - id: s1_rear         # cam_B hold, push in to the rear-right corner; rear bumper stays ON
    src: /home/user/media/work/a90sp/renders/v2_s1_rear
    src_fps: 15
    interpolate: true
    dur: 3.8
  - transition: {type: dissolve, duration: 0.0333}
  - id: irl_pan         # real car rolling, right side past the rear wheel (rear -> side travel)
    src: /home/user/media/a90-supra-scan-process/dropbox/v_0713_1940_51.mov
    in: 10.0
    out: 11.2667
    dur: 1.2667
  - transition: {type: dissolve, duration: 0.0333}
  - id: s2_front        # HERO: front bumper off toward camera, inside turned, push in on the Under Front Bumper
    src: /home/user/media/work/a90sp/renders/v2_s2_front
    src_fps: 15
    interpolate: true
    dur: 6.3
  - transition: {type: dissolve, duration: 0.0333}
  - id: s3_fender       # right-front fender section off on the 15.68 lift, push in on Under Fender
    src: /home/user/media/work/a90sp/renders/v2_s3_fender
    src_fps: 15
    interpolate: true
    dur: 2.5333
  - transition: {type: dissolve, duration: 0.0333, note: "same-pose look switch silver -> x-ray"}
  - id: s4_xray         # parts home, arc to cam_listing, morph to listing grey
    src: /home/user/media/work/a90sp/renders/v2_s4_xray
    src_fps: 15
    interpolate: true
    dur: 6.5
  - transition: {type: dissolve, duration: 0.5, note: "x-ray grey on the listing angle -> listing screenshot"}
  - id: website         # WebZoom: zoom-out lands 25.68; title, logo, URL last; ends on the 28.18 bar
    src: /home/user/media/work/out/webzoom_a90_v2.mp4
    dur: 4.9333
    hold_start: 0.3

overlays:
  - src: /home/user/media/work/out/hud_a90_scan_process_v2.mov
    start: 0
