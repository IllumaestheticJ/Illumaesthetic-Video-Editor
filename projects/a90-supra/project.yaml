# Toyota A90 Supra - Temerario-style scan reel v1 (scan only: no IRL footage, no text).
# Satin-metallic silver scan on pure black, house look from blender/scan_render.py via tools/shots.py.
# Shots are defined in shots/*.json (generated by tools/plan.py) and rendered by tools/render_all.sh
# at 75 % res, 12 spp, 15 fps; assemble interpolates to 30 fps (minterpolate).
# Music: original procedural score tools/music.py, 96 BPM -> bar = 2.5 s = 75 frames @ 30 fps.
# Every cut is on a bar downbeat; clip durs are whole frames, first clip one frame short (FG2 lesson:
# the assembler adds a 1-frame hold per cut).
project: a90-supra
format: reel-9x16
output: {path: /home/user/media/work/out/a90_supra_scan_v1.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/a90/music/a90_score.wav   # python projects/a90-supra/tools/music.py <this path>
  start: 0
  fade_out: 0.3          # the score has its own reverb-tail fade

# bar downbeats (s). Cuts: 5.0 10.0 12.5 15.0 17.5 20.0 25.0 32.5; hits: 25.0 explode, 30.0 reassembly impact, 32.5 logo
beats: [0.0, 2.5, 5.0, 7.5, 10.0, 12.5, 15.0, 17.5, 20.0, 22.5, 25.0, 27.5, 30.0, 32.5, 35.0]

timeline:
  - id: s01_front34      # bars 1-2: front 3/4 turntable, fades up from black with the drone
    src: /home/user/media/work/a90/renders/s01_front34
    src_fps: 15
    interpolate: true
    dur: 4.9667
    vf: "fade=t=in:st=0:d=1.2"
  - transition: {type: cut, note: "bar 3 - hats enter"}
  - id: s02_rear34       # bars 3-4: low rear 3/4 orbit
    src: /home/user/media/work/a90/renders/s02_rear34
    src_fps: 15
    interpolate: true
    dur: 5.0
  - transition: {type: cut, note: "bar 5 - kick enters, tick accent"}
  - id: s03_arch         # bar 5: front wheel arch (hub/brake/suspension - the car has no wheels)
    src: /home/user/media/work/a90/renders/s03_arch
    src_fps: 15
    interpolate: true
    dur: 2.5
  - transition: {type: cut, note: "bar 6 tick"}
  - id: s04_headlight    # bar 6
    src: /home/user/media/work/a90/renders/s04_headlight
    src_fps: 15
    interpolate: true
    dur: 2.5
  - transition: {type: cut, note: "bar 7 tick"}
  - id: s05_taillight    # bar 7
    src: /home/user/media/work/a90/renders/s05_taillight
    src_fps: 15
    interpolate: true
    dur: 2.5
  - transition: {type: cut, note: "bar 8 tick"}
  - id: s06_side         # bar 8: low glide along the right flank (no trunk-open shot: see editlog)
    src: /home/user/media/work/a90/renders/s06_side
    src_fps: 15
    interpolate: true
    dur: 2.5
  - transition: {type: cut, note: "bar 9 - riser starts, drums thin out"}
  - id: s07_topdown      # bars 9-10: rise to straight overhead, nose up
    src: /home/user/media/work/a90/renders/s07_topdown
    src_fps: 15
    interpolate: true
    dur: 5.0
  - transition: {type: cut, note: "bar 11 - riser resolves into the hit, panels fly off"}
  - id: s08_explode      # bars 11-13: explode (bumpers tip to show inside, fender turns), land on bar 13 impact (30.0 s)
    src: /home/user/media/work/a90/renders/s08_explode
    src_fps: 15
    interpolate: true
    dur: 7.5
  - transition: {type: cut, note: "bar 14 - logo hit"}
  - id: logo             # ILLUMAESTHETIC end card under the reverb tail (tools/logo_card.sh)
    src: /home/user/media/work/a90/logo_card.mp4
    dur: 6.0
