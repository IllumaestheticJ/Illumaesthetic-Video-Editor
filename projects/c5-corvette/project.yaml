# C5 Corvette scan reel - Temerario style (scan only, no IRL, no text). Shots: shots.py -> tools/shot.py (Blender).
# Durations are whole frames so each cut lands on round(cut*30); first clip one frame short (FG2 lesson).
project: c5-corvette
format: reel-9x16
output: {path: /home/user/media/work/out/c5_corvette_v2.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/c5-corvette_track.mp3   # generated for this car (parent session, ElevenLabs via Higgsfield)
  start: 0
  fade_out: 1.4

# kick grid 107.96 BPM, b = 0.5013 + 0.5557k; cuts on accents (see editlog); 35.513 = logo (b63, biggest hit)
beats: [4.040, 9.393, 13.839, 15.506, 17.174, 22.175, 26.621, 30.512, 35.513]

timeline:
  - id: v2_a_fb_off   # HOOK framed on the nose: front bumper slides straight out from 0.6 s, fades up
    src: /home/user/media/work/renders/c5/v2_a_fb_off
    src_fps: 15
    interpolate: true
    dur: 4.0000
    vf: fade=t=in:st=0:d=1.2
  - transition: {type: cut}
  - id: v2_b_fb_inside   # low head-on push into the exposed crash structure; bumper rises, turns its scanned inside to camera
    src: /home/user/media/work/renders/c5/v2_b_fb_inside
    src_fps: 15
    interpolate: true
    dur: 5.3667
  - transition: {type: cut}
  - id: v2_c_fender   # ON THE DROP (9.393): -X fender lifts off -> inner wheelhouse + mounts
    src: /home/user/media/work/renders/c5/v2_c_fender
    src_fps: 15
    interpolate: true
    dur: 4.4333
  - transition: {type: cut}
  - id: v2_d_fender_macro   # close-up: exposed fender mounts / headlight bucket
    src: /home/user/media/work/renders/c5/v2_d_fender_macro
    src_fps: 15
    interpolate: true
    dur: 1.6667
  - transition: {type: cut}
  - id: v2_e_nose_macro   # close-up: crash bar / radiator support where the bumper was
    src: /home/user/media/work/renders/c5/v2_e_nose_macro
    src_fps: 15
    interpolate: true
    dur: 1.6667
  - transition: {type: cut}
  - id: v2_f_hood   # hood opens on the fitted hinge, lifts off; push into the engine bay
    src: /home/user/media/work/renders/c5/v2_f_hood
    src_fps: 15
    interpolate: true
    dur: 5.0000
  - transition: {type: cut}
  - id: v2_g_rb_off   # THEN the rear (22.175 kick): rear bumper slides off -> rear crash bar
    src: /home/user/media/work/renders/c5/v2_g_rb_off
    src_fps: 15
    interpolate: true
    dur: 4.4667
  - transition: {type: cut}
  - id: v2_h_rb_inside   # rear bumper rises, turns its scanned inside to camera (26.621 accent)
    src: /home/user/media/work/renders/c5/v2_h_rb_inside
    src_fps: 15
    interpolate: true
    dur: 3.8667
  - transition: {type: cut}
  - id: v2_i_home   # everything flies home, front bumper locks + clean car on 34.402
    src: /home/user/media/work/renders/c5/v2_i_home
    src_fps: 15
    interpolate: true
    dur: 5.0000
  - transition: {type: cut}
  - id: logo   # ILLUMAESTHETIC logo on black on the b63 hit; music decays to silence by 39.5 s
    src: /home/user/media/c5-corvette/logo/end_card.png
    duration: 4.0000
    dur: 3.9000
    vf: fade=t=in:st=0:d=0.25,fade=t=out:st=3.0:d=0.9

overlays: []   # no text in this format (Temerario ref has none)
