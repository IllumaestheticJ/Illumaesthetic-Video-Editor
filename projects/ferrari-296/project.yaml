# v4 - all-reels brief + addendum A-D (relayed from the user) on top of v3 (director's held front):
#   scene order by the scene director (direction.md): travel front -> side -> rear, each section once; bumper-removed state
#   scans are hero beats with labels (F_hero, R_hero); openings only from data (louvre lifts off); fade, then a SMALL logo.
#   Cut-only assembly with exact frame counts: projects/ferrari-296/tools/assemble_cuts.py (ive assemble repeats a frame
#   at every cut). v3: project_v3.yaml, v2: project_v2.yaml, v1: project_v1.yaml.
# Music: ferrari296_track.mp3 (generated for this reel; 103.4 BPM, beat 0.5803 s, grid 0.435 + k*0.5803).
# Cut frames: 152, 222, 483, 622, 762, 901, 1005; end 1170 (39.0 s).
project: ferrari-296
format: reel-9x16
output: {path: /home/user/media/work/f296/out/ferrari_296_v4.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/ferrari296_track.mp3   # not in git
  start: 0
  fade_out: 0.3

beats: [5.067, 7.4, 16.1, 20.733, 25.4, 30.033, 33.5]

