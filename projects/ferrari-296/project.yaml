# v3 - DIRECTOR'S PLAN (director.md, written by the director agent from feedback + `ive director` + contact sheets).
# Reviewer on v2: "focus on specific sections; if you open the hood, hold that shot and also pull the front bumper out
# and show off the bumper"; "a director agent that minimizes redundant frames". Front is ONE held 8.7 s shot (lamp ->
# hood opens and stays -> bumper out, turned to show its scanned inner face); s4/s5/s8a merged, s8c (repeat of s1) cut.
# Every clip carries section + focus. v2: project_v2.yaml, v1: project_v1.yaml.
# v2 - user feedback on v1: "starts off too cropped", "doesn't focus on the subsystems", "doesn't zoom in on the
#   bumpers/skirts well enough". v2: wide opening (whole car), and the explode is progressive like the Temerario reference:
#   front subsystem close (bumper/fender/hood) -> side close (skirt, rear bumper/diffuser) -> wide lock. v1: project_v1.yaml.
# Ferrari 296 GTB - Temerario-style scan reel (scan only: no IRL footage, no text). Sibling of 240sx-scan / fg2-race-car.
# Satin-silver scan on black; turntables -> close-ups -> hood + engine cover open -> top-down -> exploded view -> logo.
# Shots: projects/ferrari-296/tools/shots.py (specs) + tools/shot.py (Blender, keyed cameras + hinged parts).
# Music: ferrari296_track.mp3 - original track generated for this reel by the coordinating session (ElevenLabs Music via
# Higgsfield, licensed to the team; elegant Italian GT: staccato strings, arp, sub). 103.4 BPM, beat 0.5803 s.
# (The procedural score from tools/music.py + cues.json was v0 and is kept as a silent-friendly fallback / for other reels.)
# Accents (per-beat RMS + flux, see editlog): 5.077, 9.719, 14.361 (8-beat phrases), music drops out at 12.04,
# 7-beat phrase, then 18.423, 23.066 (lift, loudest), 27.708, 32.350 (heaviest bass); fade 36.75 -> silent ~39.
# Cuts on frames round(t*30): 152, 292, 361, 431, 553, 622, 692, 1040; end 1170 (39.0 s).
# Clip durs are whole frames; first clip one frame short (assembler adds the cut hold frame).
project: ferrari-296
format: reel-9x16
output: {path: /home/user/media/work/f296/out/ferrari_296_v3.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/ferrari296_track.mp3   # not in git
  start: 0
  fade_out: 0.3

# cut frames 152, 292, 361, 431, 692, 762, 901, 1040 (end 1170)
beats: [5.067, 9.733, 12.033, 14.367, 23.067, 25.4, 30.033, 34.667]

timeline:
  - id: s1_wide
    section: whole
    focus: whole car, front-right 3/4
    src: /home/user/media/work/f296/renders/final/s1_wide
    src_fps: 15
    interpolate: true
    dur: 5.0333
  - transition: {type: cut, note: "5.077 phrase accent"}
  - id: s2_rear
    section: rear
    focus: rear haunch + left flank
    src: /home/user/media/work/f296/renders/final/s2_rear
    src_fps: 15
    interpolate: true
    dur: 4.6667
  - transition: {type: cut, note: "9.719 phrase accent; top-down continues s2's rear-left side"}
  - id: s7_top
    section: top
    focus: roofline / planform
    src: /home/user/media/work/f296/renders/final/s7_top
    src_fps: 15
    interpolate: true
    dur: 2.3
  - transition: {type: cut, note: "12.04 - the music drops out"}
  - id: s3_wheel
    section: wheel
    focus: carbon-ceramic disc through the spokes
    src: /home/user/media/work/f296/renders/final/s3_wheel
    src_fps: 15
    interpolate: true
    dur: 2.3333
  - transition: {type: cut, note: "14.361 phrase accent - front section, held"}
  - id: f5_front       # lamp 14.37 -> hood opens 14.94-16.10 and STAYS -> frunk (1 beat) -> bumper out 16.68-17.84 -> turns 65 deg on the 18.423 accent -> push in on its inner face
    section: front
    focus: hood/frunk, then the front bumper's inner face
    src: /home/user/media/work/f296/renders/final/f5_front
    src_fps: 15
    interpolate: true
    dur: 8.7
  - transition: {type: cut, note: "23.066 lift (loudest accent) - jump to the rear lid"}
  - id: s6_engine
    section: engine
    focus: engine-cover louvre lifting off the bay
    src: /home/user/media/work/f296/renders/final/s6_engine
    src_fps: 15
    interpolate: true
    dur: 2.3333
  - transition: {type: cut, note: "25.400 beat - right flank"}
  - id: x_side         # car as f5/s6 left it (hood + lid open, bumper out); fender up/out 25.40, skirt down 25.98, rear bumper on the 27.708 accent, diffuser 28.29
    section: side
    focus: front fender, side skirt, rear bumper + diffuser coming off
    src: /home/user/media/work/f296/renders/final/x_side
    src_fps: 15
    interpolate: true
    dur: 4.6333
  - transition: {type: cut, note: "30.029 beat - whole exploded car"}
  - id: x_lock         # high side-on (not s1's low 3/4); drift, fly home 31.19, LOCK 32.350 (heaviest bass), push in
    section: explode
    focus: every part out, then the reassembly lock
    hold: true
    src: /home/user/media/work/f296/renders/final/x_lock
    src_fps: 15
    interpolate: true
    dur: 4.6333
  - transition: {type: cut, note: "34.671 beat - logo"}
  - id: logo
    section: logo
    focus: Illumaesthetic logo
    src: /home/user/media/work/f296/out/logo_card.mp4
    dur: 4.3333

overlays: []
