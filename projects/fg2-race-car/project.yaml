# FG2 #806 race car - 1:1 photo <-> scan <-> CGI reel (TikTok 9:16). v5 (user feedback on v4): no repeated clip,
# white-splitter photo (D) dropped (not the Epsilon lip), cuts re-timed to the actual kicks.
# Each angle = one finished photo; scan + lookbook CGI (eps-honda-civic-fg2-v10.glb, TC wing) rendered from that photo's
# solved camera on an extended canvas; all three layers share one zoom-out to the full car (tools/kb_zoomout.py).
# Earlier versions: project_v1..v4.yaml.
project: fg2-race-car
format: reel-9x16 (TikTok)
output: {path: /home/user/media/work/out/fg2_race_car_v5.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/fg2/music/macarena_slowed.mp3   # user upload (not in git)
  start: 12.3567   # = kick -2; drop (kick 0, 13.950 s in the track) lands at 1.594 s
  fade_out: 0.8

# Kick grid from librosa kick peaks (40-120 Hz), least squares: 13.9502 + 0.79676 n (75.30 BPM), 5 ms rms.
# v1-v4 grid was anchored on the spectral onset 13.874 s -> every cut ~70 ms early. Cuts every 2 kicks, logo on kick 16.
# clip durs are whole frames so each cut = round(beat*30); first clip 1 frame short (assembler adds the cut hold frame)
beats: [1.5935, 3.187, 4.7806, 6.3741, 7.9676, 9.5611, 11.1546, 12.7482, 14.3417, 15.9352]

timeline:
  - id: p1_real   # HOOK: real car, painted lip; pre-drop hit at 0.00 s (2 kicks)
    src: /home/user/media/work/fg2/layers/P1z5_photo.mp4
    in: 0.0000
    dur: 1.5667
  - transition: {type: cut}
  - id: p1_scan   # THE DROP: 1:1 real -> scan (scan + lip CAD) (2 kicks)
    src: /home/user/media/work/fg2/layers/P1z5_scan.mp4
    in: 1.6000
    dur: 1.6000
  - transition: {type: cut}
  - id: p1_cgi   # 1:1 scan -> lookbook CGI (TC wing) (2 kicks)
    src: /home/user/media/work/fg2/layers/P1z5_cgi.mp4
    in: 3.2000
    dur: 1.5667
  - transition: {type: cut}
  - id: p2_scan   # angle change: low front 3/4, scan (2 kicks)
    src: /home/user/media/work/fg2/layers/P2z5_scan.mp4
    in: 0.0000
    dur: 1.6000
  - transition: {type: cut}
  - id: p2_cgi   # CGI (2 kicks)
    src: /home/user/media/work/fg2/layers/P2z5_cgi.mp4
    in: 1.6000
    dur: 1.6000
  - transition: {type: cut}
  - id: p2_real   # real, painted lip (2 kicks)
    src: /home/user/media/work/fg2/layers/P2z5_photo.mp4
    in: 3.2000
    dur: 1.6000
  - transition: {type: cut}
  - id: e_scan   # angle change: rear 3/4, scan (2 kicks)
    src: /home/user/media/work/fg2/layers/Ez5_scan.mp4
    in: 0.0000
    dur: 1.6000
  - transition: {type: cut}
  - id: e_cgi   # CGI with TC wing (2 kicks)
    src: /home/user/media/work/fg2/layers/Ez5_cgi.mp4
    in: 1.6000
    dur: 1.5667
  - transition: {type: cut}
  - id: e_real   # real #806 rear with GT wing (2 kicks)
    src: /home/user/media/work/fg2/layers/Ez5_photo.mp4
    in: 3.1667
    dur: 1.6000
  - transition: {type: cut}
  - id: end_card   # Epsilon+ logo on the 2nd drop (4 bars after the drop: offbeats drop out)
    src: /home/user/media/work/fg2/layers/end_card_epsilon.png
    duration: 1.6000
    dur: 1.6000

overlays: []   # no text
