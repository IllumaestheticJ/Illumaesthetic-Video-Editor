# Honda Civic EK (6th gen hatch) - scan-process reel in the 240SX format. v1.
# Footage shows a 1996-98 EK hatch (not the 11th gen named in the brief), so the scan is the Drive "Honda Civic EK" full car.
# Story: crew powders the car -> 1:1 cut ON THE DROP to the scan -> handheld scanner pass -> 1:1 cut -> exploded view
# (bumpers + wheels cut from the one full-car scan, turn left/right) -> scan software aligning the passes ->
# x-ray reassembly that lands on the listing's 360 view -> dissolve into the EK scan-data listing (WebZoom).
project: honda-civic-11-scan-process
format: reel-9x16
output: {path: /home/user/media/work/out/civic_ek_scan_process_v1.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/civic11/music/civic_track.mp3   # the original Civic track (cloudfront hf_20261111_060731_...mp3)
  start: 10.105   # drop = first kick peak at 13.305 s in the track -> video 3.200 s (frame 96)
  fade_out: 0.8

# Kick-peak grid (40-120 Hz): 2-bar phrase every 3.310 s from 13.305 s (beat 0.4138 s, ~145 BPM half-time trap),
# accents at beats 0, 1.5, 3, 5 of each phrase. Video times (track - 10.105), rounded to frames:
beats: [3.200, 6.500, 7.133, 9.833, 13.133, 16.433, 18.500, 23.067, 26.367]

# Whole-frame durs; first clip one frame short (the assembler adds a cloned hold frame at each cut) - FG2 lesson.
timeline:
  - id: irl_powder_front   # crew powders the hood; camera pulls back and settles on the front 3/4 (match frame f150 = 5.002 s)
    src: /home/user/media/civic11/dropbox/v_1957_24.mov
    in: 1.8686
    out: 5.0353
    dur: 3.1667
  - transition: {type: cut, note: "1:1 IRL -> scan ON THE DROP (cam_A: f 18.3 mm, LM + silhouette refine)"}
  - id: scan_hero   # full-car scan, silver; 20 deg ease-in-out orbit toward the left side; triangle counter HUD
    src: /home/user/media/work/civic11/renders/final_s1
    src_fps: 15
    interpolate: true
    dur: 3.3000
  - id: irl_scanner   # handheld scanner in frame, camera circling the car (1.5 beats)
    src: /home/user/media/civic11/dropbox/v_2003_40.mov
    in: 0.85
    out: 1.55
    dur: 0.6333
  - id: irl_scanner_pass   # scanner on the door, camera walks the right side to the front fender; ends on f105 (3.501 s)
    src: /home/user/media/civic11/dropbox/v_2003_29.mov
    in: 0.8347
    out: 3.5347
    dur: 2.7000
  - transition: {type: cut, note: "1:1 IRL -> scan (cam_B: f 28 mm, side landmarks), scan camera keeps drifting forward"}
  - id: scan_explode   # continues the walk, pulls back/up; bumpers fwd/back + turn left/right, wheels out + roll
    src: /home/user/media/work/civic11/renders/final_s2
    src_fps: 15
    interpolate: true
    dur: 6.6000
  - id: software_align   # Artec-style alignment of two scan passes (screen recording 2025-10-31 01-59-44, 41.5-49.9 s at 4x, viewport crop)
    src: /home/user/media/work/civic11/sr/sr_align.mp4
    dur: 2.0667
  - id: scan_xray   # x-ray reassembly (translate only), orbit lands on cam_end = listing hero view, morphs to listing grey
    src: /home/user/media/work/civic11/renders/final_s3
    src_fps: 15
    interpolate: true
    dur: 5.0667
  - transition: {type: dissolve, duration: 0.5, note: "x-ray (listing grey) -> EK scan-data listing, same angle"}
  - id: website   # EK listing; zoom out, title, logo, then ILLUMAESTHETIC.COM fades in last
    src: /home/user/media/work/civic11/out/webzoom_ek.mp4
    dur: 6.8667

overlays:
  - src: /home/user/media/work/civic11/out/hud_ek.mov
    start: 0
