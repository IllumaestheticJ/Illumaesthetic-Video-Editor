# Honda S2000 AP1 - scan reel v6 (scan only; factual labels over the bumper-removed section only).
# v6 = all-reels v2 brief + addendum A-D + this reel's feedback: travel front-left -> side -> rear -> over the top -> front;
# the front bumper-removed state is the hero section (bumper off on the drop, structure in detail, bumper inner side,
# bumper back on); only the real Bumper Only part moves; no hood animation, no trunk. Plan: direction.md / director.md.
# Music: honda-s2000_track.mp3 (generated for this reel; 138.05 BPM, beat 0.43463 s, first kick 0.0565 s).
# Map: groove b0-27 | drums out b28-31 | DROP b32 (13.965) | groove to b64 | outro b65-83 | hard stop b84 (36.565) | tail.
# Cut k at frame round((0.0565 + beat*0.43463)*30). Exact `frames:` per clip; tools/concat_assemble.py (plain concat + HUD).
project: honda-s2000
format: reel-9x16
output: {path: /home/user/media/work/s2k/out/honda_s2000_v6.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/honda-s2000_track.mp3   # not in git
  start: 0
  fade_out: 0.7

beats: [3.534, 5.272, 7.011, 8.749, 12.226, 13.965, 17.442, 20.919, 23.527, 26.134, 29.611, 33.088, 34.827]

