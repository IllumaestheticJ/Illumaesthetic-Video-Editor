# Huracan EVO v3 - NFSU2 car-lot intro (coupe, all the audio) + Spyder teardown with Temerario detail zooms.
# Coupe = 2023 'Huracan Evo Coupe Scan Data (New)' full car; Spyder = 2026 set (roof step behind the cabin). v2: project_v2.yaml
# Durations are whole frames on the kick grid; src_fps = 30*N/(D+4) so minterpolate's 2N-3 frames fill each slot.
project: huracan-evo
format: reel-9x16
output: {path: /home/user/media/work/out/huracan_evo_v3.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/huracan-evo/vo/soundtrack_v3.wav   # tools/mix.py: track_a_ext (groove +7 bars) + 2 start-ups + coupe narrator; not committed
  start: 0
  fade_out: 0.6

# kick grid t = 0.0768 + 0.60006*n on track_a_ext; cuts at n = 16, 32, 36, 44, 48, 56, 60, 64, 68, 72, 76, 88
beats: [9.678, 19.279, 21.679, 26.479, 28.88, 33.68, 36.08, 38.481, 40.881, 43.281, 45.681, 52.882]

timeline:
  - id: c1_lot   # CAR LOT: 2023 coupe on the turntable, lights come up with the start-up, narrator about the coupe (NFSU2 reference)
    src: /home/user/media/work/renders/huracan/c1_lot
    src_fps: 0.1024
    interpolate: true
    dur: 9.6333
  - transition: {type: cut}
  - id: c2_lot   # closer lot angle, coupe keeps turning, narration continues
    src: /home/user/media/work/renders/huracan/c2_lot
    src_fps: 14.7945
    interpolate: true
    dur: 9.6000
  - transition: {type: cut}
  - id: c3_swap   # the lot swaps to the Spyder ON the music lift (19.28 s), second start-up
    src: /home/user/media/work/renders/huracan/c3_swap
    src_fps: 14.2105
    interpolate: true
    dur: 2.4000
  - transition: {type: cut}
  - id: s5_frontopen   # Spyder: bumper slides off, fender steps out, hood swings up on its fitted hinge
    src: /home/user/media/work/renders/huracan/s5_frontopen
    src_fps: 14.5946
    interpolate: true
    dur: 4.8000
  - transition: {type: cut}
  - id: s6_top   # crane to top-down, spinning
    src: /home/user/media/work/renders/huracan/s6_top
    src_fps: 14.2105
    interpolate: true
    dur: 2.4000
  - transition: {type: cut}
  - id: s7_explode   # high rear 3/4: every panel separates (staggered on beats)
    src: /home/user/media/work/renders/huracan/s7_explode
    src_fps: 14.5946
    interpolate: true
    dur: 4.8000
  - transition: {type: cut}
  - id: z1_bumper   # detail zoom: front bumper intakes (2 mm part)
    src: /home/user/media/work/renders/huracan/z1_bumper
    src_fps: 14.2105
    interpolate: true
    dur: 2.4000
  - transition: {type: cut}
  - id: z2_hood   # detail zoom: hood underside + cowls from below
    src: /home/user/media/work/renders/huracan/z2_hood
    src_fps: 14.2105
    interpolate: true
    dur: 2.4000
  - transition: {type: cut}
  - id: z3_side   # detail zoom: side skirt + fender
    src: /home/user/media/work/renders/huracan/z3_side
    src_fps: 14.2105
    interpolate: true
    dur: 2.4000
  - transition: {type: cut}
  - id: z4_rear   # detail zoom: rear bumper diffuser/exhaust from below (plate kept out of frame)
    src: /home/user/media/work/renders/huracan/z4_rear
    src_fps: 14.2105
    interpolate: true
    dur: 2.4000
  - transition: {type: cut}
  - id: s8_float   # wide side, panels floating (first 2.4 s of the v2 render)
    src: /home/user/media/work/renders/huracan/s8_float
    src_fps: 14.2105
    interpolate: true
    dur: 2.4000
    trim_end: 2.5333
  - transition: {type: cut}
  - id: s9_reassemble   # panels return home, rear 3/4 hero, fades out (rear bumper with plate removed)
    src: /home/user/media/work/renders/huracan/s9_reassemble
    src_fps: 14.7273
    interpolate: true
    dur: 7.2000
    vf: fade=t=out:st=6.300:d=0.9
  - transition: {type: cut}
  - id: logo   # ILLUMAESTHETIC logo on black when the music stops; reverb tail under it
    src: /home/user/media/huracan-evo/logo/end_card.png
    duration: 4.0667
    dur: 3.9667
    vf: fade=t=in:st=0:d=0.5

overlays: []   # no on-screen text
