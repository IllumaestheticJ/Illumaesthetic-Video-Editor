# Huracan EVO v9 (v8: project_v8.yaml; v9 = deeper narration, faster scan pacing, Spyder scans back in via a 1:1 stealth cut). v8 notes: ( v8 = re-flowed one-take narration, rear bumper rebuilt from the B-side scan, labels without counts). v7 notes: - user on v6: bigger logo; full coupe rear-end disassembly + wheel wells + exhaust; narration conclusion. User on v4: cut to 30 s, scan data sooner, reference engine start, no jet
# sound, lower voice. Coupe: select + wheel + side (lift at 10.28 s, was 27.08); Spyder sections at 1.3-2x speed.
project: huracan-evo
format: reel-9x16
output: {path: /home/user/media/work/out/huracan_evo_v9.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/huracan-evo/vo/soundtrack_v9.wav   # not committed (tools/music_v5.py + tools/mix.py --v9)
  start: 0
  fade_out: 0.6

# beats t = 3.0768 + 0.60006*n; dips n=3,7,10; drop n=12; scan cuts n=15,17,19,21,24,26,29,31,34; music stop n=40
beats: [4.877, 7.277, 9.077, 10.278, 12.078, 13.278, 14.478, 15.678, 17.478, 18.678, 20.479, 21.679, 23.479, 27.079]

timeline:
  - id: h0_select   # SELECT: reference engine start-up as the lights come up
    section: whole
    focus: "whole coupe, front-left 3/4, lights come up on the start-up"
    src: /home/user/media/work/renders/huracan/h0_select
    src_fps: 14.6000
    interpolate: true
    dur: 4.8667
    vf: fade=t=in:st=0:d=0.3
  - transition: {type: dip, duration: 0.6}
  - id: h4_wheel   # n3-7
    section: wheel
    focus: "front wheel: scanned rim spokes and tyre"
    src: /home/user/media/work/renders/huracan/h4_wheel
    src_fps: 22.5000
    trim_start: 1.50
    interpolate: true
    dur: 3.0000
  - transition: {type: dip, duration: 0.6}
  - id: h5_side   # n7-10
    section: side
    focus: "coupe profile slide"
    src: /home/user/media/work/renders/huracan/h5_side
    src_fps: 30.0000
    trim_start: 0.90
    dur: 2.4000
  - transition: {type: dip, duration: 0.5}
  - id: hx_match   # n10-12: closed COUPE, no floor, camera lands on s5's first key (shifted 29 px down to register with the Spyder)
    section: whole
    focus: "whole coupe front-right 3/4, push toward the nose"
    src: /home/user/media/work/renders/huracan/hx_match
    src_fps: 9.8182
    interpolate: true
    dur: 1.7000
    vf: crop=iw:ih-29:0:0,pad=iw:ih+29:0:29:black
  - transition: {type: cut}
  - id: s5_frontopen   # n12-15: frames 1-72 at 2.7x
    section: front-open
    focus: "1:1 cut on the drop: same camera, now the Spyder - bumper, fender, hood open"
    src: /home/user/media/work/renders/huracan/s5_frontopen
    src_fps: 39.9956
    dur: 1.7667
  - transition: {type: cut}
  - id: sp_bumper   # n15-17: frames 8-44 at 2.1x
    section: front-open
    focus: "front bumper tips its inner face"
    src: /home/user/media/work/renders/huracan/sp_bumper
    src_fps: 30.8308
    trim_start: 0.2270
    dur: 1.2000
  - transition: {type: cut}
  - id: sp_hood   # n17-19: frames 4-48 at 2.5x
    section: hood
    focus: "hood lifts clear, cowls lift off"
    src: /home/user/media/work/renders/huracan/sp_hood
    src_fps: 37.4969
    trim_start: 0.0800
    dur: 1.2000
  - transition: {type: cut}
  - id: sp_side   # n19-21: frames 4-48 at 2.5x
    section: side-open
    focus: "fender and side skirt off"
    src: /home/user/media/work/renders/huracan/sp_side
    src_fps: 37.4969
    trim_start: 0.0800
    dur: 1.2000
  - transition: {type: cut}
  - id: c1_bumper   # n21-24: frames 4-45 at 1.6x
    section: rear-open
    focus: "REAR END, NO BUMPER: coupe bumper off, hold on the structure (label)"
    src: /home/user/media/work/renders/huracan/c1_bumper
    src_fps: 21.7219
    trim_start: 0.1381
    interpolate: true
    dur: 1.8000
  - transition: {type: cut}
  - id: c2_deck   # n24-26: frames 3-33 at 1.7x
    section: rear-open
    focus: "grille, beam and decklid lift off"
    src: /home/user/media/work/renders/huracan/c2_deck
    src_fps: 23.2483
    trim_start: 0.0860
    interpolate: true
    dur: 1.2000
  - transition: {type: cut}
  - id: c3_exhaust   # n26-29: frames 3-40 at 1.4x
    section: exhaust
    focus: "EVO exhaust drops out (label)"
    src: /home/user/media/work/renders/huracan/c3_exhaust
    src_fps: 19.6531
    trim_start: 0.1018
    interpolate: true
    dur: 1.8000
  - transition: {type: cut}
  - id: c4_wells   # n29-31: frames 1-36 at 2.0x
    section: wheel
    focus: "rear wheel well, no liner"
    src: /home/user/media/work/renders/huracan/c4_wells
    src_fps: 26.9980
    interpolate: true
    dur: 1.2000
  - transition: {type: cut}
  - id: sp_finale   # n31-34: frames 1-34 at 1.3x
    section: whole
    focus: "Spyder fully exploded, top-down"
    src: /home/user/media/work/renders/huracan/sp_finale
    src_fps: 17.5844
    interpolate: true
    dur: 1.8000
  - transition: {type: cut}
  - id: c5_finale   # n34-40: frames 1-45 at 0.8x
    section: whole
    focus: "rear reassembles -> whole coupe pull-back"
    src: /home/user/media/work/renders/huracan/c5_finale
    src_fps: 12.0523
    interpolate: true
    dur: 3.6000
    vf: fade=t=out:st=3.000:d=0.6
  - transition: {type: cut}
  - id: logo   # ILLUMAESTHETIC logo 720 px on the music stop 27.08 s -> 30.0 s
    src: /home/user/media/huracan-evo/logo/end_card_720.png
    duration: 3.0
    dur: 2.9333
    vf: fade=t=in:st=0:d=0.5

overlays:   # two title-only labels (user: no triangle counts)
  - src: /home/user/media/work/out/hud_huracan_v9.mov
    start: 0
