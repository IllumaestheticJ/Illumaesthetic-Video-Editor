# Lamborghini Revuelto scan reel v2 (v1: project_v1.yaml). Scene order from direction.md (scene director):
# front -> left side -> rear, each section once; bumper-removed holds with labels (rule C); mirror never moves and the lid
# only swings on its hinge (rule D); small logo. Assembled with projects/honda-s2000/tools/concat_assemble.py (exact
# `frames` per clip, plain concat: no duplicated frame at cuts). Cut k lands on sum(frames[:k]) = round(t*30).
# Renders: round(dur*15)+3 frames each, so minterpolate (2N-3 frames) always covers the slot - no frozen tail.
project: lamborghini-revuelto
format: reel-9x16
output: {path: /home/user/media/work/out/lamborghini_revuelto_v2.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/lamborghini-revuelto_track.mp3   # original track generated for this reel (parent session)
  start: 0
  fade_out: 1.0

# cut times (s) on the 102.52 BPM grid; 27.94 = every part lands home on the climax taiko attack (inside v2_reassemble)
beats: [6.960, 10.471, 15.153, 18.664, 25.687, 27.94, 30.40]

timeline:
  - id: v2_whole   # whole car, front-left 3/4, slow push toward the nose; fades up with the quiet intro
    focus: whole car
    src: /home/user/media/work/renders/revuelto/v2_whole
    src_fps: 15
    interpolate: true
    frames: 209
    vf: fade=t=in:st=0:d=1.5
  - transition: {type: cut}
  - id: s6_frontopen   # FRONT: bumper slides off, headlights out, lid lifts on its fitted hinge on phrase B (v1 render)
    focus: front bumper
    src: /home/user/media/work/renders/revuelto/s6_frontopen
    src_fps: 14.59   # 53 frames -> 103 after minterpolate; 30*53/(105+4) stretches it to cover 105 (3.5 % slower)
    interpolate: true
    frames: 105
  - transition: {type: cut}
  - id: v2_frontin   # FRONT: bumper + headlights lift away, camera moves in on the structure behind the bumper (labels)
    focus: front structure
    src: /home/user/media/work/renders/revuelto/v2_frontin
    src_fps: 15
    interpolate: true
    frames: 141
  - transition: {type: cut}
  - id: v2_side   # LEFT SIDE: fender lifts, side skirts slide out, side fin lifts
    focus: left side panels
    src: /home/user/media/work/renders/revuelto/v2_side
    src_fps: 15
    interpolate: true
    frames: 105
  - transition: {type: cut}
  - id: v2_rear   # REAR (phrase C): wing, tail lights, rear bumper lift away; push in on the rear structure (labels)
    focus: rear structure
    src: /home/user/media/work/renders/revuelto/v2_rear
    src_fps: 15
    interpolate: true
    frames: 211
  - transition: {type: cut}
  - id: v2_reassemble   # WHOLE CAR: every part flies home and slams in on the climax (27.94); lid closes; rear 3/4 hero
    focus: whole car
    src: /home/user/media/work/renders/revuelto/v2_reassemble
    src_fps: 15
    interpolate: true
    frames: 141
  - transition: {type: cut}
  - id: logo   # small ILLUMAESTHETIC logo (320 px) on the loudest taiko hit, rides the decay to 34.6 s
    src: /home/user/media/work/revuelto/logo/logo_card_v2.mp4
    frames: 126

overlays:
  - src: /home/user/media/work/revuelto/hud_v2.mov   # labels over the two bumper-removed holds only (rule C); overlay.json
    start: 0
