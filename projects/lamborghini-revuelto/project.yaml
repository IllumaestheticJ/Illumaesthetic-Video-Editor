# Lamborghini Revuelto scan reel v3 (v2.1: project_v2.yaml, v1: project_v1.yaml). User on v2.1: wheels cut flat (fixed in
# geometry: tools/clean2.py, blend3) + exploded views of the individual bumper parts. Order from direction.md "v3 direction".
# Assembled with projects/honda-s2000/tools/concat_assemble.py (exact frames per clip, plain concat).
# src_fps = 30*N/(frames+4) so minterpolate's 2N-3 frames cover the slot with no frozen tail.
project: lamborghini-revuelto
format: reel-9x16
output: {path: /home/user/media/work/out/lamborghini_revuelto_v3.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/lamborghini-revuelto_track.mp3   # original track generated for this reel (parent session)
  start: 0
  fade_out: 1.0

# cut times (s) on the 102.52 BPM grid (bar downbeats); 27.94 = parts land home on the climax taiko attack
beats: [4.633, 9.300, 13.967, 16.333, 21.000, 25.700, 27.94, 30.40]

timeline:
  - id: v3_whole   # whole car, front-left 3/4, slow push; fades up with the quiet intro
    focus: whole car
    src: /home/user/media/work/renders/revuelto/v3_whole
    src_fps: 15.105
    interpolate: true
    frames: 139
    vf: fade=t=in:st=0:d=1.2
  - transition: {type: cut}
  - id: v3_front   # FRONT: bumper slides off and lifts away, headlights out, lid up on its hinge, push in on the structure (labels)
    focus: front structure
    src: /home/user/media/work/renders/revuelto/v3_front
    src_fps: 15.208
    interpolate: true
    frames: 140
  - transition: {type: cut}
  - id: v3_fb   # FRONT BUMPER ALONE (phrase B): inner face -> outer face -> its 10 scanned pieces come off (labels)
    focus: front bumper parts
    src: /home/user/media/work/renders/revuelto/v3_fb
    src_fps: 15.208
    interpolate: true
    frames: 140
  - transition: {type: cut}
  - id: v3_side   # LEFT SIDE: fender lifts, side skirts slide out, fin lifts
    focus: left side panels
    src: /home/user/media/work/renders/revuelto/v3_side
    src_fps: 15.200
    interpolate: true
    frames: 71
  - transition: {type: cut}
  - id: v3_rear   # REAR: wing, tail lights, bumper off on phrase C, push in on the rear structure (labels)
    focus: rear structure
    src: /home/user/media/work/renders/revuelto/v3_rear
    src_fps: 15.208
    interpolate: true
    frames: 140
  - transition: {type: cut}
  - id: v3_rb   # REAR BUMPER ALONE: inner face -> outer face -> diffuser, upper half, trim cover, reflectors, marker separate (labels)
    focus: rear bumper parts
    src: /home/user/media/work/renders/revuelto/v3_rb
    src_fps: 15.103
    interpolate: true
    frames: 141
  - transition: {type: cut}
  - id: v3_reassemble   # WHOLE CAR: every part slams home on the climax (27.94), lid closes; rear 3/4 hero; fade
    focus: whole car
    src: /home/user/media/work/renders/revuelto/v3_reassemble
    src_fps: 15.103
    interpolate: true
    frames: 141
    vf: fade=t=out:st=4.2:d=0.5
  - transition: {type: cut}
  - id: logo   # ILLUMAESTHETIC logo (720 px, lessons: 380 was too small) on the loudest taiko hit, rides the decay to 34.6 s
    src: /home/user/media/work/revuelto/logo/logo_card_v3.mp4
    frames: 126

overlays:
  - src: /home/user/media/work/revuelto/hud_v3.mov   # labels over the bumper-removed holds and the bumper-only shots; overlay.json
    start: 0
