# v2 - user on v1: "same first draft issues as the others", "focus on specific sections better", "car is clipped at
#   beginning"; plate must not be readable (IS300 only); parent's all-reels brief + addendum (cropping, one sequence per
#   section, bumper-removed data highlighted + labelled, order by scan features, front -> side -> rear). Plan: direction.md.
#   v1: project_v1.yaml.
# Lexus IS300 (first gen) - Temerario-style scan reel. Shots: tools/shots.py + tools/shot.py; labels: overlay.json (ScanHUD).
# Music: lexus-is300_track.mp3 (generated for this reel by the coordinating session). 92.0 BPM, beat 0.6522 s, kick grid
# phase 0.050 s; drop beat 16 (10.485 s), loudest beat 40, triple hit 44/45/46 (last hit 30.05 s), tail to ~37.4 s.
# Cut frames (round(t*30)): 158 (b8), 197 (b10), 275 (b14), 471 (b24), 588 (b30), 745 (b38), logo 941 (b48); end 1122.
project: lexus-is300
format: reel-9x16
output: {path: /home/user/media/work/is300/out/lexus_is300_v2.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/lexus-is300_track.mp3   # not in git
  start: 0
  fade_out: 0.3

beats: [5.268, 6.572, 9.181, 15.703, 19.616, 24.834, 31.356]

timeline:
  - id: s1_wide   # WHOLE CAR: front-right 3/4, slow push, fades up from black
    src: /home/user/media/work/is300/renders/final/s1_wide
    src_fps: 15
    interpolate: true
    dur: 5.2333
    vf: "fade=t=in:st=0:d=0.8"
  - transition: {type: cut, note: "beat 8"}
  - id: s3_wheel   # WHEELS: front-right wheel close (v1 render, no plate in frame)
    src: /home/user/media/work/is300/renders/final/s3_wheel
    src_fps: 15
    interpolate: true
    dur: 1.3000
  - transition: {type: cut, note: "beat 10"}
  - id: s4_nose   # FRONT exterior: headlight + grille slide (re-rendered, plate flattened)
    src: /home/user/media/work/is300/renders/final/s4_nose
    src_fps: 15
    interpolate: true
    dur: 2.6000
  - transition: {type: cut, note: "beat 14"}
  - id: s5_front   # FRONT HERO: bumper off on the drop (b16), push in on the intercooler, front-right corner
    src: /home/user/media/work/is300/renders/final/s5_front
    src_fps: 15
    interpolate: true
    dur: 6.5333
  - transition: {type: cut, note: "beat 24"}
  - id: s6_side   # SIDE: right skirt slides out (b25), bare sill
    src: /home/user/media/work/is300/renders/final/s6_side
    src_fps: 15
    interpolate: true
    dur: 3.9000
  - transition: {type: cut, note: "beat 30"}
  - id: s7_rear   # REAR: bumper back + tipped (inside face), trunk lid lifts off the Rear Trunk Open state
    src: /home/user/media/work/is300/renders/final/s7_rear
    src_fps: 15
    interpolate: true
    dur: 5.2333
  - transition: {type: cut, note: "beat 38"}
  - id: s8_finale   # TOP -> WHOLE CAR: parts lift on b40, land on 44/45/46, rear-left 3/4, fade to black
    src: /home/user/media/work/is300/renders/final/s8_finale
    src_fps: 15
    interpolate: true
    dur: 6.5333
    vf: "fade=t=out:st=6.0:d=0.5"
  - transition: {type: cut, note: "beat 48 - logo on the tail"}
  - id: logo   # small logo (380 px, ~35 % width) fades in on black, fades out with the track
    src: /home/user/media/work/is300/out/logo_card_v2.mp4
    dur: 6.0333

overlays:
  - src: /home/user/media/work/is300/out/hud_is300_v2.mov   # labels from overlay.json, over scan shots only
    start: 0
