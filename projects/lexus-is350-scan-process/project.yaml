# Lexus IS350 (4IS, plate 9JTY488) scan-process reel - 240SX format with the real shop footage (FX3A, S-Log3).
# Real clips are pre-rendered by tools/irl.py (LUT + 9:16 window from the 4K original, last frame = match frame).
# Scan shots: S1/S2 ive render, S3 tools/path_render.py (two-camera swoop). Cameras in /home/user/media/work/is350/match.
project: lexus-is350-scan-process
format: reel-9x16
output: {path: /home/user/media/work/is350/out/is350_scan_process_v1.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/is350/music/is350_reel.wav   # tools/music.py: track from kick 26, kicks 40-56 repeated once
  start: 0
  fade_out: 0.6

# video beat n = 0.50004 n s (kick-peak grid). Drop = n 6 (3.000 s). Cuts on n 6/14/16/19/26/38/46, last kick n 54.
beats: [3.000, 7.000, 8.001, 9.501, 13.001, 19.001, 23.001, 27.002]

timeline:
  - id: irl_walkout    # FX30554 f193-264: camera walks out of the shop door onto the powdered car; ends on the solved frame
    dur: 2.9667   # 89 frames: the assembler adds one hold frame per cut (FG2 lesson); rendered 89 long so the match frame stays last
    src: /home/user/media/work/is350/irl/i1_open.mp4
  - transition: {type: cut, note: "1:1 real -> scan ON THE DROP (cam_A2 -> camP_A, FX3A 32.6 mm)"}
  - id: scan_front     # full-car scan from the matched camera, slow 20 deg orbit; HUD triangle counter
    dur: 4.0
    src: /home/user/media/work/is350/renders/s1_front
    src_fps: 15
    interpolate: true
  - id: irl_spray      # FX30549: powder spray on the bumper (2 beats)
    dur: 1.0
    src: /home/user/media/work/is350/irl/i2_spray.mp4
  - id: irl_scanner    # FX30547: handheld scanner screen live-scanning the fender (3 beats)
    dur: 1.5
    src: /home/user/media/work/is350/irl/i3_scanner.mp4
  - id: irl_rear_scan  # FX30542 f1052-1135: crew scanning the rear bumper, frame pans onto the left-rear corner
    dur: 3.5
    src: /home/user/media/work/is350/irl/i4_rear.mp4
  - transition: {type: cut, note: "1:1 real -> scan (cam_B -> camP_B, 31.1 mm) on the bar downbeat"}
  - id: scan_rear      # base = full car with the reflector-removed scan spliced in; reflector pops out below the bumper and spins (inside + outside)
    dur: 6.0
    src: /home/user/media/work/is350/renders/s2_rear
    src_fps: 15
    interpolate: true
  - id: scan_xray      # same pose, x-ray: reflector translates home, camera swoops out to the listing's 360-viewer angle, morphs to listing grey
    dur: 4.5
    src: /home/user/media/work/is350/renders/s3_xray
    src_fps: 15
    interpolate: true
  - transition: {type: dissolve, duration: 0.5, note: "x-ray (listing pose, listing grey) -> the IS350 scan-data listing"}
  - id: website        # WebZoom: listing screenshot zooms out (lands on n 50), title, logo, URL below it fading in last
    dur: 4.6
    src: /home/user/media/work/is350/out/webzoom_is350.mp4

overlays:
  - src: /home/user/media/work/is350/out/hud_is350.mov
    start: 0
