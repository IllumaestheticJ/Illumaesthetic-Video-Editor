# Lola (Drifter movie AE86s) scan-process reel v8. Earlier versions: project_v1..v7.yaml (+ overlay_vN.json, review_vN.md).
# v8 (user): (1) the song must START on "my life be like"; (2) use the July 2025 Camera Uploads footage of the user
# driving Lola for an extra real -> scan match on the interior scan.
# Structure: MOVIE Lola 1 driving -> MOVIE Lola 1 parked (band on black) -> 1:1 on the beat drop -> scan ->
# spray, handheld scanner -> 1:1 -> outside lifts off inside -> Artec Studio -> DRIVING Lola on set (film rig on the
# hood) -> 1:1 -> interior scan from the driver's eye -> Lola 2 wing -> 360 turntable -> MOVIE tandem drift -> logo.
# Movie clips are 2.39:1 bands on black; captions go in the black bars or on scan shots, never on footage.
project: lola-scan-process
format: reel-9x16
output: {path: /home/user/media/work/out/lola_scan_process_v8.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  # User upload: Grits - "My Life Be Like (Ooh Ahh)" remix ft. 2Pac & Xzibit (Tokyo Drift video version). Not in git.
  # Commercial track supplied by the user: attach the song in-app when posting.
  # v8 start 20.8033 s = the "my life be like" pickup (the vocal phrase that recurs every 4.85 s before each downbeat:
  # 16.0, 20.85, 30.56, 35.43 ...). Downbeats at video 1.03 and 3.44 s, pre-drop silence, beat drop (track 26.670) = frame 176.
  path: /home/user/media/work/music/lola-scan-process_v6_mylifebelike.m4a
  start: 20.8033
  fade_out: 1.2

# Cut frames (video = track - 20.8033): 103 downbeat 24.245 | 176 DROP 26.670 | 258 (29.40) | 294 (30.612) | 367 (33.039)
# | 467 (36.385 downbeat) | 499 (37.436) | 576 (40.013) | 645 (42.295) | 695 (43.961) | 840 (48.808) | 936 (51.989).
beats: [3.433, 5.867, 8.597, 9.809, 12.236, 15.582, 16.633, 19.210, 21.492, 23.158, 28.005, 31.186]

timeline:
  - id: movie_drive    # focus: Lola 1 in the film - wheel cam then drifting at camera (DRIFTER trailer 52.67-55.92 s, band)
    src: /home/user/media/work/lola/sel/movie_drive.mp4   # the trailer's own cut lands on the song's first downbeat
    in: 0
    dur: 3.4
  - transition: {type: cut}
  - id: movie_side     # focus: Lola 1 parked, side profile (trailer 4.99-6.16 s, slowed); ENDS on the solved frame (cam_M)
    src: /home/user/media/work/lola/sel/movie_side.mp4
    in: 0
    dur: 2.4333
  - transition: {type: cut, note: "1:1 MOVIE -> scan on the beat drop (cam_M, Lola 1 Exterior)"}
  - id: scan_M         # focus: the same side view as scan, 16 deg orbit; triangle counter + caption
    src: /home/user/media/work/lola/renders/s6_M
    src_fps: 15
    interpolate: true
    dur: 2.7333
  - transition: {type: cut}
  - id: irl_spray      # focus: how - powder spray over Lola 1
    src: /home/user/media/work/lola/sel/spray.mp4
    in: 13.5
    dur: 1.2
  - transition: {type: cut}
  - id: irl_scanner    # focus: handheld scanner frames the rear 3/4; ENDS on the solved frame (scanner.mp4 frame 282)
    src: /home/user/media/work/lola/sel/scanner.mp4
    in: 7.0
    out: 9.4333
    dur: 2.4333
  - transition: {type: cut, note: "1:1 IRL -> scan on a kick (cam_B)"}
  - id: scan_B         # focus: outside surface lifts off the registered inside scan (translate only)
    src: /home/user/media/work/lola/renders/s2_B_v2
    src_fps: 15
    interpolate: true
    speed: 1.3
    dur: 3.3333
  - transition: {type: cut}
  - id: screen_register   # focus: Artec Studio - cut-open body mesh gets its colour texture
    src: /home/user/media/work/lola/sel/sr_texture.mp4
    in: 0.55
    dur: 1.0667
  - transition: {type: cut}
  - id: irl_drive      # focus: the user driving Lola on set, film rig + LED panel on the hood (Camera Uploads
    # 2025-07-30 15.25.42 @ 26.5 s, crop 1026x1824+175); ENDS on the solved frame (drive_rig.mp4 frame 110, cam_D)
    src: /home/user/media/work/lola/sel/drive_rig.mp4
    in: 1.1333
    out: 3.7
    dur: 2.5667
  - transition: {type: cut, note: "1:1 IRL -> interior scan on a kick (cam_D, Lola 1 Interior)"}
  - id: scan_D         # focus: the interior scan from the driver's eye - wheel, gauges, vents, roof header; slow push
    src: /home/user/media/work/lola/renders/s7_D
    src_fps: 15
    interpolate: true
    dur: 2.3
  - transition: {type: cut}
  - id: irl_lola2      # focus: spraying Lola 2's wing
    src: /home/user/media/work/lola/sel/lola2_irl.mp4
    in: 3.6
    dur: 1.6667
  - transition: {type: cut}
  - id: scan_turntable # focus: whole Lola 2, linear 360 deg turntable (user request, v5); triangle counter
    src: /home/user/media/work/lola/renders/s3_turntable_v5
    src_fps: 15
    interpolate: true
    speed: 1.186
    dur: 4.8333
  - transition: {type: cut}
  - id: movie_tandem   # focus: Lola 2 in the film - FPV tandem drift (trailer 118.5-121.7 s, band); closing caption
    src: /home/user/media/work/lola/sel/movie_tandem.mp4
    in: 0
    dur: 3.2
  - transition: {type: cut}
  - id: logo           # ILLUMAESTHETIC logo only; fade to black with the music
    src: /home/user/media/work/lola/end_card_v3.mp4
    in: 0
    dur: 3.2

overlays:
  - src: /home/user/media/work/out/hud_lola_v8.mov   # `ive hud projects/lola-scan-process/overlay.json`
    start: 0
