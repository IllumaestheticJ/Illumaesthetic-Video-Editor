# Mazda 3 (gen 4) hatchback - scan reel v2 (brief from all v1 reviews + user addendum A-D). Earlier: project_v1.yaml (v1 delivered),
# project_v2wide.yaml (whole-car-only re-render, superseded before delivery). Plan: direction.md (scenes) + director.md (shots).
# Travel front -> side -> rear -> REAR WING REMOVED hero (the only registered part/state) -> the wing's underside -> top + reassembly
# -> fade -> small logo. No turntables, no orbits for their own sake, one sequence per section, wing translates only.
# Music: mazda-3-gen4_track.mp3 (generated for this reel), 110.0 BPM, beat k = 0.050 + 0.5453 k; kick drop b36 19.682 s;
# last kick 36.587; music dead ~38.2 s. Cuts on frames round(t*30): 132 (b8), 263 (b16), 460 (b28), 754 (b46 kick),
# 852 (b52 kick), 1048 (b64 kick); end 1147 (b70). Wing pops off ON the drop b36 (inside m4), locks on b60 32.770 (inside m6).
# src_fps = (N-1)/(dur + 3/30) per clip (N = rendered frames): minterpolate drops ~2 tail frames, this avoids an end freeze.
project: mazda-3-gen4
format: reel-9x16
output: {path: /home/user/media/work/m3/out/mazda_3_gen4_v2.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/mazda-3-gen4_track.mp3   # not in git
  start: 0
  fade_out: 0.6

beats: [4.412, 8.775, 15.319, 25.135, 28.407, 34.949, 38.223]

timeline:
  - id: m1_open          # section: whole car / front. Focus: whole car from the front-left 3/4, straight push-in (no orbit)
    section: front
    focus: whole car, front-left 3/4
    src: /home/user/media/work/m3/renders/final3/m1_open
    src_fps: SRC_m1_open
    interpolate: true
    dur: 4.3667
  - transition: {type: cut, note: "b8 4.412"}
  - id: m2_flank         # section: side. Truck toward the rear along the left profile (surfacing reflections slide over the doors)
    section: side
    focus: left flank surfacing
    src: /home/user/media/work/m3/renders/final3/m2_flank
    src_fps: SRC_m2_flank
    interpolate: true
    dur: 4.3667
  - transition: {type: cut, note: "b16 8.775"}
  - id: m3_rear          # section: rear. Whole car from the left-rear quarter -> moves in until tail lamps + hatch fill the frame
    section: rear
    focus: tail lamps + hatch
    src: /home/user/media/work/m3/renders/final3/m3_rear
    src_fps: SRC_m3_rear
    interpolate: true
    dur: 6.5667
  - transition: {type: cut, note: "b28 15.319 phrase"}
  - id: m4_wingoff       # HERO: wing seated through the build, pops off ON the drop b36, camera moves in and holds b40-b46 on the mounting points
    section: rear-hatch-top
    focus: rear wing -> exposed mounting points (Wing Removed scan)
    src: /home/user/media/work/m3/renders/final3/m4_wingoff
    src_fps: SRC_m4_wingoff
    interpolate: true
    dur: 9.8
  - transition: {type: cut, note: "b46 25.135 kick"}
  - id: m5_part          # the wing's scanned underside, translating back into clear black above/behind the car (no spin)
    section: wing-part
    focus: wing underside / mounting face
    src: /home/user/media/work/m3/renders/final3/m5_part
    src_fps: SRC_m5_part
    interpolate: true
    dur: 3.2667
  - transition: {type: cut, note: "b52 28.407 kick"}
  - id: m6_reassemble    # top: high whole car, wing returns and LOCKS on b60, settle, fade to black b62 -> b64
    section: top
    focus: wing returning to its mounts, whole car from above
    src: /home/user/media/work/m3/renders/final3/m6_reassemble
    src_fps: SRC_m6_reassemble
    interpolate: true
    vf: "fade=t=out:st=5.453:d=1.08"
    dur: 6.5333
  - transition: {type: cut, note: "b64 34.949 kick - small logo on black"}
  - id: logo             # ferrari-296/tools/logo_card.py --secs 3.3 --width 320 (small logo, site V2) on render black
    section: end
    focus: small logo
    src: /home/user/media/work/m3/out/logo_card_small.mp4
    dur: 3.3

overlays:
  - src: /home/user/media/work/m3/out/hud_v2.mov   # overlay.json: REAR WING REMOVED / MOUNTING POINTS, b40-b45, black band above the roof
    start: 0
