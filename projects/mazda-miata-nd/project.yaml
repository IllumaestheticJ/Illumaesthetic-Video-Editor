# Mazda Miata ND - Temerario-style scan reel (scan only: no IRL footage, no text). Sibling of ferrari-296 / huracan-evo / a90-supra.
# Satin-silver scan on black; turntable -> rear orbit -> wheel + headlight close-ups -> front opens (bumper off, hood up on its
# fitted hinge) -> rear opens (bumper off, trunk up) -> top-down -> exploded view -> logo.
# Shots: tools/shots.py (specs, timings from timing.json) rendered by projects/ferrari-296/tools/shot.py, one at a time.
# Music: mazda-miata-nd_track.mp3 - original track generated for this car by the coordinating session (ElevenLabs via Higgsfield).
#   116.01 BPM, beat 0.51721 s, first kick 8.336 s, last hit 33.162 s, -40 dB at 36.6 s (tools/music_scan.py).
#   miata_cut.wav = track from 4.1983 s (8 beats before the first kick) with a 0.3 s fade-in.
# Cuts on video frames 124 248 310 372 497 621 683 869; end 972 (32.4 s). Assembled with the cuts-only concat assembler
# (projects/honda-s2000/tools/concat_assemble.py): exact `frames:` per clip, no duplicated cut frame.
project: mazda-miata-nd
format: reel-9x16
output: {path: /home/user/media/work/miata/out/miata_nd_v2.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/miata_cut.wav   # not in git
  start: 0
  fade_out: 0.4

beats: [4.133, 8.267, 10.333, 12.4, 16.567, 20.7, 22.767, 28.967]

timeline:
  - id: s1_turntable   # front 3/4 turntable over the 8-beat pad intro
    src: /home/user/media/work/miata/renders/final/s1_turntable
    src_fps: 14.7656   # minterpolate: 63 renders -> 2N-3; src_fps = 30*N/(slot+4)
    interpolate: true
    frames: 124
    dur: 4.1333
  - transition: {type: cut, note: "8.336 first kick"}
  - id: s2_rear        # rear 3/4 orbit, car's left, rising
    src: /home/user/media/work/miata/renders/final/s2_rear
    src_fps: 14.7656   # minterpolate: 63 renders -> 2N-3; src_fps = 30*N/(slot+4)
    interpolate: true
    frames: 124
    dur: 4.1333
  - transition: {type: cut, note: "12.473 phrase"}
  - id: s3_wheel       # extreme close-up: front-right wheel + brake (2 mm)
    src: /home/user/media/work/miata/renders/final/s3_wheel
    src_fps: 14.5455   # minterpolate: 32 renders -> 2N-3; src_fps = 30*N/(slot+4)
    interpolate: true
    frames: 62
    dur: 2.0667
  - transition: {type: cut, note: "14.542 accent"}
  - id: s4_lamp        # headlight + grille slide (2 mm)
    src: /home/user/media/work/miata/renders/final/s4_lamp
    src_fps: 14.5455   # minterpolate: 32 renders -> 2N-3; src_fps = 30*N/(slot+4)
    interpolate: true
    frames: 62
    dur: 2.0667
  - transition: {type: cut, note: "16.611 section lift"}
  - id: s5_front       # bumper off beats 0-2, hood up beats 2-6 to the captured open pose
    src: /home/user/media/work/miata/renders/final/s5_front
    src_fps: 14.8837   # minterpolate: 64 renders -> 2N-3; src_fps = 30*N/(slot+4)
    interpolate: true
    frames: 125
    dur: 4.1667
  - transition: {type: cut, note: "20.749 phrase"}
  - id: s6_rear_open   # rear bumper off beats 0-2, trunk up beats 2-6
    src: /home/user/media/work/miata/renders/final/s6_rear_open
    src_fps: 14.7656   # minterpolate: 63 renders -> 2N-3; src_fps = 30*N/(slot+4)
    interpolate: true
    frames: 124
    dur: 4.1333
  - transition: {type: cut, note: "24.886 phrase"}
  - id: s7_top         # up and over to top-down
    src: /home/user/media/work/miata/renders/final/s7_top
    src_fps: 14.5455   # minterpolate: 32 renders -> 2N-3; src_fps = 30*N/(slot+4)
    interpolate: true
    frames: 62
    dur: 2.0667
  - transition: {type: cut, note: "26.955 - panels separate"}
  - id: s8_explode     # separate, drift + orbit, LOCK on 32.127 kick, hold 2 beats
    src: /home/user/media/work/miata/renders/final/s8_explode
    src_fps: 14.8421   # minterpolate: 94 renders -> 2N-3; src_fps = 30*N/(slot+4)
    interpolate: true
    frames: 186
    dur: 6.2000
  - transition: {type: cut, note: "33.162 last hit - logo over the decay"}
  - id: logo           # projects/ferrari-296/tools/logo_card.py --secs 3.4333
    src: /home/user/media/work/miata/out/logo_card.mp4
