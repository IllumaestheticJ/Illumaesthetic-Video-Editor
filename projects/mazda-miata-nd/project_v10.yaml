# Mazda Miata ND - v10 = v9 + reassembly camera starts exactly on the rear explode camera (no jump cut at 28.2 s). v9 = v8 + trunk lid re-cut (user: "the rear trunk is not cut right"): lid = what moved in the trunk-open scan,
# incl. its wrapped rear face with the badge; trunk + explode shots re-rendered (renders_v9). v8 notes: the real drop of Megalomaniac is 45.488 s (k64: bass section starts after a 1-bar riser from 43.1 s);
# v7 faded out on it (user: "the drop is right when the music ends"). Music from 21.052 s (2 frames before the k12 bar hit) so the
# panels separate ON the drop; the riser plays under the trunk opening. Re-time only - every render reused.
# Beat grid onset(k) = 15.4952 + k*0.46864.
project: mazda-miata-nd
format: reel-9x16
output: {path: /home/user/media/work/miata/out/miata_nd_v10_nolabels.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

