    src: /home/user/media/work/miata/renders_v6/final/v6_a_open
    src_fps: 14.7458   # 58 renders
    interpolate: true
    frames: 114
    dur: 3.8000
  - transition: {type: cut}
  - id: s4_lamp   # section: front | focus: right headlight + grille
    src: /home/user/media/work/miata/renders/final/s4_lamp
