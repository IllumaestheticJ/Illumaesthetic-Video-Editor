# Mazda Miata ND - v6: user's v5 notes. Music from the BEGINNING of Megalomaniac (trending side): starts 0.432 s (2 frames
# before the first sound); intro has a beat-locked pulse (onsets every beat), kick enters at 15.495 s (onset) = k0 where the hood
# lands. Wheel close-up removed. Side shot stays on the skirt + exposed sill for 4 beats after it slides out.
# Beat grid: onset(k) = 15.4952 + k*0.46864; cuts on k = -24 -20 -12 -4 2 12 18 22 26 30; CTA at k34; logo; music fades out.
project: mazda-miata-nd
format: reel-9x16
output: {path: /home/user/media/work/miata/out/miata_nd_v6_nolabels.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/mega_cut_v6.wav   # not in git (user-supplied track)
  start: 0
  fade_out: 1.5

timeline:
