# Mazda Miata ND - v7: user's v6 notes. Music starts 2 bars before the DROP of Megalomaniac (drop = 15.495 s onset, the sub-bass
# jumps 14 dB; music from 11.679 s = 2 frames before bar -2) and the reel HARD-CUTS on the drop into the front bumper popping off
# (clip trimmed half a beat so the bumper moves on the hit). Headlight detail dropped to get to the drop in 3.75 s.
# Trunk lid refined (tools/refine_lid.py): tail-light pieces that stay on the body in the trunk-open state scan no longer go with
# the lid; composites cut 6 mm around it (tools/composite.py per-panel cut). Beat grid onset(k) = 15.4952 + k*0.46864.
project: mazda-miata-nd
format: reel-9x16
output: {path: /home/user/media/work/miata/out/miata_nd_v7_nolabels.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/mega_cut_v7.wav   # not in git (user-supplied track)
  start: 0
  fade_out: 1.5

