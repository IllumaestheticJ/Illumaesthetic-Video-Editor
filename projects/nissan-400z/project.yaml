# Nissan 400Z - Temerario-style scan reel v1 (scan only: no IRL footage, no text).
# Satin-metallic silver scan on pure black (projects/ferrari-296/tools/shot.py + tools/shots.py), x0.955 gain to match
# Temerario.mov car luma. Renders: 1080x1920 @ 75 %, 12 spp, 15 fps -> minterpolate to 30 fps.
# Music: track generated for this reel (parent session, ElevenLabs via Higgsfield) - ~129.6 BPM phonk, drop 7.43 s,
# heaviest kicks every 8 beats from 8.243 s, last hit 36.97 s, tail fades to ~38.4 s (tools/kicks.py, music_grid.py).
# Cuts land on round(t*30) of measured hits; durs are whole frames, first clip one frame short (assembler adds a
# frame per cut). Close-ups / hood / top are played faster than rendered (src_fps) to fit their hits.
project: nissan-400z
format: reel-9x16
output: {path: /home/user/media/work/out/nissan_400z_scan_v1.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/nissan-400z_track.mp3
  start: 0
  fade_out: 1.2

# cut times (s): 3.70 7.43(drop) 9.282 11.128 12.974 16.666 19.319 26.703 34.087(logo) end 38.4
beats: [3.70, 7.43, 9.282, 11.128, 12.974, 16.666, 19.319, 23.011, 26.703, 30.395, 34.087, 36.97]

timeline:
  - id: s1_front34     # intro bars 1-2: low front 3/4 turntable, fades up from black
    src: /home/user/media/work/z400/renders/final/s1_front34
    src_fps: 15
    interpolate: true
    dur: 3.6667        # 110 f (first clip one frame short)
    vf: "colorchannelmixer=rr=0.955:gg=0.955:bb=0.955,fade=t=in:st=0:d=1.2"
  - transition: {type: cut, note: "3.70 intro bar 3"}
  - id: s2_rear34      # intro bars 3-4: rear 3/4 orbit
    src: /home/user/media/work/z400/renders/final/s2_rear34
    src_fps: 15
    interpolate: true
    dur: 3.7333        # 112 f
    vf: "colorchannelmixer=rr=0.955:gg=0.955:bb=0.955"
  - transition: {type: cut, note: "7.43 THE DROP"}
  - id: s3_haunch      # high glide along the right rear haunch to the mirror (2 mm)
    src: /home/user/media/work/z400/renders/final/s3_haunch
    src_fps: 25
    interpolate: true
    dur: 1.8333        # 55 f
    vf: "colorchannelmixer=rr=0.955:gg=0.955:bb=0.955"
  - transition: {type: cut, note: "9.282 kick"}
  - id: s4_lamp        # headlight + grille close-up (2 mm)
    src: /home/user/media/work/z400/renders/final/s4_lamp
    src_fps: 25
    interpolate: true
    dur: 1.8667        # 56 f
    vf: "colorchannelmixer=rr=0.955:gg=0.955:bb=0.955"
  - transition: {type: cut, note: "11.128 kick"}
  - id: s5_tail        # tail-lamp bar + badge close-up (2 mm)
    src: /home/user/media/work/z400/renders/final/s5_tail
    src_fps: 25
    interpolate: true
    dur: 1.8333        # 55 f
    vf: "colorchannelmixer=rr=0.955:gg=0.955:bb=0.955"
  - transition: {type: cut, note: "12.974 kick"}
  - id: s6_hood        # hood opens on the fitted hinge, engine bay from 'Hood Open'
    src: /home/user/media/work/z400/renders/final/s6_hood
    src_fps: 19
    interpolate: true
    dur: 3.7           # 111 f
    vf: "colorchannelmixer=rr=0.955:gg=0.955:bb=0.955"
  - transition: {type: cut, note: "16.666 kick"}
  - id: s7_top         # rise to straight overhead, nose up
    src: /home/user/media/work/z400/renders/final/s7_top
    src_fps: 23
    interpolate: true
    dur: 2.6667        # 80 f
    vf: "colorchannelmixer=rr=0.955:gg=0.955:bb=0.955"
  - transition: {type: cut, note: "19.319 phrase accent - panels separate"}
  - id: s8a_explode    # high front-right: hood/bumper/grille/spoiler/mirrors separate, fully out on 23.01
    src: /home/user/media/work/z400/renders/final/s8a_explode
    src_fps: 15
    interpolate: true
    dur: 7.3667        # 221 f
    vf: "colorchannelmixer=rr=0.955:gg=0.955:bb=0.955"
  - transition: {type: cut, note: "26.703 phrase accent - angle change, panels start home"}
  - id: s8b_explode    # high rear-left: panels LOCK on 30.395 (loudest kick), car rests
    src: /home/user/media/work/z400/renders/final/s8b_explode
    src_fps: 15
    interpolate: true
    dur: 7.4           # 222 f
    vf: "colorchannelmixer=rr=0.955:gg=0.955:bb=0.955"
  - transition: {type: cut, note: "34.087 phrase accent - logo"}
  - id: logo           # ILLUMAESTHETIC card (projects/ferrari-296/tools/logo_card.py --width 540 --secs 4.4), fades with the tail
    src: /home/user/media/work/z400/logo_card.mp4
    dur: 4.3           # 129 f -> ends 38.4 s
