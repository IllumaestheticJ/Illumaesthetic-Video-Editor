# v8: 'how we modified this truck' (user on v7) - stock scan -> grille -> bumper -> mounts -> Ronin grille + SCANNED grille lights ->
# flares off -> wide fenders + SCANNED fender lights -> wheels -> lift -> turbos/livery -> 1:1 cut to the real truck. Shots: tools/shots_v8.py,
# lights: tools/lights.py. v7 = project_v7.yaml.
# Assemble: python projects/ferrari-296/tools/assemble_cuts.py projects/nissan-frontier/project.yaml
project: nissan-frontier
format: reel-9x16
output: {path: /home/user/media/work/frontier/out/nissan_frontier_v8.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

