# v10: full-car-scan bumper once the trimmed one is on, badge on the CAD ring, grille lights under the brow windows, MotoIQ logo on the
# end card, music M.O.O.N. 'Paris' from 115.337 s (drop on the first mod, frame 434); every cut on 434 + 18k (100 BPM). v9 = project_v9.yaml.
# v9: grille-clipping sections removed, scanned badge on the new grille, labels without MOD/STEP numbers (v8 = project_v8.yaml).
# v8: 'how we modified this truck' built on the Sentra short-form playbook (knowledge/short-form.md on claude/upbeat-goldberg-gy0s84):
# real-article HOOK -> answer card -> build in order (scanned grille + fender lights) -> livery + 360 of the final render -> 1:1 CUT to the
# real truck ON THE CRASH (frame 1270) -> real clips -> photo + logo. Shots: tools/shots_v10.py (30 fps, tools/render30.sh), lights: tools/lights.py,
# cards: tools/build_v8_cards.py, press: tools/capture.js. v7 = project_v7.yaml.
# Assemble: python projects/ferrari-296/tools/assemble_cuts.py projects/nissan-frontier/project.yaml
project: nissan-frontier
format: reel-9x16
output: {path: /home/user/media/work/frontier/out/nissan_frontier_v10.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
