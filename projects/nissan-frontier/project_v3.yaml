    src_fps: 15
    interpolate: true
    frames: 111
    dur: 3.7000
  - transition: {type: cut}
  - id: v3_s7_flares
    section: side
    focus: "FENDER FLARES pull out onto black and turn to show their back"
    src: /home/user/media/work/frontier/renders/final/v3_s7_flares
    src_fps: 15
    interpolate: true
    frames: 108
    dur: 3.6000
  - transition: {type: cut}
  - id: v3_s8_home
    section: whole
    focus: "parts home one per beat from the crash; FULL TRUCK; fade"
    src: /home/user/media/work/frontier/renders/final/v3_s8_home
    src_fps: 15
    interpolate: true
    frames: 182
    dur: 6.0667
    fade_out: 0.6
  - transition: {type: cut}
  - id: logo
    section: logo
    focus: "ILLUMAESTHETIC logo (700 px) after the fade"
    src: /home/user/media/work/frontier/out/logo_card_v3.mp4
    frames: 136
    dur: 4.5333

