# v3 - user notes on v2: bigger logo; clean flares that show their back; no bumper leftovers on the truck; hood opens on its
# hinge. Shots: tools/shots_v3.py (S1/S2 = v2 renders). Same cut frames as v2. v2: project_v2.yaml, v1: project_v1.yaml.
# Assemble: python projects/ferrari-296/tools/assemble_cuts.py projects/nissan-frontier/project.yaml
project: nissan-frontier
format: reel-9x16
output: {path: /home/user/media/work/frontier/out/nissan_frontier_v3.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/nissan-frontier_track.mp3   # not in git
  start: 0
  fade_out: 0.6

beats: [4.882, 9.657, 14.459, 18.038, 20.466, 24.177, 27.781, 33.826]

timeline:
  - id: v2_s1_wide
    section: whole
    focus: "whole truck, front-right 3/4, moving from frame 1"
    src: /home/user/media/work/frontier/renders/final/v2_s1_wide
    src_fps: 15
    interpolate: true
    frames: 146
    dur: 4.8667
  - transition: {type: cut}
  - id: v2_s2_grille
    section: front
    focus: "grille + badge close-up; GRILLE highlighted + labelled"
    src: /home/user/media/work/frontier/renders/final/v2_s2_grille
    src_fps: 15
    interpolate: true
    frames: 144
    dur: 4.8000
  - transition: {type: cut}
  - id: v3_s3_bumper
    section: front
    focus: "FRONT BUMPER off on the drop; grille lifts off it; bumper turns to show its scanned inside"
    src: /home/user/media/work/frontier/renders/final/v3_s3_bumper
    src_fps: 15
    interpolate: true
    frames: 144
    dur: 4.8000
  - transition: {type: cut}
  - id: v3_s4_removed
    section: front
    focus: "FRONT BUMPER REMOVED state - push-in on what is behind the bumper"
    src: /home/user/media/work/frontier/renders/final/v3_s4_removed
    src_fps: 15
    interpolate: true
    frames: 107
    dur: 3.5667
  - transition: {type: cut}
  - id: v3_s5_hood
    section: front
    focus: "HOOD opens on its fitted hinge (33.5 deg from the propped-hood fragments)"
    src: /home/user/media/work/frontier/renders/final/v3_s5_hood
    src_fps: 15
    interpolate: true
    frames: 73
    dur: 2.4333
  - transition: {type: cut}
  - id: v3_s6_struct
    section: front
    focus: "FRONT STRUCTURE (bumper + hood removed scan)"
