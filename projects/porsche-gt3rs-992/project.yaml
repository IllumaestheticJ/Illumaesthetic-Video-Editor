# Porsche 911 GT3 RS (992) - scan reel v2 (direction.md: scene director + director, 2026-11-11 user rules A-D).
# One clockwise lap, one section per sequence; aero parts come off section by section and stay off (progressive
# explode), top overview of everything off, then the layered stack on the drop, reassembly, fade, SMALL logo.
# Shots: tools/shots_v2.py (new) + v1 renders s3_wheel / s5_wing reused (tools/shots.py). Base = comp_v2 (only the
# 9 moving parts cut out; strakes, fender vent, rear strake, diffuser trim stay as scanned - no removed-state scans).
# Music: porsche-gt3rs-992_track.mp3 (generated for this reel). Cuts only on onsets measured from the decoded audio
# (1 ms RMS half-rise): 3.779, 5.565, 11.281, 14.093, 16.807, 18.779, 22.532, 26.285 (drop), 33.782 (logo).
# Frames: 113, 167, 338, 423, 504, 563, 676, 789, 1013; end 1140 (38.0 s).
# Transitions are 1-frame fades with one extra real frame on each outgoing clip (no cloned hold frame before cuts).
project: porsche-gt3rs-992
format: reel-9x16
output: {path: /home/user/media/work/gt3/out/porsche_gt3rs_992_v2.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/porsche-gt3rs-992_track.mp3   # not in git
  start: 0
  fade_out: 0.3

beats: [3.779, 5.565, 11.281, 14.093, 16.807, 18.779, 22.532, 26.285, 33.782]

timeline:
  - id: sh1_whole      # whole car, low front-left 3/4, slide + small push
    section: whole
    focus: whole car (nose aero, wing silhouette)
    src: /home/user/media/work/gt3/renders/final/v2_sh1
    src_fps: 15
    interpolate: true
    dur: 3.8000          # 113 frames + 1 overlap frame
  - transition: {type: fade, duration: 0.0333, note: "3.779 big hit b8"}
  - id: sh2_wheel      # REUSE v1 s3_wheel: FL centre-lock + drilled disc
    section: wheel
    focus: front-left wheel, centre-lock, drilled disc
    src: /home/user/media/work/gt3/renders/final/s3_wheel
    src_fps: 15
    interpolate: true
    dur: 1.8333          # 54 + 1
  - transition: {type: fade, duration: 0.0333, note: "5.565 medium hit b12"}
  - id: sh3_nose       # lip off 7.53->9.31, grille trim toward camera, hood-vent top up 9.31->10.34
    section: front
    focus: front aero (lip, grille trim, hood-vent top)
    src: /home/user/media/work/gt3/renders/final/v2_sh3
    src_fps: 15
    interpolate: true
    dur: 5.7333          # 171 + 1
  - transition: {type: fade, duration: 0.0333, note: "11.281 big hit b24"}
  - id: sh4_louvres    # right front fender louvres, front parts held off
    section: front
    focus: right front fender louvres
    src: /home/user/media/work/gt3/renders/final/v2_sh4
    src_fps: 15
    interpolate: true
    dur: 2.8667          # 85 + 1
  - transition: {type: fade, duration: 0.0333, note: "14.093 big hit b30"}
  - id: sh5_wing       # REUSE v1 s5_wing (trimmed): swan-neck mounts + deck louvres
    section: rear
    focus: swan-neck wing mounts
    src: /home/user/media/work/gt3/renders/final/s5_wing
    src_fps: 15
    interpolate: true
    trim_start: 0.27
    dur: 2.7333          # 81 + 1
  - transition: {type: fade, duration: 0.0333, note: "16.807 medium hit b36"}
  - id: sh6_rear       # diffuser + undertray back, both QP intakes out
    section: rear
    focus: rear diffuser + undertray, quarter-panel intakes
    src: /home/user/media/work/gt3/renders/final/v2_sh6
    src_fps: 15
    interpolate: true
    dur: 2.0000          # 59 + 1
  - transition: {type: fade, duration: 0.0333, note: "18.779 big hit b40"}
  - id: sh7_side       # left sill dolly, skirts off
    section: side
    focus: left side skirts + strake
    src: /home/user/media/work/gt3/renders/final/v2_sh7
    src_fps: 15
    interpolate: true
    dur: 3.8000          # 113 + 1
  - transition: {type: fade, duration: 0.0333, note: "22.532 big hit b48"}
  - id: sh8_top        # crane to near top-down, everything off
    section: top
    focus: all removed parts around the car
    src: /home/user/media/work/gt3/renders/final/v2_sh8
    src_fps: 15
    interpolate: true
    dur: 3.8000          # 113 + 1
  - transition: {type: fade, duration: 0.0333, note: "26.285 drop b56"}
  - id: sh9_stack      # layered stack (lands 29.12), fly home, lock 31.905, fade to black 32.40->33.30
    section: whole
    focus: exploded stack -> reassembly
    src: /home/user/media/work/gt3/renders/final/v2_sh9
    src_fps: 15
    interpolate: true
    vf: "fade=t=out:st=6.1:d=0.9"
    dur: 7.5000          # 224 + 1
  - transition: {type: fade, duration: 0.0333, note: "33.782 big hit b72 -> logo"}
  - id: logo           # small logo (300 px), fades with the music's decay
    src: /home/user/media/work/gt3/logo_v2.mp4
    dur: 4.2333

overlays: []
