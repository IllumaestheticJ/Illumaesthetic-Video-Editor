# Subaru Impreza STI GD 'blobeye' - Temerario-style scan reel (scan only: no IRL footage, no text). Sibling of ferrari-296 / huracan-evo / a90-supra.
# Satin-silver scan on black; turntables -> close-ups -> hood open -> top-down -> exploded view -> logo.
# Shots: tools/shots.py (specs, timing from cues.json) rendered with tools/shot.py (lexus-is300 copy of the ferrari-296 renderer + exposure -0.5 EV) (75 %, 12 spp, 15 fps, minterpolate to 30).
# Music: subaru-sti-blobeye_track.mp3 - original eurobeat-inspired track generated for this reel by the coordinating session (not in git).
# Grid: 152.00 BPM, beat 0.39473 s, t0 0.06 s (kick/hat attack; ive beats onsets run ~45 ms early). Cuts on bar lines, frames round(t*30).
# Clip durs are whole frames; first clip one frame short (assembler adds the cut hold frame).
project: subaru-sti-blobeye
format: reel-9x16
output: {path: /home/user/media/work/sti/out/subaru_sti_blobeye_v1.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/subaru-sti-blobeye_track.mp3
  start: 0
  fade_out: 0.3

beats: [4.800, 7.967, 9.533, 11.100, 12.700, 17.433, 22.167, 34.800]

timeline:
  - id: s1_front34   # low front-right 3/4 turntable, moving from frame 1
    src: /home/user/media/work/sti/renders/final/s1_front34
    src_fps: 15
    interpolate: true
    dur: 4.7667
  - transition: {type: cut, note: "bar line 4.800 s"}
  - id: s2_rear34   # rear-left 3/4 orbit, wing against black
    src: /home/user/media/work/sti/renders/final/s2_rear34
    src_fps: 15
    interpolate: true
    dur: 3.1667
  - transition: {type: cut, note: "bar line 7.967 s"}
  - id: s3_wheel   # extreme close-up: front-right wheel, caliper, disc (2 mm)
    src: /home/user/media/work/sti/renders/final/s3_wheel
    src_fps: 15
    interpolate: true
    dur: 1.5667
  - transition: {type: cut, note: "bar line 9.533 s"}
  - id: s4_light   # blobeye headlight -> hood scoop crane (2 mm)
    src: /home/user/media/work/sti/renders/final/s4_light
    src_fps: 15
    interpolate: true
    dur: 1.5667
  - transition: {type: cut, note: "bar line 11.100 s"}
  - id: s8_wing   # wing end plate + tail light (2 mm), plate kept out of frame
    src: /home/user/media/work/sti/renders/final/s8_wing
    src_fps: 15
    interpolate: true
    dur: 1.6000
  - transition: {type: cut, note: "bar line 12.700 s"}
  - id: s5_hood   # hood opens on its rear hinge over the Engine Bay scan, from 1 beat after the 12.69 lift
    src: /home/user/media/work/sti/renders/final/s5_hood
    src_fps: 15
    interpolate: true
    dur: 4.7333
  - transition: {type: cut, note: "bar line 17.433 s"}
  - id: s6_top   # top-down, slow spin + push
    src: /home/user/media/work/sti/renders/final/s6_top
    src_fps: 15
    interpolate: true
    dur: 4.7333
  - transition: {type: cut, note: "bar line 22.167 s"}
  - id: s7_explode   # hood/bumper/wing/left skirt float up on bar 16 (25.32), drift, slam home on bar 21 (33.22), hold
    src: /home/user/media/work/sti/renders/final/s7_explode
    src_fps: 15
    interpolate: true
    dur: 12.6333
  - transition: {type: cut, note: "bar line 34.800 s"}
  - id: logo           # ILLUMAESTHETIC logo card (ferrari-296/tools/logo_card.py), through the final hit 37.95, fades with the music
    src: /home/user/media/work/sti/out/logo_card.mp4
    dur: 4.5000

overlays: []
