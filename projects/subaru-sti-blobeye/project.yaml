# Subaru Impreza STI GD 'blobeye' - v3 edit (file v4): every shot is ONE scan as captured; removals are 1:1 state swaps.
# Generated by tools/make_yaml_v3.py. Cuts on measured kick attacks (150 BPM, kick every 0.400 s -> frame 97 + 12k).
project: subaru-sti-blobeye
format: reel-9x16
output: {path: /home/user/media/work/sti/out/subaru_sti_blobeye_v4.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/subaru-sti-blobeye_track.mp3
  start: 0
  fade_out: 0.3

beats: [3.233, 6.433, 8.033, 9.633, 11.233, 13.233, 18.833, 20.433, 25.233, 30.033, 34.833]

timeline:
  - id: O1_open   # Blobeye Full Car: rear-left 3/4 orbit, moving from frame 1
    src: /home/user/media/work/sti/renders/final/O1_open
    section: whole
    focus: "whole car, wing"
    src_fps: 14.2424   # 48 frames
    interpolate: true
    dur: 3.2000
  - transition: {type: cut, note: "3.233 s"}
  - id: R_wing   # full car: push in on the wing / trunk
    src: /home/user/media/work/sti/renders/final/R_wing
    section: rear
    focus: "wing"
    src_fps: 14.2424   # 48 frames
    interpolate: true
    dur: 3.2000
  - transition: {type: cut, note: "6.433 s"}
  - id: wing   # full car 2 mm: wing end plate and tail light
    src: /home/user/media/work/sti/renders/final/s8_wing
    section: rear
    focus: "wing end plate + tail light"
    src_fps: 13.5294   # 24 frames
    interpolate: true
    dur: 1.6000
  - transition: {type: cut, note: "8.033 s"}
  - id: wheel   # full car 2 mm: wheel, caliper, disc
    src: /home/user/media/work/sti/renders/final/s3_wheel
    section: wheel
    focus: "front-right wheel + caliper"
    src_fps: 13.5294   # 24 frames
    interpolate: true
    dur: 1.6000
  - transition: {type: cut, note: "9.633 s"}
  - id: light   # full car 2 mm: blobeye headlight to the scoop
    src: /home/user/media/work/sti/renders/final/s4_light
    section: front
    focus: "headlight -> hood scoop"
    src_fps: 13.5294   # 24 frames
    interpolate: true
    dur: 1.6000
  - transition: {type: cut, note: "11.233 s"}
  - id: H_a   # full car: push in over the hood
    src: /home/user/media/work/sti/renders/final/H_a
    section: engine
    focus: "hood + scoop"
    src_fps: 13.8095   # 30 frames
    interpolate: true
    dur: 2.0000
  - transition: {type: cut, note: "13.233 s"}
  - id: E_bay   # STATE SWAP -> 'GD Scan Engine Bay' scan, alone
    src: /home/user/media/work/sti/renders/final/E_bay
    section: engine
    focus: "engine bay"
    src_fps: 14.5614   # 84 frames
    interpolate: true
    dur: 5.6000
  - transition: {type: cut, note: "18.833 s"}
  - id: B_a   # full car: low push in on the bumper
    src: /home/user/media/work/sti/renders/final/B_a
    section: front
    focus: "front bumper"
    src_fps: 13.5294   # 24 frames
    interpolate: true
    dur: 1.6000
  - transition: {type: cut, note: "20.433 s"}
  - id: B_b   # STATE SWAP -> 'bumper removed' scan, alone (label)
    src: /home/user/media/work/sti/renders/final/B_b
    section: front
    focus: "intercooler core"
    src_fps: 14.4898   # 72 frames
    interpolate: true
    dur: 4.8000
  - transition: {type: cut, note: "25.233 s"}
  - id: B_c   # STATE SWAP -> 'all removed' scan (bumper + hood off), alone (label)
    src: /home/user/media/work/sti/renders/final/B_c
    section: front
    focus: "intercooler piping"
    src_fps: 14.4898   # 72 frames
    interpolate: true
    dur: 4.8000
  - transition: {type: cut, note: "30.033 s"}
  - id: close   # full car: front-right 3/4 turntable, fade to black
    src: /home/user/media/work/sti/renders/final/s1_front34
    section: whole
    focus: "whole car, front"
    src_fps: 14.4898   # 72 frames
    interpolate: true
    dur: 4.8000
    vf: "fade=t=out:st=4.0000:d=0.7667"   # fade to black before the logo
  - transition: {type: cut, note: "34.833 s"}
  - id: logo   # small 280 px logo after 0.4 s black, through the final hit, fades with the music
    src: /home/user/media/work/sti/out/logo_small.mp4
    dur: 4.4333

overlays:
  - {src: /home/user/media/work/sti/out/hud_v3.mov, start: 20.4333}   # overlay.json: labels on the two bumper-off state scans
