# Subaru WRX VA - scan reel v2 (scan only; labels over scan shots only, per user feedback 2026-11-11).
# Order from the scan features (direction.md, scene-director agent) and per-shot focus (director.md, director agent):
# front (whole car, hood open, bumper hero beat, scoop) -> side -> rear (wing, trunk open) -> top reassembly -> fade -> small logo.
# v1 timeline kept in project_v1.yaml. Music, beat grid and length unchanged (132.4 BPM, b_k = 0.0567 + 0.4533 k).
project: subaru-wrx-va
format: reel-9x16
output: {path: /home/user/media/subaru-wrx-va/out/subaru_wrx_va_scan_v2.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/subaru-wrx-va_track.mp3   # not committed
  start: 0
  fade_out: 1.2

# cut kicks (s): b6 2.776, b12 5.496, b26 11.842, b30 13.656, b34 15.468, b42 19.095, b46 20.907, b54 24.533, b58 26.346
beats: [-0.021, 2.677, 5.48, 11.765, 13.587, 15.402, 19.04, 20.86, 24.495, 26.318, 29.03]   # broadband kick attacks measured on the decoded track (v2); v1 grid read ~78 ms late

overlays:
  - src: /home/user/media/subaru-wrx-va/out/hud_v2.mov   # labels (overlay_v2.json, ive hud)

timeline:
  - id: s01_front34      # b0-b6 WHOLE CAR, front 3/4, src frames 0-41 (later frames push the tail to the edge)
    section: whole car
    focus: whole car, front 3/4
    beat: 0
    src: /home/user/media/subaru-wrx-va/renders/s01_front34
    src_fps: 15
    interpolate: true
    speed: 1.0
    dur: 2.6333          # 79 frames (first clip one frame short -> cut at f80)
    vf: "fade=t=in:st=0:d=0.6"
  - transition: {type: cut, note: "b6 kick 2.776 (f80, v2 measured attack 2.677)"}
  - id: s06_hood         # b6-b12 ENGINE BAY, captured hood-open state
    section: engine bay
    focus: engine bay under the propped hood
    beat: 6
    src: /home/user/media/subaru-wrx-va/renders/s06_hood
    src_fps: 15
    interpolate: true
    speed: 1.30
    dur: 2.8000          # 84 frames
  - transition: {type: cut, note: "b12 kick 5.496 (f164)"}
  - id: n1_bumper        # b12-b26 FRONT BUMPER (hero): bezels out, bumper off + flip (inside), push in on the bumper-removed front end
    section: front bumper
    focus: front bumper, then the front end behind it (fbumpremoved)
    beat: 12
    src: /home/user/media/subaru-wrx-va/renders/n1_bumper30   # 30 fps: odd = 15 fps renders, even = real renders on part moves, mci elsewhere
    src_fps: 30
    interpolate: false
    speed: 1.0
    dur: 6.3000          # 189 frames
  - transition: {type: cut, note: "b26 kick 11.842 (f353)"}
  - id: n2_scoop         # b26-b30 HOOD: scoop lifts off, opening below
    section: hood
    focus: hood scoop and the scoop opening
    beat: 26
    src: /home/user/media/subaru-wrx-va/renders/n2_scoop
    src_fps: 15
    interpolate: true
    speed: 1.0
    dur: 1.8333          # 55 frames
  - transition: {type: cut, note: "b30 kick 13.656 (f408)"}
  - id: n_side           # b30-b34 SIDE: whole-car profile glide az 100->135 (reframed after stills)
    section: side
    focus: whole car, left side profile -> rear 3/4
    beat: 30
    src: /home/user/media/subaru-wrx-va/renders/n_side
    src_fps: 15
    interpolate: true
    speed: 1.0
    dur: 1.8000          # 54 frames
  - transition: {type: cut, note: "b34 15.469 (f462) - section change, first half-time kick"}
  - id: n3_wing          # b34-b42 REAR: wing, rise from under the blade (scanned underside) to blade level, no removal
    section: rear
    focus: STI wing uprights and blade
    beat: 34
    src: /home/user/media/subaru-wrx-va/renders/n3_wing
    src_fps: 15
    interpolate: true
    speed: 1.0
    dur: 3.6333          # 109 frames
  - transition: {type: cut, note: "b42 kick 19.095 (f571)"}
  - id: s07_trunk        # b42-b46 REAR: captured trunk-open state, src frames 0-27 (straight high rear)
    section: rear
    focus: open trunk lid and cavity
    beat: 42
    src: /home/user/media/subaru-wrx-va/renders/s07_trunk
    src_fps: 15
    interpolate: true
    speed: 1.0
    dur: 1.8333          # 55 frames
  - transition: {type: cut, note: "b46 kick 20.909 (f626) - wide fully exploded"}
  - id: n4a_reassemble   # b46-b54 TOP/WIDE: whole car, nose up; bumper/fogs/scoop fly home, last lock on b54
    section: top
    focus: whole car reassembling
    beat: 46
    src: /home/user/media/subaru-wrx-va/renders/n4a_reassemble
    src_fps: 15
    interpolate: true
    speed: 1.0
    dur: 3.6333          # 109 frames
  - transition: {type: cut, note: "b54 kick 24.535 (f735) - swap to the clean car, same camera"}
  - id: n4b_clean        # b54-b58 same camera continues on the clean full car, fade to black
    section: top
    focus: whole car, assembled
    beat: 54
    src: /home/user/media/subaru-wrx-va/renders/n4b_clean
    src_fps: 15
    interpolate: true
    speed: 1.0
    dur: 1.8333          # 55 frames
    vf: "fade=t=out:st=0.9:d=0.9"
  - transition: {type: cut, note: "b58 kick 26.348 (f790) - small logo"}
  - id: logo             # small ILLUMAESTHETIC (~30 % width) fading in on black; rebuild logo_card.sh with scale=324 + fade in 0.5 s
    beat: 58
    src: /home/user/media/subaru-wrx-va/logo_card_v2.mp4
    dur: 4.4667          # 134 frames -> 923 total
