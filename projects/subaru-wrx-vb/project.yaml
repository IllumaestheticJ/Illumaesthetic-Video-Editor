# Subaru WRX VB (2022+) scan reel v4. Scan only, silver on black. Reviewer v3 notes (feedback.jsonl): the trunk was not
# cut correctly, the front bumper had a ton of artifacts, remove the front bumper first, then pull the grille and parts off.
# (v3: project_v3.yaml. v2 notes: edit to the uploaded track, deeper front teardown, trunk opens, clean bumper cut-out.)
# Order: whole car -> hood scoop -> FRONT (grille, lower garnish, bumper shell off one per beat from the drop, labelled)
# -> right-side cladding off -> REAR (trunk opens to the scanned open pose, rear bumper off, labelled) -> reassembly
# -> fade -> small logo. Shots: tools/shots_v4.py over base b4 (tools/seg_v4.py + build_v4.py); opener + scoop reused from v2/v1.
# Music: Roni Size - The Streets (user upload; not in git), track 146.799 -> 180.399, fades baked into seg.wav.
# Grid: beat 1 of each bar = reel 1.3672 n (track 153.635 + 1.3672 n); the drop slams in at reel 6.152.
# Cuts (reel s): 4.101, 6.152 (drop), 13.633, 19.100, 25.900, 30.000 (measured broadband hits; the track is 176.0 BPM,
# beat 0.34095 s, so the 1.3672 s grid drifted up to 76 ms by 26 s); end 33.3. src_fps per clip = 30*N/(slot+4).
project: subaru-wrx-vb
format: reel-9x16
output: {path: /home/user/media/work/wrx/out/subaru_wrx_vb_v4.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/streets/seg.wav   # not in git
  start: 0
  fade_out: 0

beats: [4.101, 6.152, 13.633, 19.100, 25.900, 30.000]

timeline:
  - id: v2_opener      # whole car, elevated front-right 3/4, moving from frame 1 (breakdown), v2 render at 1.25x
    focus: whole car
    src: /home/user/media/work/wrx/renders/final/v2_opener
    src_fps: 18.810
    interpolate: true
    dur: 4.0667
  - transition: {type: cut, note: "4.101 beat 1"}
  - id: s4_scoop       # v1 render: hood scoop, the front's signature detail
    focus: hood scoop
    src: /home/user/media/work/wrx/renders/final/s4_scoop
    src_fps: 19.545
    interpolate: true
    dur: 2.0667
  - transition: {type: cut, note: "6.152 drop"}
  - id: v4_front       # whole bumper assembly off on the drop, then grille, lower garnish, shell flip; push in on the structure
    focus: front bumper parts / structure behind them
    src: /home/user/media/work/wrx/renders/final/v4_front
    src_fps: 15.000
    interpolate: true
    dur: 7.4667
  - transition: {type: cut, note: "13.633 snare hit"}
  - id: v4_side        # front flare / door flare / rear flare / skirt, one per bar; wide of all four
    focus: right-side cladding
    src: /home/user/media/work/wrx/renders/final/v4_side
    src_fps: 14.821
    interpolate: true
    dur: 5.4667
  - transition: {type: cut, note: "19.100 hit"}
  - id: v4_rear        # trunk lid opens on its fitted hinge to the scanned open pose; rear bumper off; hold on structure
    focus: trunk / rear bumper / structure behind it
    src: /home/user/media/work/wrx/renders/final/v4_rear
    src_fps: 15.000
    interpolate: true
    dur: 6.8
  - transition: {type: cut, note: "25.900 hit"}
  - id: v4_reassemble  # lid closes, rear bumper, side; grille + garnish rejoin the shell in the air, assembly locks; clean car; fade
    focus: whole car (reassembly)
    src: /home/user/media/work/wrx/renders/final/v4_reassemble
    src_fps: 14.882
    interpolate: true
    dur: 4.1
    vf: "fade=t=out:st=3.35:d=0.75"
  - transition: {type: cut, note: "30.000 hit - small logo through the music fade"}
  - id: logo           # projects/ferrari-296/tools/logo_card.py --secs 3.3 --width 380 --fade-out 0.8
    focus: logo
    src: /home/user/media/work/wrx/out/logo_small.mp4
    dur: 3.3333

overlays:
  - src: /home/user/media/work/wrx/out/hud_wrx_v4.mov   # ive hud projects/subaru-wrx-vb/overlay.json
    start: 0
