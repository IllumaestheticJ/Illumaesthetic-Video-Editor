# Subaru WRX VB (2022+) scan reel v3. Scan only, silver on black. Reviewer v2 notes (feedback.jsonl): edit to the uploaded
# track, the front bumper disassembles further, there is a trunk-open scan, the bumper cut-out wasn't clean.
# Order: whole car -> hood scoop -> FRONT (grille, lower garnish, bumper shell off one per beat from the drop, labelled)
# -> right-side cladding off -> REAR (trunk opens to the scanned open pose, rear bumper off, labelled) -> reassembly
# -> fade -> small logo. Shots: tools/shots_v3.py over base b3 (tools/build_v3.py); opener + scoop reused from v2/v1.
# Music: Roni Size - The Streets (user upload; not in git), track 146.799 -> 180.399, fades baked into seg.wav.
# Grid: beat 1 of each bar = reel 1.3672 n (track 153.635 + 1.3672 n); the drop slams in at reel 6.152.
# Cuts (reel s): 4.101, 6.152 (drop), 13.672, 19.141, 25.977, 30.078; end 33.4. src_fps per clip = 30*N/(slot+4).
project: subaru-wrx-vb
format: reel-9x16
output: {path: /home/user/media/work/wrx/out/subaru_wrx_vb_v3.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/streets/seg.wav   # not in git
  start: 0
  fade_out: 0

beats: [4.101, 6.152, 13.672, 19.141, 25.977, 30.078]

timeline:
  - id: v2_opener      # whole car, elevated front-right 3/4, moving from frame 1 (breakdown), v2 render at 1.25x
    focus: whole car
    src: /home/user/media/work/wrx/renders/final/v2_opener
    src_fps: 18.810
    interpolate: true
    dur: 4.0667
  - transition: {type: cut, note: "4.101 beat 1"}
  - id: s4_scoop       # v1 render: hood scoop, the front's signature detail
    focus: hood scoop
    src: /home/user/media/work/wrx/renders/final/s4_scoop
    src_fps: 19.545
    interpolate: true
    dur: 2.0667
  - transition: {type: cut, note: "6.152 drop"}
  - id: v3_front       # grille out on the drop, lower garnish, bumper shell (flip: scanned inner face); hold on the structure
    focus: front bumper parts / structure behind them
    src: /home/user/media/work/wrx/renders/final/v3_front
    src_fps: 14.934
    interpolate: true
    dur: 7.5
  - transition: {type: cut, note: "13.672 beat 1"}
  - id: v3_side        # front flare / door flare / rear flare / skirt, one per bar; wide of all four
    focus: right-side cladding
    src: /home/user/media/work/wrx/renders/final/v3_side
    src_fps: 14.821
    interpolate: true
    dur: 5.4667
  - transition: {type: cut, note: "19.141 beat 1"}
  - id: v3_rear        # trunk lid opens on its fitted hinge to the scanned open pose; rear bumper off; hold on structure
    focus: trunk / rear bumper / structure behind it
    src: /home/user/media/work/wrx/renders/final/v3_rear
    src_fps: 14.928
    interpolate: true
    dur: 6.8333
  - transition: {type: cut, note: "25.977 beat 1"}
  - id: v3_reassemble  # lid closes, rear bumper, side, shell, garnish, grille locks on 28.711; clean car after; fade
    focus: whole car (reassembly)
    src: /home/user/media/work/wrx/renders/final/v3_reassemble
    src_fps: 14.882
    interpolate: true
    dur: 4.1
    vf: "fade=t=out:st=3.35:d=0.75"
  - transition: {type: cut, note: "30.078 beat 1 - small logo through the music fade"}
  - id: logo           # projects/ferrari-296/tools/logo_card.py --secs 3.3 --width 380 --fade-out 0.8
    focus: logo
    src: /home/user/media/work/wrx/out/logo_small.mp4
    dur: 3.3333

overlays:
  - src: /home/user/media/work/wrx/out/hud_wrx_v3.mov   # ive hud projects/subaru-wrx-vb/overlay.json
    start: 0
