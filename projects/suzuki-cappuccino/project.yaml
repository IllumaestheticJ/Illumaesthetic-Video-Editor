# Suzuki Cappuccino scan reel - Temerario style (scan only, no IRL, no text). Shots: shots.py -> tools/shot.py (Blender).
# Durations are whole frames so each cut lands on round(beat*30); first clip one frame short (FG2 lesson). Grid: cuts.json.
project: suzuki-cappuccino
format: reel-9x16
output: {path: /home/user/media/work/out/suzuki_cappuccino_v1.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/suzuki-cappuccino_track.mp3   # parent session's original track (not committed)
  start: 0
  fade_out: 0.8

# shot starts on even (accented) beats of the 126 BPM grid; 15.272 = the drop; 36.224 = logo
beats: [3.843, 6.700, 9.557, 11.462, 15.272, 19.081, 21.938, 24.796, 28.605, 31.462, 36.224]

timeline:
  - id: s01_side   # low side profile tracking to the nose, fades up from black
    src: /home/user/media/work/renders/cappuccino/s01_side
    src_fps: 15
    interpolate: true
    dur: 3.8000
    vf: fade=t=in:st=0:d=1.0
  - transition: {type: cut}
  - id: s02_front34   # front 3/4 low turntable
    src: /home/user/media/work/renders/cappuccino/s02_front34
    src_fps: 15
    interpolate: true
    dur: 2.8667
  - transition: {type: cut}
  - id: s03_rear34   # rear 3/4 turntable
    src: /home/user/media/work/renders/cappuccino/s03_rear34
    src_fps: 15
    interpolate: true
    dur: 2.8667
  - transition: {type: cut}
  - id: s04_wheel   # extreme close-up: front-right wheel
    src: /home/user/media/work/renders/cappuccino/s04_wheel
    src_fps: 15
    interpolate: true
    dur: 1.9000
  - transition: {type: cut}
  - id: s05_lamp   # extreme close-up: headlamp + bumper lamp; holds through the break
    src: /home/user/media/work/renders/cappuccino/s05_lamp
    src_fps: 15
    interpolate: true
    dur: 3.8000
  - transition: {type: cut}
  - id: s06_frontopen   # ON THE DROP: bumper + lamps slide off, hood swings up on its fitted hinge
    src: /home/user/media/work/renders/cappuccino/s06_frontopen
    src_fps: 15
    interpolate: true
    dur: 3.8000
  - transition: {type: cut}
  - id: s07_trunk   # rear bumper off, trunk lid up on its fitted hinge
    src: /home/user/media/work/renders/cappuccino/s07_trunk
    src_fps: 15
    interpolate: true
    dur: 2.8667
  - transition: {type: cut}
  - id: s08_top   # crane up to top-down, spinning, everything open
    src: /home/user/media/work/renders/cappuccino/s08_top
    src_fps: 15
    interpolate: true
    dur: 2.8667
  - transition: {type: cut}
  - id: s09_explode   # panels lift and stack above the car
    src: /home/user/media/work/renders/cappuccino/s09_explode
    src_fps: 15
    interpolate: true
    dur: 3.8000
  - transition: {type: cut}
  - id: s10_float   # side view, panels floating
    src: /home/user/media/work/renders/cappuccino/s10_float
    src_fps: 15
    interpolate: true
    dur: 2.8667
  - transition: {type: cut}
  - id: s11_reassemble   # panels return, rear 3/4 hero, fades to black
    src: /home/user/media/work/renders/cappuccino/s11_reassemble
    src_fps: 15
    interpolate: true
    dur: 4.7667
    vf: fade=t=out:st=4.267:d=0.5
  - transition: {type: cut}
  - id: logo   # ILLUMAESTHETIC logo card (website logo) on black, fades with the music's tail
    src: /home/user/media/work/cappuccino/logo_card.mp4
    dur: 2.6667

overlays: []   # no text in this format (Temerario ref has none)
