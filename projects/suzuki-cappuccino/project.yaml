# Suzuki Cappuccino scan reel v2 (v1 recipe: project_v1.yaml). Plan: direction.md + director.md; shots: shots.py.
# Cuts on the broadband kick-onset frames (onsets.json): 116 402 573 630 887 973 1087. First clip = cut frame; later clips = gap+1
# frame because each 1-frame fade transition overlaps the previous clip by one frame (avoids ive's cloned duplicate before 'cut').
project: suzuki-cappuccino
format: reel-9x16
output: {path: /home/user/media/work/out/suzuki_cappuccino_v2.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/suzuki-cappuccino_track.mp3   # parent session's original track (not committed)
  start: 0
  fade_out: 0.8

timeline:
  - id: s1_whole   # whole car, front-right 3/4, already moving at frame 1 (v2 brief 4)
    section: whole
    focus: whole car silhouette
    src: /home/user/media/work/renders/cappuccino_v2/s1_whole
    src_fps: 15
    interpolate: true
    dur: 3.8667
  - transition: {type: fade, duration: 0.0333}   # = hard cut on the onset frame
  - id: s2_frontbumper   # FRONT section: lamps out -> bumper tips to show inner face/mounting tabs -> hold on structure behind (Front Bumper Off scan)
    section: front
    focus: bumper inner face + structure behind
    src: /home/user/media/work/renders/cappuccino_v2/s2_frontbumper
    src_fps: 15
    interpolate: true
    dur: 9.5667
  - transition: {type: fade, duration: 0.0333}   # = hard cut on the onset frame
  - id: s3_engine   # FRONT section cont.: hood swings on the drop (beat 32) using the captured Hood Open state, push into the bay
    section: front
    focus: engine bay under the opened hood
    src: /home/user/media/work/renders/cappuccino_v2/s3_engine
    src_fps: 15
    interpolate: true
    dur: 5.7333
  - transition: {type: fade, duration: 0.0333}   # = hard cut on the onset frame
  - id: s4_wheel   # SIDE: front-right wheel close-up, reused v1 render (not repeated elsewhere)
    section: side
    focus: front-right wheel
    src: /home/user/media/work/renders/cappuccino/s04_wheel
    src_fps: 15
    interpolate: true
    dur: 1.9333
  - transition: {type: fade, duration: 0.0333}   # = hard cut on the onset frame
  - id: s5_rear   # REAR section: bumper tips (inner face) -> hold on Rear End All Removed structure -> trunk lid to captured Trunk Open angle
    section: rear
    focus: rear end structure, exhaust, trunk
    src: /home/user/media/work/renders/cappuccino_v2/s5_rear
    src_fps: 15
    interpolate: true
    dur: 8.6000
  - transition: {type: fade, duration: 0.0333}   # = hard cut on the onset frame
  - id: x1_layers   # FINALE a: progressive explode into layers, rear first then front
    section: finale
    focus: parts separating into layers
    src: /home/user/media/work/renders/cappuccino_v2/x1_layers
    src_fps: 15
    interpolate: true
    dur: 2.9000
  - transition: {type: fade, duration: 0.0333}   # = hard cut on the onset frame
  - id: x2_reassemble   # FINALE b: reassembly, clean car swaps in on beat 74, fade out
    section: finale
    focus: parts returning, clean car
    src: /home/user/media/work/renders/cappuccino_v2/x2_reassemble
    src_fps: 15
    interpolate: true
    dur: 3.8333
    vf: fade=t=out:st=3.30:d=0.5
  - transition: {type: fade, duration: 0.0333}
  - id: logo   # small ILLUMAESTHETIC logo (width 380) on black, fades with the music tail
    src: /home/user/media/work/cappuccino/logo_card_v2.mp4
    dur: 2.6667

overlays:   # factual section labels over scan shots only (addendum C); no numbers
  - {src: /home/user/media/work/cappuccino/hud_v2.mov, start: 0}
