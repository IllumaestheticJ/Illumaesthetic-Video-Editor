# Toyota GR86 / Subaru BRZ (gen 2) - Temerario-style scan reel (scan only: no IRL footage; factual state/part-scan labels).
# Hero scan: "BRZ Full Car" (all Bomex state/part scans are registered to it; see clips.md). House satin silver on black.
# v3 (user notes on v2 -> direction.md v3): trimmed hood (windshield intact), TRUNK OPEN lid lift-off, SIDE MIRROR REMOVED,
# rear lights (reverse light + plate lamp) exploded out of the rear bumper, rear->front reassembly, larger logo.
# Shots: a_open/s3 (tools/shots_v2.py, shots.py; reused), c/d/e/f/h (tools/shots_v3.py) rendered by tools/shot.py.
# Music: toyota-gr86_track.mp3 - original lo-fi drift funk generated for this reel by the parent session (ElevenLabs via
# Higgsfield); audible to 39.24 s. Cuts on MEASURED kick half-rises (decoded audio, v2 check; the accents.py grid is ~30 ms late):
# 4.931, 7.380, 14.73, 17.174, 26.97, 31.873, 36.766 -> frames 148, 221, 442, 515, 809, 956, 1103; end 1177.
# Clip durs are whole frames; first clip one frame short (assembler adds the cut hold frame).
project: toyota-gr86
format: reel-9x16
output: {path: /home/user/media/work/gr86/out/toyota_gr86_v3.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/toyota-gr86_track.mp3   # not in git
  start: 0
  fade_out: 0.3

beats: [4.931, 7.380, 14.73, 17.174, 26.97, 31.873, 36.766]

timeline:
  - id: a_open
    src: /home/user/media/work/gr86/shots/a_open
    section: whole
    focus: "whole car, front-right 3/4, ~20 deg arc + push from frame 1"
    src_fps: 15
    interpolate: true
    dur: 4.9
  - transition: {type: cut, note: "4.931 kick"}
  - id: b_headlight
    src: /home/user/media/work/gr86/shots/s3_wheel
    section: front
    focus: "right headlight + slat grille + intake detail (2 mm crop)"
    src_fps: 15
    interpolate: true
    dur: 2.4333
    trim_start: 2.4
  - transition: {type: cut, note: "7.380 kick"}
  - id: c_front
    src: /home/user/media/work/gr86/shots/c_front
    section: front
    focus: "hood_t lifts off (lands 9.83) -> engine bay (Hood Open) -> front bumper off + tipped (12.28) -> FRONT BUMPER REMOVED structure"
    src_fps: 15
    interpolate: true
    dur: 7.3667
  - transition: {type: cut, note: "14.73 phrase kick"}
  - id: d_mirror
    src: /home/user/media/work/gr86/shots/d_mirror
    section: side
    focus: "right mirror flies off -> SIDE MIRROR REMOVED mount (Side Mirrors Removed scan)"
    src_fps: 15
    interpolate: true
    dur: 2.4333
  - transition: {type: cut, note: "17.174 kick"}
  - id: e_rear
    src: /home/user/media/work/gr86/shots/e_rear
    section: rear
    focus: "lid lifts off (19.62) -> TRUNK OPEN cargo (Trunk Open scan) -> rear bumper off + tipped (24.52) -> REAR BUMPER REMOVED crash beam"
    src_fps: 15
    interpolate: true
    dur: 9.8
  - transition: {type: cut, note: "26.97 kick"}
  - id: f_lights
    src: /home/user/media/work/gr86/shots/f_lights
    section: rear
    focus: "REVERSE LIGHT leaves the tipped bumper inner face, then the LICENSE PLATE LIGHT (lands 29.42)"
    src_fps: 15
    interpolate: true
    dur: 4.9
  - transition: {type: cut, note: "31.873 kick"}
  - id: h_reassemble
    src: /home/user/media/work/gr86/shots/h_reassemble
    section: whole
    focus: "every part flies home rear -> front, hood last on the 34.32 return; complete car fades"
    src_fps: 15
    interpolate: true
    dur: 4.9
    vf: "fade=t=out:st=2.9:d=1.95:color=0x070709"
  - transition: {type: cut, note: "36.766 kick"}
  - id: logo
    src: /home/user/media/work/gr86/out/logo_card_v3.mp4
    section: end
    focus: "ILLUMAESTHETIC logo, larger (user note)"
    dur: 2.5

overlays:
  - src: /home/user/media/work/gr86/out/hud_gr86_v3.mov   # python -m ive hud projects/toyota-gr86/overlay.json
    start: 0
