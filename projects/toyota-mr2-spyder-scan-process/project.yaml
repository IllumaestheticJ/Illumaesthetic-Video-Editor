# Toyota MR2 Spyder (ZZW30, hardtop project) - scan-process reel v3: built around the printed hardtop and the scans made
# at this shoot (user feedback on v2: "a mess; more scanning footage, more of the car, the other scans"). 1080x1920, 30 fps.
# Plan: direction.md + director.md (v3). Music: original MR2 track (112.1 BPM), grid t = 0.5145 + 0.53535 n (track s).
# Track starts at n21 so the drop (n29) = cut into sP. Clip lengths are exact frames (tools: honda-s2000 concat_assemble, cuts only);
# the one dissolve (scan -> listing, never IRL -> scan) is pre-composed into the tail clip by tools/tail_v3.sh.
project: toyota-mr2-spyder-scan-process
format: reel-9x16
output: {path: /home/user/media/work/out/mr2_scan_process_v3.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/mr2/music/mr2_track.mp3   # https://d8j0ntlcm91z4.cloudfront.net/... (original MR2 track, not in git)
  start: 11.757
  fade_out: 0.8

timeline:
  - id: irl_wide     # section: hardtop piece | DJI_0030 28.5 s: crew carry the scanner to the car, whole car in frame
    src: /home/user/media/work/mr2/irl/irlW_0030_28.5.mp4
    frames: 32
  - id: irl_screen   # section: hardtop piece | DJI_0030 44.5 s: live scan on the scanner screen, swings onto the printed piece
    src: /home/user/media/work/mr2/irl/irlS_0030_44.5.mp4
    frames: 32
  - id: irl_rear     # section: hardtop piece | DJI_0030 frames 1293-1343: scanner on the piece, pull back to full rear; ends ON the solved frame
    src: /home/user/media/work/mr2/irl/irlB_0030_1293-1343.mp4
    frames: 64
  - transition: {type: cut, note: "1:1 IRL -> scan on the drop (camB): Top Down + registered 'hardtop revision 1' piece"}
  - id: scan_piece   # section: hardtop piece | sP: 1:1 on camB, crane up and in onto the printed piece seated on hoop + deck
    src: /home/user/media/work/mr2/renders3/sP
    src_fps: 15.227   # (68-1)/(4.3+0.1)
    interpolate: true
    frames: 129
  - id: irl_over     # section: hardtop piece | DJI_0030 47.5 s: scanner sweeping over the piece (same subject, real)
    src: /home/user/media/work/mr2/irl/irlO_0030_47.5.mp4
    frames: 64
  - id: irl_lift     # section: hardtop piece | FX30636 20.9 s (LUT, 3:4 on blurred fill): two crew lift the piece off
    src: /home/user/media/work/mr2/irl/irlH_FX30636_20.9_wide.mp4
    frames: 64
  - transition: {type: cut, note: "real lift continues in the scan: piece translates up off the Top Down scan (the hardtop-off state)"}
  - id: scan_off     # section: hardtop piece | sL: piece rises clear (translate only), hoop + deck it sat on
    src: /home/user/media/work/mr2/renders3/sL
    src_fps: 15.441   # (36-1)/(2.1667+0.1)
    interpolate: true
    frames: 65
  - id: irl_down     # section: hardtop piece | FX30636 27.5 s: piece set on the floor, printed underside
    src: /home/user/media/work/mr2/irl/irlD_FX30636_27.5.mp4
    frames: 64
  - id: scan_on_web  # section: whole car + end | sH: Full Car hardtop lands, orbit to the listing pose, grey morph, dissolve (frames 129-144 of the clip) into the listing WebZoom
    src: /home/user/media/work/mr2/renders3/tail_v3.mp4
    frames: 224

overlays:
  - src: /home/user/media/work/out/hud_mr2_v3.mov
    start: 0
