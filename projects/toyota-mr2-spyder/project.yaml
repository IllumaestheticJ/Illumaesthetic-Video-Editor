# Toyota MR2 Spyder scan reel v3 (delivered as v2 to the user) - Temerario style, scan only. v1: project_v1.yaml
# Plan: direction.md (scene order from the scan inventory, nose -> roof -> tail, one sequence per section) + director.md.
# Assembly: projects/honda-s2000/tools/concat_assemble.py (whole-frame `frames:`, plain concat, no cloned cut frame),
# then the label HUD (overlay.json -> ive hud) is composited on top (labels only over scan shots; there is no IRL).
# src_fps = 30*N/(slot+4): minterpolate gives 2N-3 frames, so every slot is filled without clone padding.
project: toyota-mr2-spyder
format: reel-9x16
output: {path: /home/user/media/work/mr2/out/mr2_spyder_v2_nolabels.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/toyota-mr2-spyder_track.mp3   # parent-session generated track (not in git)
  start: 3.155   # first kick accent (bar n=6); removing the repeated shots leaves 30.5 s of unique content
  fade_out: 1.2

# cut times in REEL seconds (music t - 3.155): strong hits 7.441 -> 4.286, 24.583 -> 21.428 (lid opens), final hit 33.690 -> 30.535 (logo)
beats: [4.286, 6.428, 12.857, 19.285, 25.714, 30.535]

timeline:
  - id: s1_wide   # WHOLE CAR: side profile, slow drift toward the nose, fades up (reused v2 render, slowed)
    src: /home/user/media/work/renders/mr2/s1_wide
    src_fps: 12.1805
    interpolate: true
    frames: 129
    dur: 4.3000
    vf: fade=t=in:st=0:d=1.0
  - transition: {type: cut}
  - id: s4_wheel   # WHEELS: front wheel + arch extreme close-up; cut ON the 7.441 strong hit
    src: /home/user/media/work/renders/mr2/s4_wheel
    src_fps: 15.8824
    interpolate: true
    frames: 64
    dur: 2.1333
  - transition: {type: cut}
  - id: s12_front   # FRONT HERO: bumper slides out into black, camera moves in on what's behind it, hood swings up on its fitted hinge (Hood Duct Data state)
    src: /home/user/media/work/renders/mr2/s12_front
    src_fps: 15.2284
    interpolate: true
    frames: 193
    dur: 6.4333
  - transition: {type: cut}
  - id: s13_top   # SIDE + TOP: hardtop lifts straight out of frame, crane into the roof-down cabin (Full Car Top Down)
    src: /home/user/media/work/renders/mr2/s13_top
    src_fps: 15.2284
    interpolate: true
    frames: 193
    dur: 6.4333
  - transition: {type: cut}
  - id: s14_rear   # REAR: tail, rear lid opens ON the 24.583 strong hit, crane over the engine bay (Rear End trunk open)
    src: /home/user/media/work/renders/mr2/s14_rear_z
    src_fps: 15.3061
    interpolate: true
    frames: 192
    dur: 6.4000
  - transition: {type: cut}
  - id: s15_reassemble   # REASSEMBLY: wide rear-right 3/4, panels return, clean full car takes over, fades to black
    src: /home/user/media/work/renders/mr2/s15_reassemble
    src_fps: 15.3020
    interpolate: true
    frames: 145
    dur: 4.8333
    vf: fade=t=out:st=4.38:d=0.45
  - transition: {type: cut}
  - id: logo   # small ILLUMAESTHETIC logo (380 px, ~35 % width) fades in on black on the final hit
    src: /home/user/media/work/mr2/out/logo_card_v2.mp4
    frames: 93
    dur: 3.1000

overlays:   # composited after concat (tools/label_pass.sh); labels from overlay.json, see director.md label table
  - src: /home/user/media/work/mr2/out/hud_v3.mov
    start: 0
