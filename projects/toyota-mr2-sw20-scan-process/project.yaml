# Toyota MR2 SW20 scan-process reel v1 ("240SX style").
# Music starts at the 5.428 s kick (2 accents before the drop); drop = 3.215 s video. Kick grid 111.99 BPM (0.53575 s),
# accents (strong kicks) on every other beat from the drop: 3.215 + 1.0715 k. Every cut sits on round(accent * 30).
# Cut frames: 96 193 225 257 321 418 450 579 707 | end 879 (music ends ~34.7 s audio = 29.3 s video).
project: toyota-mr2-sw20-scan-process
format: reel-9x16
output: {path: /home/user/media/work/out/mr2_sw20_scan_v1.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/toyota-mr2-sw20-scan-process_track.mp3
  start: 5.428
  fade_out: 0.9

beats: [3.215, 4.286, 5.358, 6.429, 7.501, 8.572, 9.644, 10.715, 11.787, 12.858, 13.930, 15.001, 16.073, 17.144,
        18.216, 19.287, 20.359, 21.430, 22.502, 23.573, 24.645, 25.716, 26.788, 27.859, 28.931]

timeline:
  - id: irl_rear   # crew scanning the open trunk; ends on the solved frame 4.400 s; cut ON THE DROP
    dur: 3.2
    src: /home/user/media/mr2/dropbox/v_1602_50.mov
    in: 1.2334
    out: 4.4334
  - transition: {type: cut, note: "1:1 IRL -> Interior scan (cam_rear) on the drop"}
  - id: scan_rear   # Interior state (trunk open), eases from cam_rear back to a rear-left 3/4
    dur: 3.2333
    src: /home/user/media/work/mr2/renders/final/s1_rear
    src_fps: 15
    interpolate: true
  - id: irl_screen   # scanner screen shows the live scan
    dur: 1.0667
    src: /home/user/media/mr2/dropbox/v_1500_26.mov
    in: 1.0
    out: 2.0667
  - id: irl_door   # passenger door inner panel being scanned (door still on)
    dur: 1.0667
    src: /home/user/media/mr2/dropbox/v_1447_56.mov
    in: 2.9
    out: 3.9667
  - id: irl_side   # crew leaning into the empty door opening; ends on solved frame 2.300 s
    dur: 2.1333
    src: /home/user/media/mr2/dropbox/v_1433_07.mov
    in: 0.2
    out: 2.3334
  - transition: {type: cut, note: "1:1 IRL -> 'T-Top Off + T-tops' composite (cam_side)"}
  - id: scan_side   # T-tops lift off -> T-Top Off state
    dur: 3.2333
    src: /home/user/media/work/mr2/renders/final/s2_side
    src_fps: 15
    interpolate: true
  - id: screen_rec   # Artec Studio, textured SW20 scan (2026-07-29 screen recording, viewport crop, 2x)
    dur: 1.0667
    src: /home/user/media/work/mr2/screen_crop.mp4
  - id: scan_parts   # doors + T-tops explode out and spin left/right (doors turn their scanned inner panels to camera)
    dur: 4.3
    src: /home/user/media/work/mr2/renders/final/s3_parts
    src_fps: 15
    interpolate: true
  - id: scan_xray   # x-ray reassembly: parts translate home, camera continues the orbit
    dur: 4.7667     # 128 frames + 0.5 s dissolve overlap
    src: /home/user/media/work/mr2/renders/final/s4_xray
    src_fps: 15
    interpolate: true
  - transition: {type: dissolve, duration: 0.5, note: "x-ray -> SW20 scan listing (scan -> web, not IRL -> scan)"}
  - id: website
    dur: 5.7333
    src: /home/user/media/work/out/webzoom_mr2_v1.mp4

overlays:
  - src: /home/user/media/work/out/hud_mr2_v1.mov
    start: 0
