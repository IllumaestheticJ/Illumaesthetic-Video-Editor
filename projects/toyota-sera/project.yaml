# Toyota Sera - Temerario-style scan reel, v3 (user's v2 brief for all reels, relayed by the parent session).
# Scan only, no text. Order from this car's scan data, travelling front -> side -> rear (projects/toyota-sera/direction.md,
# director.md): whole car -> front wheel -> FRONT (hood opens, front bumper off + inner face over the crash structure)
# -> SIDE (both butterfly doors, cabin) -> REAR (rear bumper off + inner face over the rear structure) -> progressive
# explode (front assembly / doors + rear bumper / reassembly, swap to the clean car on the lock) -> fade -> small logo.
# Earlier cut: project_v2.yaml (turntables, rotating top-down, all-at-once explode).
# Music: toyota-sera_track.mp3 (generated for this reel), kick grid 0.0355 + 0.59999 n (100.0 BPM, tools/accents.py);
# 8-beat phrases from 0.036 s; kick break 25.2-27.6 s; music stops 38.435 s -> reel ends 39.30 s.
# Cuts on frames round(t*30): 145, 217, 433, 577, 721, 829, 937, 1009 (lock swap), 1081; end 1179.
# Clip durs are whole frames; first clip one frame short (the assembler adds the cut hold frame).
project: toyota-sera
format: reel-9x16
output: {path: /home/user/media/work/sera/out/toyota_sera_v3.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/toyota-sera_track.mp3   # not in git
  start: 0
  fade_out: 0.3

beats: [4.835, 7.235, 14.435, 19.235, 24.035, 27.635, 31.235, 33.635, 36.035]

timeline:
  - id: v3_s1_whole       # b0-8: whole car, front-right 3/4, pushing in 6.8 -> 5.6 m (car 73-75 % of the width)
    focus: the whole Sera
    src: /home/user/media/work/sera/renders/final/v3_s1_whole
    src_fps: 15
    interpolate: true
    dur: 4.8
  - transition: {type: cut, note: "4.835 phrase downbeat"}
  - id: s3_wheel          # b8-12: front-right tyre, rim, centre badge (v2 render reused, 3 mm scan)
    focus: front-right wheel
    src: /home/user/media/work/sera/renders/final/s3_wheel
    src_fps: 15
    interpolate: true
    dur: 2.4
  - transition: {type: cut, note: "7.235 b12"}
  - id: v3_s3_front       # b12-24 one held shot: hood opens b13-16, front bumper slides out b16-18, tips inner face up b18-21
    focus: front assembly - engine bay, front bumper inner face, crash structure
    src: /home/user/media/work/sera/renders/final/v3_s3_front
    src_fps: 15
    interpolate: true
    dur: 7.2
  - transition: {type: cut, note: "14.435 phrase downbeat"}
  - id: v3_s4_doors       # b24-32: both butterfly doors open b25-29, side-on, pushing toward the cabin
    focus: butterfly doors + cabin
    src: /home/user/media/work/sera/renders/final/v3_s4_doors
    src_fps: 15
    interpolate: true
    dur: 4.8
  - transition: {type: cut, note: "19.235 phrase downbeat"}
  - id: v3_s5_rear        # b32-40: rear bumper slides out b33-35, tips inner face up b35-37, camera rises behind
    focus: rear bumper inner face + rear structure
    src: /home/user/media/work/sera/renders/final/v3_s5_rear
    src_fps: 15
    interpolate: true
    dur: 4.8
  - transition: {type: cut, note: "24.035 phrase downbeat - explode starts"}
  - id: v3_g1_front_lift  # b40-46: hood + front bumper lift above the nose, front-left high (first view of the left side)
    focus: front assembly lifting
    src: /home/user/media/work/sera/renders/final/v3_g1_front_lift
    src_fps: 15
    interpolate: true
    dur: 3.6
  - transition: {type: cut, note: "27.635 b46 (end of the kick break)"}
  - id: v3_g2_side_rear_lift  # b46-52: left door, right door, rear bumper layer above the car, left side
    focus: doors + rear bumper lifting
    src: /home/user/media/work/sera/renders/final/v3_g2_side_rear_lift
    src_fps: 15
    interpolate: true
    dur: 3.6
  - transition: {type: cut, note: "31.235 b52"}
  - id: v3_g3a_home       # b52-56: rear bumper, doors, front assembly fly home, LOCK on b56
    focus: reassembly
    src: /home/user/media/work/sera/renders/final/v3_g3a_home
    src_fps: 15
    interpolate: true
    dur: 2.4
  - transition: {type: cut, note: "33.635 b56 lock - swap to the clean full-car scan, same camera"}
  - id: v3_g3b_clean      # b56-60: clean car, camera easing; fades to black over b58-60 (tools/fade_frames.py)
    focus: the reassembled car
    src: /home/user/media/work/sera/renders/final/v3_g3b_fade
    src_fps: 15
    interpolate: true
    dur: 2.4
  - transition: {type: cut, note: "36.035 b60 - small logo from black"}
  - id: logo              # ferrari-296/tools/logo_card.py --secs 3.2667 --width 480 (44 % width), fades with the decay
    focus: logo
    src: /home/user/media/work/sera/out/logo_card_small.mp4
    dur: 3.2667

overlays: []
