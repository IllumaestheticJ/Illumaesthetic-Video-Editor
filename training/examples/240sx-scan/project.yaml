# 240SX (S13 hatch) scan reel v3. v1/v2 kept as project_v1.yaml / project_v2.yaml.
# v3 feedback: no 4,527 mm caption; bumpers spin left/right (Z); 1:1 cut in the front-bumper scene;
# ending = parts fly back onto the car -> dissolve into the S13 240SX scan listing on illumaesthetic.com
# (same angle as its product render) -> zoom out; "SCAN DATA NOW AVAILABLE" + URL on that page.
project: 240sx-scan
format: reel-9x16
output: {path: /home/user/media/work/out/240sx_scan_v3.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  # Approved Oct 31 edit's track, extended by repeating 8 beats (10.63-15.70 s) at 15.70 s so the
  # new ending fits; splice is on the beat grid (onsets continue 15.70, 16.32, 16.95 ...). 27.80 s.
  path: /home/user/media/work/music_extended.wav
  start: 0
  fade_out: 0.8

beats: [1.82, 6.85, 9.38, 14.42, 16.95, 21.99, 27.80]   # measured onsets (ive beats)

timeline:
  - id: irl_match_rear   # pan to the rear bumper, ends EXACTLY on the solved frame (3.800 s)
    dur: 1.82
    src: /home/user/media/240sx/dropbox/v_1838_02.mov
    in: 2.0134
    out: 3.8334
  - transition: {type: cut, note: "1:1 IRL -> scan (rear), cam_B"}
  - id: scan_rear   # skin drops below, crash beam rises above, both spin left/right
    dur: 5.03
    src: /home/user/media/work/renders/shots_v3/s1_rear
    src_fps: 15
    interpolate: true
  - id: irl_match_front   # crew at the front bumper; ends on the solved frame (3.500 s, bumper still on)
    dur: 2.53
    src: /home/user/media/240sx/dropbox/v_1954_41.mov
    in: 1.0034
    out: 3.5334
  - transition: {type: cut, note: "1:1 IRL -> scan (front), cam_C"}
  - id: scan_front   # bumper comes off and spins left/right, camera pushes in
    dur: 5.04
    src: /home/user/media/work/renders/shots_v3/s2_front
    src_fps: 15
    interpolate: true
  - id: irl_scanner   # handheld scanner screen against the powdered flank
    dur: 2.53
    src: /home/user/media/240sx/dropbox/v_1838_14.mov
    in: 0.60
    out: 3.13
  - id: scan_reassemble   # all parts fly back on; orbit ENDS on the listing image's angle (cam_end2_final)
    dur: 5.04
    src: /home/user/media/work/renders/shots_v3/s3_end
    src_fps: 15
    interpolate: true
  - transition: {type: dissolve, duration: 0.5, note: "scan render -> same-angle listing render (near-1:1 dissolve)"}
  - id: website   # S13 240SX scan listing; starts on its product render, zooms out on the hit (25.18 s); title + URL on this page
    dur: 6.31   # +0.5 s: the dissolve overlaps the previous shot
    src: /home/user/media/work/out/webzoom_240sx.mp4

overlays:
  - src: /home/user/media/work/out/hud_240sx_v3.mov
    start: 0
