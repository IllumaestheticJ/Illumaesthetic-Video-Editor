build: python projects/aesub-spray-gun-reply/tools/shots.py render && python projects/aesub-spray-gun-reply/tools/assemble.py
music: {file: IS350_speedrun_stem_music.wav, start: 223.08, hit: 226.58, hit_at_video: 3.5, bpm: 150}  # hit = cut into the pour
