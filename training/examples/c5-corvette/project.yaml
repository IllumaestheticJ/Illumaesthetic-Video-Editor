# C5 Corvette scan reel v3 - per-section artifact-free bases + doorsill / gas cap / trunk state swaps (direction.md v3).
# Durations are whole frames; first clip one frame short so every cut lands on round(t*30).
project: c5-corvette
format: reel-9x16
output: {path: /home/user/media/work/out/c5_corvette_v3.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/c5-corvette_track.mp3   # generated for this car (parent session)
  start: 0
  fade_out: 1.4

# strong low-band kick onsets (40-150 Hz 8 ms envelope peaks, prominence 0.12)
beats: [4.100, 9.310, 14.769, 18.040, 21.312, 24.585, 28.946, 32.221, 35.496]

timeline:
  - id: v3_open
    section: whole
    focus: "whole clean car, front bumper starts off (front-bumper base cuts in under the bumper only)"
    src: /home/user/media/work/renders/c5/v3_open
    src_fps: 15
    interpolate: true
    dur: 4.0667
    vf: fade=t=in:st=0:d=0.4
  - transition: {type: cut}
  - id: v3_fb
    section: front
    focus: "FRONT BUMPER REMOVED: nose structure + the bumper's scanned inside"
    src: /home/user/media/work/renders/c5/v3_fb
    src_fps: 15
    interpolate: true
    dur: 5.2000
  - transition: {type: cut}
  - id: v3_hood
    section: front
    focus: "hood on its fitted hinge -> scanned underside -> bay (front bumper + hood removed state)"
    src: /home/user/media/work/renders/c5/v3_hood
    src_fps: 15
    interpolate: true
    dur: 5.4667
  - transition: {type: cut}
  - id: v3_sill
    section: side +X
    focus: "LEFT DOORSILL: closed door -> captured door-open state on 15.856"
    src: /home/user/media/work/renders/c5/v3_sill
    src_fps: 15
    interpolate: true
    dur: 3.2
    vf: split[fa][fb];[fa][fb]freezeframes=first=31:last=31:replace=30
    hold_start: 0.0667
  - transition: {type: cut}
  - id: v3_gas
    section: side +X
    focus: "GAS CAP: fuel door closed -> captured open state on 19.135, macro on the cap"
    src: /home/user/media/work/renders/c5/v3_gas
    src_fps: 15
    interpolate: true
    dur: 3.2667
    vf: split[fa][fb];[fa][fb]freezeframes=first=33:last=33:replace=32
  - transition: {type: cut}
  - id: v3_trunk
    section: rear
    focus: "TRUNK OPEN: hatch glass -> captured trunk tub on 22.404"
    src: /home/user/media/work/renders/c5/v3_trunk
    src_fps: 15
    interpolate: true
    dur: 3.3000
    vf: split[fa][fb];[fa][fb]freezeframes=first=33:last=33:replace=32
  - transition: {type: cut}
  - id: v3_rear
    section: rear
    focus: "REAR BUMPER REMOVED: rear structure + the bumper's scanned inside"
    src: /home/user/media/work/renders/c5/v3_rear
    src_fps: 15
    interpolate: true
    dur: 4.3667
  - transition: {type: cut}
  - id: v3_fender
    section: side -X
    focus: "FENDER REMOVED (hood on = captured state): wheelhouse / mounts"
    src: /home/user/media/work/renders/c5/v3_fender
    src_fps: 15
    interpolate: true
    dur: 3.2667
  - transition: {type: cut}
  - id: v3_home
    section: whole
    focus: "parts return; clean car on 34.402; fade"
    src: /home/user/media/work/renders/c5/v3_home
    src_fps: 15
    interpolate: true
    dur: 3.2667
    vf: split[fa][fb];[fa][fb]freezeframes=first=65:last=65:replace=64,fade=t=out:st=2.514:d=0.75
  - transition: {type: cut}
  - id: logo   # small logo on the biggest hit, gone by 38.6
    src: /home/user/media/c5-corvette/logo/logo_small.png
    duration: 4.0000
    dur: 3.9000
    vf: fade=t=in:st=0:d=0.25,fade=t=out:st=2.5:d=0.6

overlays:   # title-only labels from the scan file names, over scan shots only
  - src: /home/user/media/work/out/hud_c5_v3.mov
    start: 0
