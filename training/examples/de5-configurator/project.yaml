# DE5 Acura Integra Type S wing configurator demo (Epsilon+), TikTok 9:16, v3.
# Order (user feedback on v2): website -> GT Wing listing -> configurator / add to cart -> install snippets -> 3D orbit -> 1:1 cut to the real photo, and END on that photo
# (no payoff montage, no end card). v2 timeline is kept in project_v2.yaml.
# Music: 'Time Back' - Sinny & 7vvch (TikTok Commercial Music Library), bed starts at 18.50 s of the track so the drop (35.97 s) lands on the 1:1 cut at frame 524.
project: de5-configurator
format: reel-9x16 (TikTok)
output: {path: /home/user/media/work/de5/out/de5_configurator_v4.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music: {path: /home/user/media/work/de5/layers/music.wav, start: 0, fade_out: 1.2}

# grid: 110.0 BPM (beat 0.54545 s); cut frame = 524 + round((beat-32) * 16.3636); drop = beat 32 = 17.467 s
beats: [2.733, 4.933, 8.733, 9.300, 9.833, 10.367, 10.933, 11.467, 12.000, 12.300, 12.567, 12.833, 13.100, 17.467, 21.833]

