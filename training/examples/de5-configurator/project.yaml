# DE5 Acura Integra Type S wing configurator demo (Epsilon+), TikTok 9:16. Website -> GT Wing listing -> configurator -> add to cart -> 3D orbit -> 1:1 cut to the real
# listing photo -> install snippets -> real-photo payoff -> end card. Brief said 'TC wing'; no real DE5 TC-wing photo exists, the user chose the GT Wing (editlog).
# Screen shots are frame-stepped captures of the LIVE epsilon.plus pages (tools/capWeb.cjs); shot D is the configurator's own three.js view driven to the solved
# camera of the listing photo (match/cam.json, tools/capD.cjs). Music: 'Time Back' - Sinny & 7vvch (TikTok Commercial Music Library, #4 trending US 7-day on
# 2026-11-11), bed starts at 22.87 s of the track so the drop (35.97 s) lands on the 1:1 cut at frame 393.
