  rear_spats:    {price: 175,  handle: epsilon-rear-spats-acura-integra-de4-2023, variant: "Polyurethane / OEM Stock (A)"}   # (105)
  trunk_lip:     {price: 300,  handle: epsilon-rear-trunk-lip-acura-integra-de4-de5-2023, variant: "ABS / Apex Blue Pearl - B621P"}   # (240)
  rear_wing:     {price: 950, handle: epsilon-wing-acura-integra-de-2023, variant: "Sport Wing / Apex Blue Pearl - B621P"}            # (800)
