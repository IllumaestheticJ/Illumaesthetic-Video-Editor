# Honda Civic 11th gen (FE1 Si sedan) - v5: EPSILON kit reel, complete reshoot. Plan: director_v5.md (director agent).
# User on v4: "all the parts are placed on incorrectly/inaccurately, and the cutting/organizaiton is a mess - please have a
# separate agent plan out the shots and then reshoot everything". Parts now from Ron's design scene (tools/kit_parts2.py).
# Three clips, two cuts: S1 open-up (rolled near-top) | L_build (one take round the car's left: lip, skirts, apron, wheels,
# wing -> the camera of Ron's render 7) | Ron's render 7 + Epsilon+ wordmark. Nothing reused from v1-v4 (project_v*.yaml).
# Track: honda-civic-11_track.mp3, audio in at 12.026 s (replacement song not available). Cuts: 17.216 -> frame 156,
# 33.161 -> frame 634; end 36.971 -> 748 frames. Seats: lip 17.851, skirts 19.923, apron 23.227, wheels off 25.100 / on 26.521,
# wing 29.847; wordmark 35.241; fade from 36.471.
project: honda-civic-11
format: reel-9x16
output: {path: /home/user/media/work/civic/out/civic_fe1_epsilon_v5.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/honda-civic-11_track.mp3
  start: 12.026
  fade_out: 0.5

beats: [5.190, 21.135]   # video time of the two cuts' hits (B2b 17.216, B7a 33.161)

timeline:
  - id: S1_open        # whole car from a rolled near-top view: right doors open on the drop, trunk opens, all shut
    focus: whole car opening (doors, trunk)
    src: /home/user/media/work/civic/renders/final5/S1_m
    src_fps: 30
    dur: 5.1667        # 155 (+1: the assembler starts clip k one frame after sum(durs)) -> cut on frame 156
  - transition: {type: cut, note: "B2b 17.216 - on the slam; front lip already in flight"}
  - id: L_build        # ONE take: lip (front) -> skirt (left side) -> apron (rear) -> wheel swap (rear-left wide, then the wheel) -> wing -> render-7 pose
    focus: Epsilon kit going on, part by part
    src: /home/user/media/work/civic/renders/final5/L_m
    src_fps: 30
    dur: 15.9333       # 478 -> cut on frame 634
  - transition: {type: cut, note: "B7a 33.161 - 1:1 cut scan+kit -> Ron's render 7"}
  - id: R_ron7         # Ron's Final-Sedan-FL render 7, same push; Epsilon+ wordmark from 35.241; fade from 36.471
    focus: finished car (Ron's render)
    src: /home/user/media/work/civic/renders/final5/R_ron7
    src_fps: 30
    dur: 3.8           # 114
    hold_end: 0.0334

overlays: []
