# Huracan EVO v6 - v5 30 s cut with one EVO speech in the consented custom voice (v5: project_v5.yaml). User on v4: cut to 30 s, scan data sooner, reference engine start, no jet
# sound, lower voice. Coupe: select + wheel + side (lift at 10.28 s, was 27.08); Spyder sections at 1.3-2x speed.
project: huracan-evo
format: reel-9x16
output: {path: /home/user/media/work/out/huracan_evo_v6.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/huracan-evo/vo/soundtrack_v6.wav   # not committed (tools/music_v5.py + tools/mix.py --v6)
  start: 0
  fade_out: 0.6

# beats t = 3.0768 + 0.60006*n; dips n=3,7; lift n=12; sections n=16,22,26,30,34; music stop n=40 (27.079 s)
beats: [4.877, 7.277, 10.278, 12.678, 16.278, 18.678, 21.079, 23.479, 27.079]

timeline:
  - id: h0_select   # SELECT: reference engine start-up (hp_1138 1.7-6.6 s) as the lights come up
    section: whole
    focus: "whole coupe, front-left 3/4, lights come up on the reference start-up"
    src: /home/user/media/work/renders/huracan/h0_select
    src_fps: 14.6000
    interpolate: true
    dur: 4.8667
    vf: fade=t=in:st=0:d=0.3
  - transition: {type: dip, duration: 0.6}
  - id: h4_wheel   # COUPE WHEEL n3-7, 1.5x, centred
    section: wheel
    focus: "front wheel: scanned rim spokes and tyre"
    src: /home/user/media/work/renders/huracan/h4_wheel
    src_fps: 22.5000
    trim_start: 1.50
    interpolate: true
    dur: 3.0000
  - transition: {type: dip, duration: 0.6}
  - id: h5_side   # COUPE SIDE n7-12, 1.5x
    section: side
    focus: "coupe profile slide, front to rear"
    src: /home/user/media/work/renders/huracan/h5_side
    src_fps: 22.5000
    trim_start: 1.20
    interpolate: true
    dur: 3.6000
  - transition: {type: cut}
  - id: s5_frontopen   # LIFT n12 = 10.28 s: SPYDER front opens (2x)
    section: front-open
    focus: "Spyder front opens: bumper off, fender out, hood to its captured open pose"
    src: /home/user/media/work/renders/huracan/s5_frontopen
    src_fps: 28.7996
    interpolate: true
    dur: 2.3667
  - transition: {type: cut}
  - id: sp_bumper   # n16-22: bumper inner face + hero hold (label)
    section: front-open
    focus: "FRONT BUMPER REMOVED: bumper inner face, then the structure behind it"
    src: /home/user/media/work/renders/huracan/sp_bumper
    src_fps: 19.2857
    interpolate: true
    dur: 3.6000
  - transition: {type: cut}
  - id: sp_hood   # n22-26
    section: hood
    focus: "hood lifts clear, cowls lift off: frunk structure"
    src: /home/user/media/work/renders/huracan/sp_hood
    src_fps: 21.3158
    interpolate: true
    dur: 2.4000
  - transition: {type: cut}
  - id: sp_side   # n26-30
    section: side-open
    focus: "fender and side skirt off, inner faces to the lens"
    src: /home/user/media/work/renders/huracan/sp_side
    src_fps: 21.3158
    interpolate: true
    dur: 2.4000
  - transition: {type: cut}
  - id: sp_rear   # n30-34 (label)
    section: rear-open
    focus: "REAR BUMPER REMOVED: bumper inner face, then the structure behind it"
    src: /home/user/media/work/renders/huracan/sp_rear
    src_fps: 21.3158
    interpolate: true
    dur: 2.4000
  - transition: {type: cut}
  - id: sp_finale   # n34-40: explode -> reassemble -> fade
    section: whole
    focus: "full explode top-down, reassembly, whole Spyder rear 3/4"
    src: /home/user/media/work/renders/huracan/sp_finale
    src_fps: 24.1071
    interpolate: true
    dur: 3.6000
    vf: fade=t=out:st=2.700:d=0.9
  - transition: {type: cut}
  - id: logo   # small ILLUMAESTHETIC logo (380 px) on black when the music stops (27.08 s) -> 30.0 s
    src: /home/user/media/huracan-evo/logo/end_card_small.png
    duration: 3.0
    dur: 2.9333
    vf: fade=t=in:st=0:d=0.5

overlays:   # labels only over the bumper-removed holds (exact counts from the STL headers)
  - src: /home/user/media/work/out/hud_huracan_v5.mov
    start: 0
