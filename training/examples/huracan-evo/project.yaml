# Huracan EVO v10 (v9: project_v9.yaml; v10 = ~40 s, slower scan pacing, 7 step labels, plate hole filled). v9 notes: ( v9 = deeper narration, faster scan pacing, Spyder scans back in via a 1:1 stealth cut). v8 notes: ( v8 = re-flowed one-take narration, rear bumper rebuilt from the B-side scan, labels without counts). v7 notes: - user on v6: bigger logo; full coupe rear-end disassembly + wheel wells + exhaust; narration conclusion. User on v4: cut to 30 s, scan data sooner, reference engine start, no jet
# sound, lower voice. Coupe: select + wheel + side (lift at 10.28 s, was 27.08); Spyder sections at 1.3-2x speed.
project: huracan-evo
format: reel-9x16
output: {path: /home/user/media/work/out/huracan_evo_v10.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/huracan-evo/vo/soundtrack_v10.wav   # not committed (tools/music_v10.py + tools/mix.py --v10)
  start: 0
  fade_out: 0.6

# beats t = 3.0768 + 0.60006*n; dips n=3,7,10; drop n=12; scan cuts n=17,21,25,29,34,38,43,47,51; music stop n=56 (36.68 s)
beats: [4.877, 7.277, 9.077, 10.278, 13.278, 15.678, 18.078, 20.479, 23.479, 25.879, 28.879, 31.28, 33.68, 36.68]

timeline:
  - id: h0_select   # SELECT: reference engine start-up as the lights come up
    section: whole
    focus: "whole coupe, front-left 3/4, lights come up on the start-up"
    src: /home/user/media/work/renders/huracan/h0_select
    src_fps: 14.6000
    interpolate: true
    dur: 4.8667
    vf: fade=t=in:st=0:d=0.3
  - transition: {type: dip, duration: 0.6}
  - id: h4_wheel   # n3-7
    section: wheel
    focus: "front wheel: scanned rim spokes and tyre"
    src: /home/user/media/work/renders/huracan/h4_wheel
    src_fps: 22.5000
    trim_start: 1.50
    interpolate: true
    dur: 3.0000
  - transition: {type: dip, duration: 0.6}
  - id: h5_side   # n7-10
    section: side
    focus: "coupe profile slide"
    src: /home/user/media/work/renders/huracan/h5_side
    src_fps: 30.0000
    trim_start: 0.90
    dur: 2.4000
  - transition: {type: dip, duration: 0.5}
  - id: hx_match   # n10-12: closed COUPE, no floor, camera lands on s5's first key (shifted 29 px down to register with the Spyder)
    section: whole
    focus: "whole coupe front-right 3/4, push toward the nose"
    src: /home/user/media/work/renders/huracan/hx_match
    src_fps: 9.8182
    interpolate: true
    dur: 1.7000
    vf: crop=iw:ih-29:0:0,pad=iw:ih+29:0:29:black
  - transition: {type: cut}
  - id: s5_frontopen   # n12-17: frames 1-72 at 1.6x
    section: front-open
    focus: "1:1 cut on the drop: same camera, now the Spyder - bumper, fender, hood open"
    src: /home/user/media/work/renders/huracan/s5_frontopen
    src_fps: 23.2256
    interpolate: true
    dur: 2.9667
  - transition: {type: cut}
  - id: sp_bumper   # n17-21: frames 6-60 at 1.5x
    section: front-open
    focus: "FRONT BUMPER: tips its inner face, hold on the structure behind (label)"
    src: /home/user/media/work/renders/huracan/sp_bumper
    src_fps: 21.7105
    trim_start: 0.2303
    interpolate: true
    dur: 2.4000
  - transition: {type: cut}
  - id: sp_hood   # n21-25: frames 1-54 at 1.5x
    section: hood
    focus: "HOOD + COWLS lift off (label)"
    src: /home/user/media/work/renders/huracan/sp_hood
    src_fps: 21.3158
    interpolate: true
    dur: 2.4000
  - transition: {type: cut}
  - id: sp_side   # n25-29: frames 1-54 at 1.5x
    section: side-open
    focus: "FENDER + SIDE SKIRT off (label)"
    src: /home/user/media/work/renders/huracan/sp_side
    src_fps: 21.3158
    interpolate: true
    dur: 2.4000
  - transition: {type: cut}
  - id: c1_bumper   # n29-34: frames 1-45 at 1.0x
    section: rear-open
    focus: "REAR BUMPER off, hold on the structure (label)"
    src: /home/user/media/work/renders/huracan/c1_bumper
    src_fps: 14.3617
    interpolate: true
    dur: 3.0000
  - transition: {type: cut}
  - id: c2_deck   # n34-38: frames 1-36 at 1.0x
    section: rear-open
    focus: "DECKLID + GRILLE (and beam) lift off (label)"
    src: /home/user/media/work/renders/huracan/c2_deck
    src_fps: 14.2105
    interpolate: true
    dur: 2.4000
  - transition: {type: cut}
  - id: c3_exhaust   # n38-43: frames 1-45 at 1.0x
    section: exhaust
    focus: "EVO EXHAUST drops out (label)"
    src: /home/user/media/work/renders/huracan/c3_exhaust
    src_fps: 14.3617
    interpolate: true
    dur: 3.0000
  - transition: {type: cut}
  - id: c4_wells   # n43-47: frames 1-36 at 1.0x
    section: wheel
    focus: "REAR WHEEL WELL, no liner (label)"
    src: /home/user/media/work/renders/huracan/c4_wells
    src_fps: 14.2105
    interpolate: true
    dur: 2.4000
  - transition: {type: cut}
  - id: sp_finale   # n47-51: frames 1-40 at 1.1x
    section: whole
    focus: "Spyder fully exploded, top-down"
    src: /home/user/media/work/renders/huracan/sp_finale
    src_fps: 15.7895
    interpolate: true
    dur: 2.4000
  - transition: {type: cut}
  - id: c5_finale   # n51-56: frames 1-45 at 1.0x
    section: whole
    focus: "rear reassembles -> whole coupe pull-back"
    src: /home/user/media/work/renders/huracan/c5_finale
    src_fps: 14.3617
    interpolate: true
    dur: 3.0000
    vf: fade=t=out:st=2.400:d=0.6
  - transition: {type: cut}
  - id: logo   # ILLUMAESTHETIC logo 720 px on the music stop 36.68 s -> 39.7 s
    src: /home/user/media/huracan-evo/logo/end_card_720.png
    duration: 3.1
    dur: 3.0000
    vf: fade=t=in:st=0:d=0.5

overlays:   # one title-only label per teardown step (user: label more of the disassembly; no triangle counts)
  - src: /home/user/media/work/out/hud_huracan_v10.mov
    start: 0
