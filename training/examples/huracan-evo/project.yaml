# Huracan EVO v13 (v12: project_v12.yaml; v13 = whole video re-paced evenly: every shot 0.8-1.2x, every teardown step 5 beats, ~47 s). v12 notes: ( v12 = same picture, narration keeps "Huracan" and ends on EVO-vs-previous-generation facts). v11 notes: ( v11 = same picture, narration names the car LP640-4 EVO). v10 notes: ( v10 = ~40 s, slower scan pacing, 7 step labels, plate hole filled). v9 notes: ( v9 = deeper narration, faster scan pacing, Spyder scans back in via a 1:1 stealth cut). v8 notes: ( v8 = re-flowed one-take narration, rear bumper rebuilt from the B-side scan, labels without counts). v7 notes: - user on v6: bigger logo; full coupe rear-end disassembly + wheel wells + exhaust; narration conclusion. User on v4: cut to 30 s, scan data sooner, reference engine start, no jet
# sound, lower voice. Coupe: select + wheel + side (lift at 10.28 s, was 27.08); Spyder sections at 1.3-2x speed.
project: huracan-evo
format: reel-9x16
output: {path: /home/user/media/work/out/huracan_evo_v13.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/huracan-evo/vo/soundtrack_v13.wav   # not committed (tools/music_v13.py + tools/mix.py --v13)
  start: 0
  fade_out: 0.6

# beats t = 3.0768 + 0.60006*n; dips n=3,8,13; drop n=17; scan cuts n=24,29,34,39,44,49,54,59,63; music stop n=68 (43.88 s)
beats: [4.877, 7.877, 10.878, 13.278, 17.478, 20.479, 23.479, 26.479, 29.479, 32.48, 35.48, 38.48, 40.881, 43.881]

timeline:
  - id: h0_select   # SELECT: reference engine start-up as the lights come up
    section: whole
    focus: "whole coupe, front-left 3/4, lights come up on the start-up"
    src: /home/user/media/work/renders/huracan/h0_select
    src_fps: 14.6000
    interpolate: true
    dur: 4.8667
    vf: fade=t=in:st=0:d=0.3
  - transition: {type: dip, duration: 0.6}
  - id: h4_wheel   # n3-8, 1.0x
    section: wheel
    focus: "front wheel: scanned rim spokes and tyre"
    src: /home/user/media/work/renders/huracan/h4_wheel
    src_fps: 14.4643
    trim_start: 2.7654
    interpolate: true
    dur: 3.6000
  - transition: {type: dip, duration: 0.6}
  - id: h5_side   # n8-13, 1.2x
    section: side
    focus: "coupe profile slide"
    src: /home/user/media/work/renders/huracan/h5_side
    src_fps: 17.4107
    trim_start: 1.6656
    interpolate: true
    dur: 3.6000
  - transition: {type: dip, duration: 0.5}
  - id: hx_match   # n13-17, 36 frames
    section: whole
    focus: "whole coupe front-right 3/4, push toward the nose (lands on s5's first camera key)"
    src: /home/user/media/work/renders/huracan/hx_match
    src_fps: 11.8681
    interpolate: true
    dur: 2.9000
    vf: crop=iw:ih-29:0:0,pad=iw:ih+29:0:29:black
  - transition: {type: cut}
  - id: s5_frontopen   # n17-24: frames 1-72 at 1.15x
    section: front-open
    focus: "1:1 cut on the drop: same camera, now the Spyder - bumper, fender, hood open"
    src: /home/user/media/work/renders/huracan/s5_frontopen
    src_fps: 16.7441
    interpolate: true
    dur: 4.1667
  - transition: {type: cut}
  - id: sp_bumper   # n24-29: frames 6-60 at 1.22x
    section: front-open
    focus: "FRONT BUMPER: tips its inner face, hold on the structure behind"
    src: /home/user/media/work/renders/huracan/sp_bumper
    src_fps: 17.5532
    trim_start: 0.2848
    interpolate: true
    dur: 3.0000
  - transition: {type: cut}
  - id: sp_hood   # n29-34: frames 1-54 at 1.20x
    section: hood
    focus: "HOOD + COWLS lift off"
    src: /home/user/media/work/renders/huracan/sp_hood
    src_fps: 17.2340
    interpolate: true
    dur: 3.0000
  - transition: {type: cut}
  - id: sp_side   # n34-39: frames 1-54 at 1.20x
    section: side-open
    focus: "FENDER + SIDE SKIRT off"
    src: /home/user/media/work/renders/huracan/sp_side
    src_fps: 17.2340
    interpolate: true
    dur: 3.0000
  - transition: {type: cut}
  - id: c1_bumper   # n39-44: frames 1-45 at 1.00x
    section: rear-open
    focus: "REAR BUMPER off, hold on the structure"
    src: /home/user/media/work/renders/huracan/c1_bumper
    src_fps: 14.3617
    interpolate: true
    dur: 3.0000
  - transition: {type: cut}
  - id: c2_deck   # n44-49: frames 1-36 at 0.80x
    section: rear-open
    focus: "DECKLID + GRILLE (and beam) lift off"
    src: /home/user/media/work/renders/huracan/c2_deck
    src_fps: 11.4894
    interpolate: true
    dur: 3.0000
  - transition: {type: cut}
  - id: c3_exhaust   # n49-54: frames 1-45 at 1.00x
    section: exhaust
    focus: "EVO EXHAUST drops out"
    src: /home/user/media/work/renders/huracan/c3_exhaust
    src_fps: 14.3617
    interpolate: true
    dur: 3.0000
  - transition: {type: cut}
  - id: c4_wells   # n54-59: frames 1-36 at 0.80x
    section: wheel
    focus: "REAR WHEEL WELL, no liner"
    src: /home/user/media/work/renders/huracan/c4_wells
    src_fps: 11.4894
    interpolate: true
    dur: 3.0000
  - transition: {type: cut}
  - id: sp_finale   # n59-63: frames 1-38 at 1.06x
    section: whole
    focus: "Spyder fully exploded, top-down"
    src: /home/user/media/work/renders/huracan/sp_finale
    src_fps: 15.0000
    interpolate: true
    dur: 2.4000
  - transition: {type: cut}
  - id: c5_finale   # n63-68: frames 1-45 at 1.00x
    section: whole
    focus: "rear reassembles -> whole coupe pull-back"
    src: /home/user/media/work/renders/huracan/c5_finale
    src_fps: 14.3617
    interpolate: true
    dur: 3.0000
    vf: fade=t=out:st=2.400:d=0.6
  - transition: {type: cut}
  - id: logo   # ILLUMAESTHETIC logo 720 px on the music stop 43.88 s -> 46.9 s
    src: /home/user/media/huracan-evo/logo/end_card_720.png
    duration: 3.1
    dur: 3.0000
    vf: fade=t=in:st=0:d=0.5

overlays:   # one title-only label per teardown step
  - src: /home/user/media/work/out/hud_huracan_v13.mov
    start: 0
