# Mazda Miata NA - Temerario-style scan reel v2. v1: project_v1.yaml, review_v1.md. Plan: direction.md + director.md.
# v2 = reviewer on v1 (same first-revision issues as the siblings; cropped opening; repetitive steps; front bumper data first,
# then the back) + the parent's v2 brief and addendum (one continuous sequence per section, bumper-removed hero with labels,
# open states only where a registered scan of that state exists). Travel: whole -> front -> side -> rear -> top -> logo.
# Shots: tools/shots.py (timing.json) rendered with tools/shot.py (persistent data off). Labels: overlay.json (ScanHUD).
# Music: mazda-miata-na_track.mp3 (80s synthwave, generated for this reel; not in git). Kick grid 0.6068 + 0.5555 n s.
# Cuts on frames 151, 285, 418, 485, 551, 684, 818, 951 (152/685 pulled 1 frame to the measured kicks 5.042/22.812 s); end 1068 (35.6 s, music decay).
project: mazda-miata-na
format: reel-9x16
output: {path: /home/user/media/work/miata/out/mazda_miata_na_v2.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/mazda-miata-na_track.mp3   # not in git
  start: 0
  fade_out: 0.6

beats: [5.051, 9.495, 13.939, 16.161, 18.383, 22.827, 27.271, 29.493, 31.715]

timeline:
  - id: s1_reveal
    section: whole
    focus: "whole car, front-right 3/4, fully in frame; straight push toward the front"
    src: /home/user/media/work/miata/renders/final/s1_reveal
    src_fps: 15
    interpolate: true
    dur: 5.0000
  - transition: {type: cut, note: "b8 5.051 phrase"}
  - id: s2_bumper
    section: front
    focus: "front bumper part: lifts out into clear air, turns 135 deg to show its scanned inside"
    src: /home/user/media/work/miata/renders/final/s2_bumper
    src_fps: 15
    interpolate: true
    dur: 4.4667
  - transition: {type: cut, note: "b16 9.495 new layer"}
  - id: s3_front_removed
    section: front
    focus: "HERO: bumper-removed front end - crash beam, end brackets, radiator, wiring; move in from front-left and hold"
    src: /home/user/media/work/miata/renders/final/s3_front_removed
    src_fps: 15
    interpolate: true
    dur: 4.4333
  - transition: {type: cut, note: "b24 13.939 build"}
  - id: s3_hood
    section: front
    focus: "hood opens on its fitted cowl hinge (-44.4 deg capture) over the engine bay (first 4 beats of the render)"
    src: /home/user/media/work/miata/renders/final/s3_hood
    src_fps: 15
    interpolate: true
    dur: 2.2333
  - transition: {type: cut, note: "b28 16.161 riser"}
  - id: s4b_side
    section: side
    focus: "right side: wheels, Toyo tyres, brakes, mirror, door line - straight low dolly front to rear"
    src: /home/user/media/work/miata/renders/final/s4b_side
    src_fps: 15
    interpolate: true
    dur: 2.2000
  - transition: {type: cut, note: "b32 18.383 THE DROP"}
  - id: s5_trunk
    section: rear
    focus: "trunk lid closed -> half (37.5) -> open (55.6): the three trunk captures, rear-right"
    src: /home/user/media/work/miata/renders/final/s5_trunk
    src_fps: 15
    interpolate: true
    dur: 4.4333
  - transition: {type: cut, note: "b40 22.827 phrase"}
  - id: s6_trunk_well
    section: rear
    focus: "trunk lid underside ribs + trunk well, crane behind the open lid"
    src: /home/user/media/work/miata/renders/final/s6_trunk_well
    src_fps: 15
    interpolate: true
    dur: 4.4667
  - transition: {type: cut, note: "b48 27.271 phrase change"}
  - id: s7_top_home
    section: top
    focus: "top-down: bumper slides home, hood + lid close, lock b52, hold"
    src: /home/user/media/work/miata/renders/final/s7_top_home
    src_fps: 15
    interpolate: true
    dur: 4.4333
  - transition: {type: dip, duration: 0.6, note: "b56 31.715 phrase change - fade through black"}
  - id: logo
    section: end
    focus: "small ILLUMAESTHETIC logo (470 px), fades with the music's decay"
    src: /home/user/media/work/miata/out/logo_card_v2.mp4
    dur: 4.5000

overlays:
  - src: /home/user/media/work/miata/out/hud_v2.mov
    start: 0
