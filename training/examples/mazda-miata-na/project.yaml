# Mazda Miata NA - scan reel v5 (v1-v4: project_v*.yaml). v5 = reviewer on v4: "make the car pink, make the whole thing faster,
# edit it so the music starts at the beginning". Same renders: scan clips graded pink (vf curves, black kept black; website CTA untouched),
# shots mostly played 2x (s1 4x, s3 1.35x for its two labels), music from its first note at frame 0 (start 0.68).
# Grid: video t = 0.32132 n - 0.6172; cuts every 4 track beats on n = 2 + 4j: frames 39,116,232,270,309,386,463; end 617 (20.57 s, n66 phrase downbeat).
# ive assemble quirk: a new shot shows one frame after the summed durs -> first clip one frame short, last one long.
project: mazda-miata-na
format: reel-9x16
output: {path: /home/user/media/work/miata/out/mazda_miata_na_v5.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/mazda-miata-na_v3_track.m4a   # user upload, not in git
  start: 0.70   # v5: track from its beginning (first note at frame 0); 0.70 not 0.68 - measured onsets sat ~20 ms behind the cuts at 0.68
  fade_out: 0.6

beats: [1.300, 3.867, 7.733, 9.000, 10.300, 12.867, 15.433]

timeline:
  - id: s1_reveal
    section: whole
    focus: "whole car, front-right 3/4, fully in frame; straight push toward the front"
    src: /home/user/media/work/miata/renders/final/s1_reveal
    src_fps: 60
    vf: "curves=r='0/0 0.04/0.03 0.3/0.42 0.75/0.95 1/1':g='0/0 0.04/0.027 0.3/0.1 0.75/0.42 0.93/0.8 1/1':b='0/0 0.04/0.035 0.3/0.2 0.75/0.62 1/1'"
    dur: 1.2667
  - transition: {type: cut, note: "j1 n6 1.295 s"}
  - id: s2_bumper
    section: front
    focus: "front bumper part: lifts out into clear air, turns 135 deg to show its scanned inside"
    src: /home/user/media/work/miata/renders/final/s2_bumper
    src_fps: 30
    vf: "curves=r='0/0 0.04/0.03 0.3/0.42 0.75/0.95 1/1':g='0/0 0.04/0.027 0.3/0.1 0.75/0.42 0.93/0.8 1/1':b='0/0 0.04/0.035 0.3/0.2 0.75/0.62 1/1'"
    dur: 2.5667
  - transition: {type: cut, note: "j3 n14 3.865 s"}
  - id: s3_front_removed
    section: front
    focus: "HERO: bumper-removed front end - crash beam, end brackets, radiator, wiring; move in from front-left and hold"
    src: /home/user/media/work/miata/renders/final/s3_front_removed
    src_fps: 20.17
    interpolate: true
    vf: "curves=r='0/0 0.04/0.03 0.3/0.42 0.75/0.95 1/1':g='0/0 0.04/0.027 0.3/0.1 0.75/0.42 0.93/0.8 1/1':b='0/0 0.04/0.035 0.3/0.2 0.75/0.62 1/1'"
    dur: 3.8667
  - transition: {type: cut, note: "j6 n26 7.721 s phrase downbeat"}
  - id: s3_hood
    section: front
    focus: "hood opens on its fitted cowl hinge (-44.4 deg capture) over the engine bay"
    src: /home/user/media/work/miata/renders/final/s3_hood
    src_fps: 30
    vf: "curves=r='0/0 0.04/0.03 0.3/0.42 0.75/0.95 1/1':g='0/0 0.04/0.027 0.3/0.1 0.75/0.42 0.93/0.8 1/1':b='0/0 0.04/0.035 0.3/0.2 0.75/0.62 1/1'"
    dur: 1.2667
  - transition: {type: cut, note: "j7 n30 9.006 s"}
  - id: s4b_side
    section: side
    focus: "right side: wheels, Toyo tyres, brakes, mirror, door line - straight low dolly front to rear"
    src: /home/user/media/work/miata/renders/final/s4b_side
    src_fps: 30
    vf: "curves=r='0/0 0.04/0.03 0.3/0.42 0.75/0.95 1/1':g='0/0 0.04/0.027 0.3/0.1 0.75/0.42 0.93/0.8 1/1':b='0/0 0.04/0.035 0.3/0.2 0.75/0.62 1/1'"
    dur: 1.3000
  - transition: {type: cut, note: "j8 n34 10.291 s phrase downbeat"}
  - id: s5_trunk
    section: rear
    focus: "trunk lid closed -> half (37.5) -> open (55.6): the three trunk captures, rear-right; holds on the open trunk well (no separate zoom)"
    src: /home/user/media/work/miata/renders/final/s5_trunk
    src_fps: 30
    vf: "curves=r='0/0 0.04/0.03 0.3/0.42 0.75/0.95 1/1':g='0/0 0.04/0.027 0.3/0.1 0.75/0.42 0.93/0.8 1/1':b='0/0 0.04/0.035 0.3/0.2 0.75/0.62 1/1'"
    dur: 2.5667
  - transition: {type: cut, note: "j10 n42 12.862 s section change"}
  - id: s7_top_home
    section: top
    focus: "top-down: bumper, hood, lid go home, then the camera swings down onto the listing cover-photo camera and holds (1:1 into cta)"
    src: /home/user/media/work/miata/renders/final/s7_top_home
    src_fps: 30
    vf: "curves=r='0/0 0.04/0.03 0.3/0.42 0.75/0.95 1/1':g='0/0 0.04/0.027 0.3/0.1 0.75/0.42 0.93/0.8 1/1':b='0/0 0.04/0.035 0.3/0.2 0.75/0.62 1/1'"
    dur: 2.5667
  - transition: {type: cut, note: "j12 n50 15.433 s phrase downbeat - HARD 1:1 cut: s7 ends on the cover-photo camera, cta starts on the cover photo"}
  - id: cta
    section: end
    focus: "CTA: 1:1 on the cover photo of the mobile listing (Photos tab, iPhone 13 capture), page pulls back into a phone frame; MIATA NA SCAN NOW AVAILABLE, logo, URL last"
    src: /home/user/media/work/miata/out/cta_v3.mp4
    dur: 5.1667

overlays:
  - src: /home/user/media/work/miata/out/hud_v5.mov
    start: 0
