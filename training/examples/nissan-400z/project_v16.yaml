  - transition: {type: cut, note: "44.049 phrase - hero"}
  - id: HERO     # kitted liveried car; native 30 fps, swings in and settles on the solved SEMA-photo camera (55 f shown)
    src: /home/user/media/work/z400/renders/final/HERO
