# Porsche Macan (Electric) - Temerario-style scan reel, v3 (user: rear plate removed, interior + exploded view; plan direction.md v3).
# v2: v1 (never delivered): project_v1.yaml.
# v2 = user's rules for all reels (relayed by the parent session): scene order from this car's scan features, one pass
# front -> side -> rear, one continuous sequence per section, progressive per-section explode with the camera on the
# part that comes off, bumper-removed state scans as the hero beats (with factual labels), whole car in the opener,
# fade then a small logo. Plan: direction.md (scene director) + director.md (shot director).
# Music: porsche-macan_track.mp3 (deep house generated for this reel, 118.03 BPM, kick grid 16.3099 + 0.50836 n).
# Intro hits 4.109 / 8.176 / 9.701 / 11.226, hit-less build 11.2-16.3, DROP 16.310, kicks 20.377, 24.440, 25.460,
# phrase 28.511, groove stops 30.544, pad tail to ~33.6.
# v3 cuts on frames: 123, 245, 291, 489, 611, 764, 855, 947; end 1008 (33.6 s).
# Clip durs are whole frames; first clip one frame short (assembler adds the cut hold frame).
project: porsche-macan
format: reel-9x16
output: {path: /home/user/media/work/macan/out/porsche_macan_v3.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/porsche-macan_track.mp3   # not in git
  start: 0
  fade_out: 0.8

beats: [4.109, 8.176, 9.701, 11.226, 16.310, 20.377, 21.394, 22.410, 23.427, 24.440, 25.460, 28.511, 29.527, 30.544, 31.56]

timeline:
  - id: O_whole        # whole car, low front-right 3/4, slow drift; fades up with the track
    section: whole
    focus: "whole car, front 3/4"
    src: /home/user/media/work/macan/renders/final/O_whole
    src_fps: 15
    interpolate: true
    dur: 4.0667
    vf: "fade=t=in:st=0:d=1.2"
  - transition: {type: cut, note: "4.109 intro hit"}
  - id: N_face         # front face slide: left lamp -> intakes -> right lamp (3 mm)
    section: front
    focus: "front face: lamps + intakes"
    src: /home/user/media/work/macan/renders/final/N_face
    src_fps: 15
    interpolate: true
    dur: 4.0667
  - transition: {type: cut, note: "8.176 phrase hit"}
  - id: s3_wheel       # front right wheel close-up (v1 render, same slot)
    section: front
    focus: "front right wheel"
    src: /home/user/media/work/macan/renders/final/s3_wheel
    src_fps: 15
    interpolate: true
    dur: 1.5333
  - transition: {type: cut, note: "9.701 hit"}
  - id: F1_bay         # one move over the hit-less build; hood opens on its fitted hinge at 11.226 -> push into the bay (Hood Removed)
    section: front
    focus: "hood opens -> bay"
    src: /home/user/media/work/macan/renders/final/F1_bay
    src_fps: 15
    interpolate: true
    dur: 6.6
  - transition: {type: cut, note: "16.310 DROP - front bumper comes off"}
  - id: F2_fbumper     # bumper forward, flips to show its scanned inside (17.327), leaves up; camera moves in on the crash beam
    section: front
    focus: "front bumper inside -> crash beam"
    src: /home/user/media/work/macan/renders/final/F2_fbumper
    src_fps: 15
    interpolate: true
    dur: 4.0667
  - transition: {type: cut, note: "20.377 kick"}
  - id: S1v3           # left side + interior: fender 20.377, FL door 21.394, driver seat 22.41, RL door 23.427, rear bench 24.44
    section: side
    focus: "left doors off -> driver seat + rear bench out"
    src: /home/user/media/work/macan/renders/final/S1v3
    src_fps: 15
    interpolate: true
    dur: 5.1
  - transition: {type: cut, note: "25.460 kick"}
  - id: R1v3           # hatch opens (Rear Hatch Fully Open), rear bumper out to the side, push in on the tubular crash beam + mount
    section: rear
    focus: "rear bumper off -> crash beam + mounts"
    src: /home/user/media/work/macan/renders/final/R1v3
    src_fps: 15
    interpolate: true
    dur: 3.0333
  - transition: {type: cut, note: "28.511 phrase"}
  - id: X3             # full exploded view (panels + seats), slow orbit, flies home 29.527, locks 30.544, fade
    section: whole
    focus: "exploded view -> parts lock home"
    src: /home/user/media/work/macan/renders/final/X3
    src_fps: 15
    interpolate: true
    dur: 3.0667
    vf: "fade=t=out:st=2.6:d=0.45"
  - transition: {type: cut, note: "31.56 small logo over the pad tail"}
  - id: logo           # tools/logo_card.py --secs 2.0333 --width 720 (user v3: "logo too small"; lesson: 720 px)
    src: /home/user/media/work/macan/out/logo_card_v3.mp4
    dur: 2.0333

overlays:
  - src: /home/user/media/work/macan/out/hud_v3.mov   # ive hud projects/porsche-macan/overlay.json (labels over F2 and R1 only)
    start: 0
