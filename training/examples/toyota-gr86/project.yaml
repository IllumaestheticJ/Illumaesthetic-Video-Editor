# Toyota GR86 / Subaru BRZ (gen 2) - Temerario-style scan reel (scan only: no IRL footage; v2 adds 3 factual state-scan labels).
# Hero scan: "BRZ Full Car" (all Bomex state/part scans are registered to it; see clips.md). House satin silver on black.
# Shots: tools/shots_v2.py (+ s3, s7 from tools/shots.py) rendered by tools/shot.py (keyed cameras + parts).
# Music: toyota-gr86_track.mp3 - original lo-fi drift funk generated for this reel by the parent session (ElevenLabs via
# Higgsfield). tools/accents.py: bar downbeats (strongest kicks) every 2.449 s from 0.064 s (98.0 BPM); audible to 39.24 s.
# v2 (direction.md / director.md): cuts on downbeats 4.962, 7.411, 17.207, 24.554, 31.901, 36.799 (accents.py grid).
# Decoded-audio check: every kick half-rises ~30 ms BEFORE that grid (4.931, 7.381, 17.179, 24.523, 31.872, 36.766),
# so the cuts sit one frame earlier: frames 148, 221, 515, 736, 956, 1103.
# Clip durs are whole frames; first clip one frame short (assembler adds the cut hold frame).
project: toyota-gr86
format: reel-9x16
output: {path: /home/user/media/work/gr86/out/toyota_gr86_v2.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/toyota-gr86_track.mp3   # not in git
  start: 0
  fade_out: 0.3

beats: [4.962, 7.411, 17.207, 24.554, 31.901, 36.799]

timeline:
  - id: a_open         # whole car, front-right 3/4 dolly-in (motion from frame 1), 2 bars
    src: /home/user/media/work/gr86/shots/a_open
    section: whole
    focus: "whole car, front-right 3/4, ~20 deg arc + push from frame 1"
    src_fps: 15
    interpolate: true
    dur: 4.9
  - transition: {type: cut, note: "4.962 downbeat"}
  - id: b_headlight    # FRONT: right headlight + slat grille + intake, 2 mm crop (s3 render from 2.4 s), 1 bar
    src: /home/user/media/work/gr86/shots/s3_wheel
    section: front
    focus: "right headlight + slat grille + intake detail (2 mm crop)"
    src_fps: 15
    trim_start: 2.4
    interpolate: true
    dur: 2.4333
  - transition: {type: cut, note: "7.411 downbeat"}
  - id: c_front        # FRONT: hood lifts off (lands 9.860), engine bay (Hood Open scan), front bumper off + tipped (lands 14.758), push-in on the front structure (Bumper Hood Removed scan)
    src: /home/user/media/work/gr86/shots/d_front
    section: front
    focus: "hood lifts off -> engine bay (Hood Open scan) -> FRONT BUMPER REMOVED: crash beam + mounts (Bumper Hood Removed scan)"
    src_fps: 15
    interpolate: true
    dur: 9.8
  - transition: {type: cut, note: "17.207 downbeat"}
  - id: d_rear         # REAR: rear bumper off + tipped (lands 19.656), push-in on the rear crash beam + exhaust (Rear Bumper Removed scan)
    src: /home/user/media/work/gr86/shots/g_rear
    section: rear
    focus: "REAR BUMPER REMOVED: bumper tips out, push-in on the holed rear crash beam + exhaust (Rear Bumper Removed scan)"
    src_fps: 15
    interpolate: true
    dur: 7.3667
  - transition: {type: cut, note: "24.554 phrase start"}
  - id: e_stack        # TOP: removed parts rise into a layered stack (27.003), crane to high rear 3/4
    src: /home/user/media/work/gr86/shots/s_stack
    section: top
    focus: "removed parts (hood, both bumpers) rise into a layered stack over the car"
    src_fps: 15
    interpolate: true
    dur: 7.3333
  - transition: {type: cut, note: "31.901 downbeat"}
  - id: f_reassemble   # WHOLE: s7 from frame 111 - parts drift, slam home on the 34.350 loud return, settle, fade to black
    src: /home/user/media/work/gr86/shots/s7_explode
    section: whole
    focus: "parts slam home on the 34.350 return; car complete, fades out"
    src_fps: 15
    trim_start: 7.3333
    interpolate: true
    dur: 4.9
    vf: "fade=t=out:st=2.9:d=2.0:color=0x070709"   # parts home at 2.449; ive director flagged a 2.4 s dead hold -> fade from 0.45 s after they land
  - transition: {type: cut, note: "36.799 downbeat"}
  - id: logo           # small ILLUMAESTHETIC logo (330 px) on black, fades with the track (audible to 39.24)
    src: /home/user/media/work/gr86/out/logo_card_small.mp4
    section: end
    focus: "small ILLUMAESTHETIC logo"
    dur: 2.5

overlays:
  - src: /home/user/media/work/gr86/out/hud_gr86_v2.mov   # python -m ive hud projects/toyota-gr86/overlay.json
    start: 0
