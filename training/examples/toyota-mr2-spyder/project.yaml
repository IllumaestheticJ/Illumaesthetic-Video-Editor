# MR2 Spyder v3 - direction.md 2026-11-12. Plain concat (projects/honda-s2000/tools/concat_assemble.py), exact frames per clip.
# Music: user-supplied Gran Turismo 2 "East City" theme, reel starts at music 0.239 s (first sound). Cuts sit on the
# measured onsets of beats n = 16, 20, 24, 32, 40, 48 (1:1 cut), 55, 66 (1 ms RMS rise on the decoded file).
project: toyota-mr2-spyder
format: reel-9x16
output: {path: /home/user/media/work/mr2/out/mr2_spyder_v3.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}
music:
  path: /home/user/media/work/music/mr2_eastcity.wav   # not in git
  start: 0.239
  fade_out: 1.2
beats: [7.867, 9.833, 11.767, 15.733, 19.667, 23.600, 27.100, 32.433]
timeline:
  - id: v1_front   # FRONT: whole car -> hood hinges -> real bumper part off on n 8 -> close hold
    section: front
    focus: real front bumper comes off, structure behind it
    src: /home/user/media/work/renders/mr2/v1_front
    src_fps: 15.125
    interpolate: true
    frames: 236
    dur: 7.8667
  - transition: {type: cut}
  - id: v2a_under_front   # UNDERBODY FRONT (Kouki and Undertray scan alone, from below)
    section: underbody front
    focus: front undertray and subframe
    src: /home/user/media/work/renders/mr2/v2a_under_front
    src_fps: 15.7143
    interpolate: true
    frames: 59
    dur: 1.9667
  - transition: {type: cut}
  - id: v2b_under_rear   # UNDERBODY REAR (Rear Underbody scan alone, from below)
    section: underbody rear
    focus: exhaust and drivetrain underside
    src: /home/user/media/work/renders/mr2/v2b_under_rear
    src_fps: 15.9677
    interpolate: true
    frames: 58
    dur: 1.9333
  - transition: {type: cut}
  - id: v3_engine   # ENGINE BAY: lid hinges on n 24, push to 1.7 m and hold
    section: rear
    focus: engine bay under the hinged lid
    src: /home/user/media/work/renders/mr2/v3_engine
    src_fps: 15.122
    interpolate: true
    frames: 119
    dur: 3.9667
  - transition: {type: cut}
  - id: v4a_kit_rear   # KIT REAR: scanned hardtop leaves, red Epsilon parts land
    section: kit rear
    focus: Epsilon wing, duckbill, spats, diffuser, hardtop landing
    src: /home/user/media/work/renders/mr2/v4a_kit_rear
    src_fps: 15.2459
    interpolate: true
    frames: 118
    dur: 3.9333
  - transition: {type: cut}
  - id: v4b_kit_front   # KIT FRONT: ends on the pose the CGI inherits
    section: kit front
    focus: Epsilon skirts, vents, eyelids, bumper closing the nose
    src: /home/user/media/work/renders/mr2/v4b_kit_front
    src_fps: 15.2459
    interpolate: true
    frames: 118
    dur: 3.9333
  - transition: {type: cut}
  - id: c1_drive_front   # 1:1 HARD CUT to the CGI lookbook car (no real driving shot exists)
    section: drive front
    focus: finished car driving, same pose
    src: /home/user/media/work/renders/mr2/c1_drive_front
    src_fps: 30
    frames: 105
    dur: 3.5000
  - transition: {type: cut}
  - id: c2_drive_rear   # CGI rear follow, car pulls away, fade
    section: drive rear
    focus: car pulls away
    src: /home/user/media/work/renders/mr2/c2_drive_rear
    src_fps: 30
    frames: 160
    dur: 5.3333
    vf: fade=t=out:st=4.33:d=0.9
  - transition: {type: cut}
  - id: logo   # ILLUMAESTHETIC logo card, 720 px wide
    src: /home/user/media/work/mr2/out/logo_card_v3.mp4
    frames: 100
    dur: 3.3333
overlays:   # composited by concat_assemble in the same pass (do not add a second label pass)
  - src: /home/user/media/work/mr2/out/hud_v4.mov
    start: 0
