# Toyota Sera - v6. User on v5 (2026-11-14): "include the rear wing and front fog light/corner marker data too".
#   - FOG LIGHT / CORNER MARKER: the 'light' scan = two units, the front bumper's sub-parts (tools/light_parts.py); own shot
#     b24-28: the bumper alone, both units pull out of their corners.
#   - REAR WING: cut from the full car as a region (tools/wing_cut.py; 'Spoiler removed' fills only the skin it hid);
#     own shot b34-38 (lifts off, clears frame, camera in on the deck), off for the rear bumper, in the explode and home.
#   - Room: the front-wheel close-up is dropped (format rule: no wheel close-ups); front moves to b8-24; the rear bumper
#     shot is re-timed to b38-44. Same 60 beats, same CTA. v5: project_v5.yaml.
# Cuts on frames: 145, 433, 505, 613, 685, 793, 937, 1009 (lock swap), 1081 (CTA); end 1179.
#
# Toyota Sera - v5. User on v4 (2026-11-13): "there are artifacts of the hood that aren't cleanly cut out" -> hood re-cut as a
# region (tools/hood_clean.py), fills limited to their region (explode_base.py), front/rear/explode/reassembly re-rendered.
# Same timeline as v4 (project_v4.yaml).
#
# v4. User on v3 (2026-11-13): "add the scan data call to action to the end, where it
# aligned to the website mobile listing" -> the reassembly orbits round the rear to the solved camera of the listing's 360
# viewer on the mobile page (tools/solve_listing.py, IoU 0.972) and the CTA (tools/cta_card.py) shrinks that frame 1:1 onto
# the listing car in the phone; logo + SCAN DATA AVAILABLE NOW + ILLUMAESTHETIC.COM. Replaces the fade + logo card.
# v3 cut: project_v3.yaml.
#
# Scan only, no text. Order from this car's scan data, travelling front -> side -> rear (projects/toyota-sera/direction.md,
# director.md): whole car -> front wheel -> FRONT (hood opens, front bumper off + inner face over the crash structure)
# -> SIDE (both butterfly doors, cabin) -> REAR (rear bumper off + inner face over the rear structure) -> progressive
# explode (front assembly / doors + rear bumper / reassembly, swap to the clean car on the lock) -> fade -> small logo.
# Earlier cut: project_v2.yaml (turntables, rotating top-down, all-at-once explode).
# Music: toyota-sera_track.mp3 (generated for this reel), kick grid 0.0355 + 0.59999 n (100.0 BPM, tools/accents.py);
# 8-beat phrases from 0.036 s; kick break 25.2-27.6 s; music stops 38.435 s -> reel ends 39.30 s.
# Cuts on frames round(t*30): 145, 217, 505, 613, 793, 937, 1009 (lock swap), 1081; end 1179.
# Addendum (user): bumper-removed data is the hero beat with short factual labels (overlay.json); each section once.
# Clip durs are whole frames; first clip one frame short (the assembler adds the cut hold frame).
project: toyota-sera
format: reel-9x16
output: {path: /home/user/media/work/sera/out/toyota_sera_v6.mp4, width: 1080, height: 1920, fps: 30, crf: 16, preset: slow}

music:
  path: /home/user/media/work/music/toyota-sera_track.mp3   # not in git
  start: 0
  fade_out: 0.3

beats: [4.835, 14.435, 16.835, 20.435, 22.835, 26.435, 31.235, 33.635, 36.035]

timeline:
  - id: v3_s1_whole       # b0-8: whole car, front-right 3/4, pushing in 6.8 -> 5.6 m (car 73-75 % of the width)
    section: whole
    focus: the whole Sera
    src: /home/user/media/work/sera/renders/final/v3_s1_whole
    src_fps: 15
    interpolate: true
    dur: 4.8
  - transition: {type: cut, note: "4.835 b8 phrase downbeat"}
  - id: v3_front          # b8-24 FRONT (v6: was b12-28, same render), one held shot: hood opens b13-16; bumper out b16-18, inner face b18-22 (label),
    section: front
    # clears frame b22-24; camera in on the structure behind it (front-bumper-removed state) b24-28 (label)
    focus: front - engine bay, front bumper inner face, structure behind the bumper
    src: /home/user/media/work/sera/renders/final/v3_front
    src_fps: 15
    interpolate: true
    dur: 9.6
  - transition: {type: cut, note: "14.435 b24"}
  - id: v5_lights         # b24-28 FRONT, sub-parts: the bumper alone, both fog light / corner marker units pull out
    section: front
    focus: fog light / corner marker units (the 'light' scan), front bumper openings
    src: /home/user/media/work/sera/renders/final/v5_lights
    src_fps: 15
    interpolate: true
    dur: 2.4
  - transition: {type: cut, note: "16.835 b28"}
  - id: v3_s4_doors       # b28-34 SIDE: both butterfly doors open b29-33 (real 'Door Open' interior)
    section: side
    focus: butterfly doors + cabin
    src: /home/user/media/work/sera/renders/final/v3_s4_doors
    src_fps: 15
    interpolate: true
    dur: 3.6
  - transition: {type: cut, note: "20.435 b34"}
  - id: v5_wing           # b34-38 REAR: the wing lifts off and clears frame; camera in on the deck it sat on
    section: rear
    focus: rear wing / deck under it ('Spoiler removed')
    src: /home/user/media/work/sera/renders/final/v5_wing
    src_fps: 15
    interpolate: true
    dur: 2.4
  - transition: {type: cut, note: "22.835 b38"}
  - id: v5_rear           # b38-44 REAR (6 beats, wing already off): bumper out b38.2-39.6, inner face b39.6-41.2 (label), clears; camera in on the
    section: rear
    # rear structure (rear-bumper-removed state) b40-44 (label)
    focus: rear - bumper inner face, structure behind the bumper
    src: /home/user/media/work/sera/renders/final/v5_rear
    src_fps: 15
    interpolate: true
    dur: 3.6
  - transition: {type: cut, note: "26.435 b44 (inside the kick break; the kicks return at 28.2)"}
  - id: v5_explode        # b44-52: progressive whole-car explode - front assembly, doors, rear bumper, rear wing on successive beats
    section: explode
    focus: every scanned panel, whole car in frame
    src: /home/user/media/work/sera/renders/final/v5_explode
    src_fps: 15
    interpolate: true
    dur: 4.8
  - transition: {type: cut, note: "31.235 b52"}
  - id: v5_g3a_home       # b52-56: parts fly home while the camera orbits 135 -> 235 deg round the rear, LOCK on b56
    section: reassembly
    focus: reassembly
    src: /home/user/media/work/sera/renders/final/v5_g3a_home
    src_fps: 15
    interpolate: true
    dur: 2.4
  - transition: {type: cut, note: "33.635 b56 lock - swap to the clean full-car scan, same camera"}
  - id: v5_g3b_clean      # b56-60 (orbit r0 7.0, same end pose): clean car, camera eases to a stop on the listing camera exactly at b60
    section: reassembly
    focus: the reassembled car
    src: /home/user/media/work/sera/renders/final/v5_g3b_clean
    src_fps: 15
    interpolate: true
    dur: 2.4
  - transition: {type: cut, note: "36.035 b60 - same frame: the CTA starts by shrinking it onto the listing car (1:1)"}
  - id: cta               # tools/cta_card.py <v4_g3b_clean f_0037> sera_mobile.png --map listing_cam.json --secs 3.2667
    section: cta
    focus: "mobile listing: 1:1 scan -> listing 360 viewer, SCAN DATA AVAILABLE NOW / ILLUMAESTHETIC.COM"
    src: /home/user/media/work/sera/out/cta_card.mp4
    dur: 3.2667

overlays:
  - src: /home/user/media/work/sera/out/hud_v6.mov   # ive hud projects/toyota-sera/overlay.json (6 scan labels)
    start: 0
